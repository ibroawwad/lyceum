/* ============================================================
   Lyceum — design system
   Registrar's bulletin meets the exam-hall clock: hairline rules,
   tabular numerals, a bottle-green seal, sharp 3px corners.
   ============================================================ */
:root {
  --paper: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e9ebe6;
  --ink: #14161a;
  --ink-2: #2e323a;
  --muted: #676d66;
  --line: #d6d9d2;
  --line-2: #c0c5bc;
  --accent: #0e5a47;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe3;
  --good: #1e7a4c;
  --warn: #a8651a;
  --bad: #b3261e;
  --focus: #2b6cb0;
  --shadow: 0 1px 2px rgba(20, 22, 26, 0.06), 0 8px 24px rgba(20, 22, 26, 0.08);
  --radius: 3px;
  --radius-sm: 2px;
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --course-s: 42%;
  --course-l: 36%;
  --rail-w: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121413; --surface: #1a1d1b; --surface-2: #232725; --ink: #eceee9; --ink-2: #c9cdc6; --muted: #8f958d;
    --line: #2c312d; --line-2: #3d433e; --accent: #5fbf9e; --accent-ink: #0b1f18; --accent-soft: #163b31;
    --good: #58b984; --warn: #d9a055; --bad: #e5645b; --focus: #7fb3f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
    --course-s: 45%; --course-l: 62%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121413; --surface: #1a1d1b; --surface-2: #232725; --ink: #eceee9; --ink-2: #c9cdc6; --muted: #8f958d;
  --line: #2c312d; --line-2: #3d433e; --accent: #5fbf9e; --accent-ink: #0b1f18; --accent-soft: #163b31;
  --good: #58b984; --warn: #d9a055; --bad: #e5645b; --focus: #7fb3f0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
  --course-s: 45%; --course-l: 62%; color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
p { margin: 0 0 12px; } p:last-child { margin-bottom: 0; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- type ---------- */
.display { font-family: var(--font-display); font-weight: 500; font-size: 34px; line-height: 1.12; letter-spacing: -0.01em; font-variation-settings: "opsz" 48; }
.serif { font-family: var(--font-display); }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 13px; } .muted { color: var(--muted); }
.label, .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow { display: block; margin-bottom: 10px; }
.lede { font-size: 16px; color: var(--ink-2); max-width: 64ch; margin-top: 8px; }
.nowrap { white-space: nowrap; } .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; } .center { text-align: center; } .w-full { width: 100%; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 20px; } .mt-4 { margin-top: 32px; }
.mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 12px; } .mb-3 { margin-bottom: 20px; } .mb-4 { margin-bottom: 32px; }
.gap-1 { gap: 6px; } .gap-2 { gap: 12px; } .gap-3 { gap: 20px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--paper); padding: 22px 18px 18px; }
.rail-brand { display: flex; align-items: baseline; gap: 10px; padding: 0 8px 20px; }
.rail-brand .wordmark { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 26px; letter-spacing: -0.01em; color: var(--ink); }
.rail-brand .est { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2); font-weight: 500; font-size: 14px; border-left: 2px solid transparent; }
.rail-nav a:hover { background: var(--surface-2); text-decoration: none; }
.rail-nav a[aria-current="page"] { background: var(--surface); color: var(--ink); border-left-color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
.rail-nav a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; flex: none; }
.rail-nav .badge { margin-left: auto; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.rail-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.rail-clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.rail-clock .big { font-size: 28px; font-weight: 500; line-height: 1; letter-spacing: 0.02em; color: var(--ink); }
.rail-clock .sub { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
.rail-next { font-size: 12.5px; color: var(--ink-2); padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.rail-next .label { display: block; margin-bottom: 3px; }
.rail-next .when { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 500; }
.rail-student { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.rail-student .seal { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 15px; flex: none; }
.rail-student .name { font-weight: 600; font-size: 13.5px; line-height: 1.2; } .rail-student .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.main { min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 36px 44px 72px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 20px; margin-bottom: 28px; border-bottom: 1px solid var(--line-2); }
.page-head .actions { display: flex; gap: 8px; flex: none; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.cols { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 32px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 20px; }
.divider { height: 1px; background: var(--line); margin: 20px 0; border: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
.card-body { padding: 16px; }
.panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; }
.empty { padding: 56px 32px; text-align: left; border: 1px dashed var(--line-2); border-radius: var(--radius); max-width: 640px; }
.empty h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin-bottom: 10px; }
.empty p { color: var(--ink-2); max-width: 52ch; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; line-height: 1.2; cursor: pointer; white-space: nowrap; transition: background 120ms, border-color 120ms, transform 60ms; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-quiet:hover { background: var(--surface-2); }
.btn-danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn-danger:hover { background: color-mix(in srgb, var(--bad) 10%, transparent); }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled], .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.input, .textarea, .select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 600; font-size: 13px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.switch { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.switch button { padding: 6px 12px; border: 0; background: transparent; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.drop { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); background: var(--surface); transition: border-color 120ms, background 120ms; }
.drop.is-over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop input { display: none; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 300ms; }
.progress.is-over > i { background: var(--bad); }
.log { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.log div::before { content: "› "; color: var(--muted); }
.busy { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 16px; margin-bottom: 20px; }
.busy-bar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.busy-bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: busy 1.2s ease-in-out infinite; }
@keyframes busy { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- data ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table .num, .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .row-muted td { color: var(--muted); }
.table-wrap { overflow-x: auto; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.tile { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tile-n { font-family: var(--font-mono); font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile-l { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 10px; font-size: 12px; font-weight: 500; line-height: 1.5; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.chip[data-state="open"], .chip[data-state="good"], .chip[data-state="running"] { border-color: var(--accent); color: var(--accent); }
.chip[data-state="open"]::before, .chip[data-state="good"]::before, .chip[data-state="running"]::before { background: var(--accent); }
.chip[data-state="late"], .chip[data-state="warn"], .chip[data-state="in_progress"] { border-color: var(--warn); color: var(--warn); }
.chip[data-state="late"]::before, .chip[data-state="warn"]::before, .chip[data-state="in_progress"]::before { background: var(--warn); }
.chip[data-state="missed"], .chip[data-state="bad"] { border-color: var(--bad); color: var(--bad); }
.chip[data-state="missed"]::before, .chip[data-state="bad"]::before { background: var(--bad); }
.chip[data-state="graded"], .chip[data-state="submitted"], .chip[data-state="completed"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[data-state="graded"]::before, .chip[data-state="submitted"]::before, .chip[data-state="completed"]::before { background: var(--paper); }
.chip[data-state="upcoming"], .chip[data-state="neutral"], .chip[data-state="withdrawn"] { color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--ch, 160) var(--course-s) var(--course-l)); flex: none; }
.code { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.04em; color: hsl(var(--ch, 160) var(--course-s) var(--course-l)); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 3px; background: var(--surface-2); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); }
.meter .val { font-family: var(--font-mono); font-size: 13px; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.letter { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1; }

/* ---------- today ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 24px; align-items: start; }
.agenda { display: flex; flex-direction: column; }
.agenda-item { display: grid; grid-template-columns: 96px 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.agenda-item:last-child { border-bottom: 0; }
.agenda-item .time { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.agenda-item .who { display: flex; align-items: center; gap: 8px; }
.agenda-item .what { min-width: 0; }
.agenda-item .what .t { font-weight: 500; }
.agenda-item .what .s { font-size: 12.5px; color: var(--muted); }
.agenda-item.is-past { opacity: 0.6; }
.due-list .agenda-item { grid-template-columns: 130px 110px minmax(0, 1fr) auto; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-left: 3px solid var(--warn); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; font-size: 13.5px; }
.notice[data-kind="bad"] { border-left-color: var(--bad); }
.notice[data-kind="good"] { border-left-color: var(--accent); }
.standing-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.standing-row:last-child { border-bottom: 0; }

/* ---------- course ---------- */
.course-lockup { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.course-lockup .code { font-size: 15px; }
.course-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 13.5px; color: var(--ink-2); }
.course-meta b { font-weight: 600; color: var(--ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); margin: 24px 0 20px; }
.tabs a { padding: 8px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.syllabus { display: flex; flex-direction: column; }
.week-row { display: grid; grid-template-columns: 56px 118px minmax(0, 1fr) 190px 210px; gap: 16px; padding: 16px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
.week-row:last-child { border-bottom: 0; }
.week-row.is-current { background: var(--surface); border-left-color: var(--accent); }
.week-row.is-past { color: var(--muted); }
.week-row .wk { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.week-row .wk b { display: block; font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--ink); line-height: 1; margin-top: 2px; }
.week-row.is-past .wk b { color: var(--muted); }
.week-row .dates { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.week-row .topic { font-weight: 500; }
.week-row .parts { font-size: 13px; color: var(--muted); margin-top: 3px; }
.week-row .objectives { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.week-row details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 6px; list-style: none; }
.week-row details summary::before { content: "+ "; font-family: var(--font-mono); }
.week-row details[open] summary::before { content: "– "; }
.week-row .sessions { font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.week-row .sessions .att { color: var(--good); font-family: var(--font-mono); }
.week-row .due { font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.week-row .due a { color: var(--ink); }
.assess-table td.action { text-align: right; white-space: nowrap; }
.weights { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.registrar-note { border: 1px solid var(--line-2); border-left: 3px solid var(--accent); padding: 12px 16px; background: var(--surface); font-size: 13.5px; }
.registrar-note .label { display: block; margin-bottom: 4px; color: var(--accent); }
.reading { max-width: 68ch; font-family: var(--font-display); font-size: 18px; line-height: 1.6; font-variation-settings: "opsz" 18; }
.reading h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 36px 0 12px; }
.reading h2:first-child { margin-top: 0; }
.reading p { margin-bottom: 16px; }
.reading-src { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.reading-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: start; }
.reading-side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
.notes { font-size: 15px; line-height: 1.6; }
.notes h1, .notes h2, .notes h3 { margin: 22px 0 8px; } .notes h1 { font-size: 20px; } .notes h2 { font-size: 17px; } .notes h3 { font-size: 15px; }
.notes ul, .notes ol { padding-left: 22px; } .notes code { font-family: var(--font-mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 4px; border-radius: 2px; }
.notes pre { background: var(--surface-2); padding: 12px; overflow-x: auto; border-radius: var(--radius); }
.notes table { border-collapse: collapse; } .notes td, .notes th { border: 1px solid var(--line); padding: 4px 8px; }

/* ---------- exam ---------- */
.exam-bar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 24px; align-items: center; padding: 12px 20px; margin: -36px 0 28px; border-radius: 0 0 var(--radius) var(--radius); background: var(--ink); color: var(--paper); }
.exam-bar .title { font-weight: 600; } .exam-bar .sub { font-size: 12.5px; opacity: 0.7; }
.exam-bar .count { font-family: var(--font-mono); font-size: 12.5px; opacity: 0.8; font-variant-numeric: tabular-nums; }
.exam-bar .timer { font-family: var(--font-mono); font-size: 34px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.exam-bar .timer[data-level="warn"] { color: var(--warn); } .exam-bar .timer[data-level="bad"] { color: var(--bad); animation: pulse 1s steps(2) infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.exam { max-width: 780px; }
.question { padding: 22px 0; border-bottom: 1px solid var(--line); }
.question:last-of-type { border-bottom: 0; }
.question .qh { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.question .qn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.question .prompt { font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
.question .prompt.serif { font-family: var(--font-display); font-size: 18px; }
.options { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.options label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.options label:hover { border-color: var(--line-2); } .options input { margin-top: 3px; accent-color: var(--accent); }
.options label.is-correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.options label.is-wrong { border-color: var(--bad); }
.options .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 16px; margin-top: 2px; }
.answer { margin-top: 12px; }
.answer textarea { min-height: 140px; font-family: var(--font-body); }
.pledge { border: 1px solid var(--line-2); padding: 14px 16px; border-radius: var(--radius); background: var(--surface); }
.result { max-width: 780px; }
.result-head { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 20px 24px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); }
.result-head .score { font-family: var(--font-mono); font-size: 44px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.result-q { padding: 18px 0; border-bottom: 1px solid var(--line); }
.result-q .fb { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius); font-size: 13.5px; }
.result-q .pts { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.model-answer { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); border-left: 2px solid var(--line-2); padding-left: 10px; }

/* ---------- calendar ---------- */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: var(--line); gap: 1px; }
.calendar .cal-h { background: var(--surface-2); padding: 6px 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cal-day { background: var(--surface); min-height: 108px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
.cal-day .d { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-day.is-other { background: var(--paper); } .cal-day.is-other .d { color: var(--muted); }
.cal-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day.is-today .d { color: var(--accent); font-weight: 600; }
.cal-ev { font-size: 11.5px; line-height: 1.3; padding: 2px 5px; border-radius: 2px; border-left: 2px solid hsl(var(--ch, 160) var(--course-s) var(--course-l)); background: var(--surface-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.cal-ev.is-due { font-weight: 600; color: var(--ink); background: hsl(var(--ch, 160) var(--course-s) var(--course-l) / 0.16); }
.cal-ev.is-exam { background: var(--ink); color: var(--paper); border-left-color: var(--ink); }
.timetable { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.timetable .tt-h { padding: 6px 4px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.timetable .tt-h.is-today { color: var(--accent); }
.timetable .tt-col { position: relative; height: 520px; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 40px); }
.timetable .tt-hours { position: relative; height: 520px; }
.timetable .tt-hours span { position: absolute; right: 8px; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tt-block { position: absolute; left: 3px; right: 3px; padding: 4px 6px; border-radius: 2px; background: hsl(var(--ch, 160) var(--course-s) var(--course-l) / 0.16); border-left: 3px solid hsl(var(--ch, 160) var(--course-s) var(--course-l)); font-size: 11.5px; line-height: 1.25; overflow: hidden; }
.tt-block b { display: block; font-family: var(--font-mono); font-weight: 500; }

/* ---------- record ---------- */
.transcript { border: 1px solid var(--line-2); background: var(--surface); padding: 32px 36px; border-radius: var(--radius); }
.transcript-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 2px solid var(--ink); }
.transcript-head .seal-lg { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 24px; }
.ledger-list .table td { font-size: 13px; }
.hash { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }

/* ---------- wizard / prospectus ---------- */
.wizard-steps { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.wizard-step { flex: 1; padding: 10px 14px; font-size: 13px; color: var(--muted); background: var(--surface); border-right: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.wizard-step:last-child { border-right: 0; }
.wizard-step .n { font-family: var(--font-mono); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; }
.wizard-step.is-active { color: var(--ink); font-weight: 600; } .wizard-step.is-active .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wizard-step.is-done .n { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sources { display: flex; flex-direction: column; }
.source-row { display: grid; grid-template-columns: 80px minmax(0, 1fr) 110px auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.source-row:last-child { border-bottom: 0; }
.prospectus { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius); }
.prospectus-head { padding: 28px 32px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.prospectus-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15; margin-top: 6px; }
.prospectus-body { padding: 24px 32px; display: flex; flex-direction: column; gap: 28px; }
.prospectus .kv { grid-template-columns: max-content 1fr; }

/* ---------- toasts, modals ---------- */
.toast-host { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 380px; }
.toast { padding: 10px 14px; border-radius: var(--radius); background: var(--ink); color: var(--paper); font-size: 13.5px; box-shadow: var(--shadow); border-left: 3px solid var(--muted); animation: rise 180ms ease-out; }
.toast[data-kind="good"] { border-left-color: var(--good); } .toast[data-kind="warn"] { border-left-color: var(--warn); } .toast[data-kind="bad"] { border-left-color: var(--bad); }
.toast.is-leaving { opacity: 0; transition: opacity 250ms; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } }
.modal-host { position: fixed; inset: 0; z-index: 40; display: none; }
.modal-host.is-open { display: grid; place-items: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10, 12, 11, 0.45); }
.modal { position: relative; width: min(520px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
.modal.is-wide { width: min(760px, calc(100vw - 32px)); }
.modal-title { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin-bottom: 10px; }
.modal-body { font-size: 14.5px; color: var(--ink-2); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ---------- welcome ---------- */
.welcome { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.welcome-left { padding: 64px 72px; display: flex; flex-direction: column; justify-content: center; gap: 24px; border-right: 1px solid var(--line-2); }
.welcome-left h1 { font-family: var(--font-display); font-weight: 500; font-size: 44px; line-height: 1.08; letter-spacing: -0.015em; }
.welcome-left .wordmark { font-family: var(--font-display); font-style: italic; font-size: 30px; }
.welcome-right { padding: 64px 72px; display: flex; flex-direction: column; justify-content: center; background: var(--surface); }
.rules { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.rules li { padding: 12px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 28px 1fr; gap: 12px; font-size: 14.5px; color: var(--ink-2); }
.rules li:last-child { border-bottom: 1px solid var(--line); }
.rules .n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); padding-top: 2px; }

/* ---------- study blocks & chunks ---------- */
.study-block { border: 1px solid var(--line); border-left: 3px solid hsl(var(--ch, 160) var(--course-s) var(--course-l)); border-radius: var(--radius); background: var(--surface); padding: 12px 14px 8px; margin-bottom: 12px; }
.study-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.study-topic { font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.2; margin-top: 2px; text-wrap: balance; }
.chunks { display: flex; flex-direction: column; }
.chunk { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.chunk-check { display: flex; align-items: center; height: 22px; }
.chunk-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.chunk-check input:disabled { cursor: default; }
.chunk-title { display: block; color: var(--ink); font-weight: 500; line-height: 1.35; }
.chunk-title:hover { text-decoration: none; color: var(--accent); }
.chunk-n { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 18px; }
.chunk-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chunk[data-state="done"] .chunk-title, .chunk[data-state="late"] .chunk-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.chunk[data-state="future"] { opacity: 0.7; }
.plan-week { margin-top: 28px; }
.plan-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.plan-day .plan-date { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.plan-day.is-today .plan-date { color: var(--accent); font-weight: 600; }
.plan-day.is-past { opacity: 0.75; }

/* ---------- pace cards ---------- */
.paces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pace-card { border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
.pace-card.is-default { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pace-card.is-unavailable { opacity: 0.6; background: var(--paper); }
.pace-card .pace-n { font-family: var(--font-mono); font-size: 40px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.pace-card .pace-n span { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; }
.pace-card .kv { margin-top: 4px; }

/* ---------- original pages ---------- */
.reading-src { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.reading-src .switch a { padding: 4px 10px; font-size: 12px; color: var(--ink-2); letter-spacing: 0; text-transform: none; font-family: var(--font-body); }
.reading-src .switch a.is-on { background: var(--ink); color: var(--paper); }
.reading-src .switch a:hover { text-decoration: none; }
.pages { display: flex; flex-direction: column; gap: 18px; }
.pdf-page { margin: 0; }
.pdf-page canvas { display: block; max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 6px 20px rgba(0,0,0,0.08); border: 1px solid var(--line); }
.pdf-page figcaption { margin-top: 6px; }
.html-page { font-family: var(--font-body); font-size: 15px; line-height: 1.6; max-width: 72ch; }
.html-page img { max-width: 100%; height: auto; }
.html-page h1, .html-page h2, .html-page h3 { margin: 24px 0 8px; }
.html-page table { border-collapse: collapse; max-width: 100%; display: block; overflow-x: auto; }
.html-page td, .html-page th { border: 1px solid var(--line); padding: 4px 8px; }
.agenda-14 { display: none; }
.agenda-day { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.agenda-date { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* ---------- responsive: tablet ---------- */
@media (max-width: 1100px) { .week-row { grid-template-columns: 56px 100px minmax(0, 1fr); } .week-row .sessions, .week-row .due { grid-column: 2 / -1; } .paces { grid-template-columns: 1fr; } }

/* ---------- responsive: phone — the rail becomes a bottom tab bar ---------- */
@media (max-width: 760px) {
  :root { --rail-w: 0px; }
  .app { grid-template-columns: 1fr; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; z-index: 30; flex-direction: row; align-items: stretch; padding: 0; border-right: 0; border-top: 1px solid var(--line-2); background: var(--surface); padding-bottom: env(safe-area-inset-bottom); }
  .rail-brand, .rail-foot { display: none; }
  .rail-nav { flex: 1; flex-direction: row; gap: 0; }
  .rail-nav a { flex: 1; flex-direction: column; justify-content: center; gap: 3px; padding: 8px 2px 6px; border-left: 0; border-top: 2px solid transparent; border-radius: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em; color: var(--muted); }
  .rail-nav a svg { width: 20px; height: 20px; opacity: 1; }
  .rail-nav a[aria-current="page"] { background: transparent; box-shadow: none; color: var(--accent); border-top-color: var(--accent); }
  .rail-nav .badge { position: absolute; margin: 0; transform: translate(14px, -8px); font-size: 10px; padding: 0 5px; }
  .rail-nav a { position: relative; }
  .rail-nav .rail-enrol { display: none; }
  .page { padding: 18px 16px 48px; }
  .page-head { flex-direction: column; align-items: stretch; gap: 12px; padding-bottom: 14px; margin-bottom: 18px; }
  .page-head .actions { flex-wrap: wrap; }
  .display { font-size: 26px; }
  .lede { font-size: 15px; }
  .today-grid, .grid-2, .grid-3, .reading-layout { grid-template-columns: 1fr; }
  .reading-side { position: static; }
  .section { margin-top: 24px; }
  .agenda-item, .due-list .agenda-item { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
  .agenda-item .time { grid-column: 1 / -1; font-size: 12px; }
  .agenda-item .who { grid-column: 1; } .agenda-item .what { grid-column: 1; } .agenda-item .action { grid-column: 2; grid-row: 2 / 4; align-self: center; }
  .week-row { grid-template-columns: 48px minmax(0, 1fr); gap: 8px 12px; padding: 12px 8px; }
  .week-row .dates { grid-column: 2; font-size: 12px; } .week-row .sessions, .week-row .due { grid-column: 1 / -1; }
  .exam-bar { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 10px 14px; margin: -18px -16px 18px; border-radius: 0; }

  .toast-host { left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); max-width: none; }
  .modal { width: calc(100vw - 24px); padding: 18px 16px; }

  .app { display: block; padding: 0; } .page { max-width: none; padding: 0; } body { background: #fff; color: #000; }

</head>
<body>
<div id="app" class="app">
  <aside id="rail" class="rail" aria-label="Navigation"></aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="toasts" class="toast-host" aria-live="polite"></div>
<div id="modals" class="modal-host"></div>
<script>

/* ---- core.js ---- */
window.L = window.L || {};
(function (L) {
  'use strict';

  L.VERSION = 1;
  const KEY = 'lyceum.v1';
  const THEME_KEY = 'lyceum.theme';

  // ---------- small utilities ----------
  L.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  L.clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  L.sum = (arr) => arr.reduce((a, b) => a + (Number(b) || 0), 0);
  L.by = (key) => {
    const f = typeof key === 'function' ? key : (o) => o[key];
    return (a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; };
  };
  L.groupBy = (arr, fn) => arr.reduce((m, x) => { const k = typeof fn === 'function' ? fn(x) : x[fn]; (m[k] = m[k] || []).push(x); return m; }, {});
  L.uid = (prefix = 'x') => {
    const b = new Uint8Array(6); crypto.getRandomValues(b);
    return prefix + '_' + Array.from(b, (n) => (n % 36).toString(36)).join('') + (Date.now() % 1296).toString(36).padStart(2, '0');
  };
  L.sha256 = async (str) => {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  };

  // ---------- event bus ----------
  const handlers = {};
  L.on = (ev, fn) => { (handlers[ev] = handlers[ev] || []).push(fn); };
  L.off = (ev, fn) => { handlers[ev] = (handlers[ev] || []).filter((f) => f !== fn); };
  L.emit = (ev, payload) => { (handlers[ev] || []).forEach((fn) => { try { fn(payload); } catch (e) { console.error(e); } }); };

  // ---------- state ----------
  function defaults() {
    return {
      version: L.VERSION,
      student: null,
      settings: { apiKey: '', model: 'anthropic/claude-fable-5.1', weeklyHours: 12, theme: 'system' },
      clock: { offsetMs: 0 },
      courses: [],
      ledger: [],
      ui: { collapsed: {}, lastRoute: '' },
    };
  }
  function migrate(s) {
    const d = defaults();
    const out = Object.assign(d, s || {});
    out.settings = Object.assign(d.settings, s?.settings || {});
    out.clock = Object.assign(d.clock, s?.clock || {});
    out.ui = Object.assign(d.ui, s?.ui || {});
    out.courses = Array.isArray(s?.courses) ? s.courses : [];
    out.ledger = Array.isArray(s?.ledger) ? s.ledger : [];
    out.version = L.VERSION;
    return out;
  }
  L.load = () => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
    let parsed = null;
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { console.warn('Lyceum: stored record unreadable, starting fresh'); } }
    L.S = migrate(parsed);
    return L.S;
  };
  let saveTimer = null;
  L.saveNow = () => {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try { localStorage.setItem(KEY, JSON.stringify(L.S)); } catch (e) { console.error('Lyceum: could not save', e); }
    L.emit('state');
  };
  L.save = () => { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(L.saveNow, 150); };
  L.reset = async () => {
    try { localStorage.removeItem(KEY); localStorage.removeItem(THEME_KEY); } catch (e) { /* ignore */ }
    try { await new Promise((res) => { const r = indexedDB.deleteDatabase('lyceum'); r.onsuccess = r.onerror = r.onblocked = () => res(); }); } catch (e) { /* ignore */ }
    location.replace(location.pathname + location.search + '#/welcome');
    location.reload();
  };

  // ---------- clock ----------
  L.debug = (() => { try { return new URLSearchParams(location.search).has('debug'); } catch (e) { return false; } })();
  L.now = () => Date.now() + (L.S?.clock?.offsetMs || 0);
  L.today = () => L.date.startOfDay(new Date(L.now()));
  L.clock = {
    async setOffset(ms) {
      if (!L.debug) throw new Error('The registrar clock can only be moved in debug mode.');
      const from = L.S.clock.offsetMs || 0;
      L.S.clock.offsetMs = Math.round(ms);
      await L.ledger.append('clock_override', { fromMs: from, toMs: L.S.clock.offsetMs, now: new Date(L.now()).toISOString() });
      L.save();
    },
    async reset() {
      const from = L.S.clock.offsetMs || 0;
      L.S.clock.offsetMs = 0;
      if (from !== 0) await L.ledger.append('clock_reset', { fromMs: from });
      L.save();
    },
  };

  // ---------- dates (local wall-clock) ----------
  const pad = (n) => String(n).padStart(2, '0');
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  L.date = {
    parse(v) {
      if (v instanceof Date) return new Date(v.getTime());
      if (typeof v === 'number') return new Date(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v + 'T00:00:00');
      return new Date(v);
    },
    iso(d) { d = L.date.parse(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
    isoLocal(d) { d = L.date.parse(d); return `${L.date.iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; },
    startOfDay(d) { d = L.date.parse(d); d.setHours(0, 0, 0, 0); return d; },
    addDays(d, n) { d = L.date.parse(d); d.setDate(d.getDate() + n); return d; },
    addMin(d, n) { d = L.date.parse(d); d.setMinutes(d.getMinutes() + n); return d; },
    setTime(d, h, m = 0, s = 0) { d = L.date.parse(d); d.setHours(h, m, s, 0); return d; },
    dow(d) { d = L.date.parse(d); return (d.getDay() + 6) % 7; },
    nextMonday(from) {
      const now = from ? L.date.parse(from) : new Date(L.now());
      const day = L.date.startOfDay(now);
      const dow = L.date.dow(day);
      if (dow === 0 && now.getHours() < 8) return day;
      return L.date.addDays(day, 7 - dow);
    },
    dayName: (d) => DAYS[L.date.dow(d)],
    monthName: (d) => MONTHS[L.date.parse(d).getMonth()],
  };
  L.fmt = {
    date(d) { d = L.date.parse(d); return `${DAYS[L.date.dow(d)].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; },
    dateLong(d) { d = L.date.parse(d); return `${DAYS[L.date.dow(d)]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
    time(d) { d = L.date.parse(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; },
    dt(d) { return `${L.fmt.date(d)}, ${L.fmt.time(d)}`; },
    rel(ms) {
      const past = ms < 0; const a = Math.abs(ms);
      let s;
      if (a < 60e3) return 'now';
      if (a < 3600e3) s = `${Math.round(a / 60e3)} min`;
      else if (a < 86400e3) { const h = Math.floor(a / 3600e3); const m = Math.round((a % 3600e3) / 60e3); s = m ? `${h}h ${m}m` : `${h}h`; }
      else { const d = Math.floor(a / 86400e3); const h = Math.round((a % 86400e3) / 3600e3); s = h ? `${d}d ${h}h` : `${d}d`; }
      return past ? `${s} ago` : `in ${s}`;
    },
    dur(min) { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; },
    pct(n) { return n == null || isNaN(n) ? '—' : `${(Math.round(n * 10) / 10).toFixed(1)}%`; },
    num(n) { return Number(n || 0).toLocaleString('en-GB'); },
    clock(d) { d = L.date.parse(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; },
  };

  // ---------- IndexedDB for materials ----------
  let dbPromise = null;
  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve) => {
      if (typeof indexedDB === 'undefined') return resolve(null);
      const req = indexedDB.open('lyceum', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('materials')) db.createObjectStore('materials');
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files'); // original documents (PDF bytes, HTML)
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { console.warn('Lyceum: IndexedDB unavailable', req.error); resolve(null); };
    });
    return dbPromise;
  }
  function tx(mode, fn, storeName = 'materials') {
    return openDb().then((db) => new Promise((resolve, reject) => {
      if (!db) return resolve(null);
      const t = db.transaction(storeName, mode);
      const store = t.objectStore(storeName);
      const req = fn(store);
      t.oncomplete = () => resolve(req && 'result' in req ? req.result : null);
      t.onerror = () => reject(t.error);
    }));
  }
  const all = (storeName) => openDb().then((db) => new Promise((resolve, reject) => {
    if (!db) return resolve({});
    const out = {};
    const req = db.transaction(storeName, 'readonly').objectStore(storeName).openCursor();
    req.onsuccess = () => { const c = req.result; if (!c) return resolve(out); out[c.key] = c.value; c.continue(); };
    req.onerror = () => reject(req.error);
  }));
  L.db = {
    putMaterial: (id, text) => tx('readwrite', (s) => s.put(text, id)),
    getMaterial: (id) => tx('readonly', (s) => s.get(id)).then((r) => (r == null ? null : r)),
    deleteMaterial: (id) => tx('readwrite', (s) => s.delete(id)),
    allMaterials: () => all('materials'),
    // originals: { kind:'pdf', name, bytes: ArrayBuffer } | { kind:'html', name, html }
    putFile: (id, file) => tx('readwrite', (s) => s.put(file, id), 'files'),
    getFile: (id) => tx('readonly', (s) => s.get(id), 'files').then((r) => (r == null ? null : r)),
    deleteFile: (id) => tx('readwrite', (s) => s.delete(id), 'files'),
    allFiles: () => all('files'),
  };

  // ---------- ledger (hash chain) ----------
  let queue = Promise.resolve();
  function entryBytes(e) {
    const body = { i: e.i, t: e.t, type: e.type };
    if (e.courseId !== undefined) body.courseId = e.courseId;
    if (e.ref !== undefined) body.ref = e.ref;
    body.detail = e.detail;
    return e.prev + '|' + JSON.stringify(body);
  }
  L.ledger = {
    append(type, detail = {}) {
      const run = async () => {
        const prev = L.S.ledger.length ? L.S.ledger[L.S.ledger.length - 1].hash : '0';
        const e = { i: L.S.ledger.length, t: new Date(L.now()).toISOString(), type, detail, prev };
        if (detail.courseId !== undefined) e.courseId = detail.courseId;
        if (detail.ref !== undefined) e.ref = detail.ref;
        e.hash = await L.sha256(entryBytes(e));
        L.S.ledger.push(e);
        L.save();
        return e;
      };
      queue = queue.then(run, run);
      return queue;
    },
    async verify() {
      let prev = '0';
      for (let i = 0; i < L.S.ledger.length; i++) {
        const e = L.S.ledger[i];
        if (e.i !== i || e.prev !== prev) return { ok: false, brokenAt: i };
        const h = await L.sha256(entryBytes(e));
        if (h !== e.hash) return { ok: false, brokenAt: i };
        prev = e.hash;
      }
      return { ok: true, brokenAt: null };
    },
  };

  // ---------- export / import ----------
  const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (str) => { const bin = atob(str); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  const FILE_EXPORT_LIMIT = 40 * 1024 * 1024;
  L.exportRecord = async () => {
    const state = JSON.parse(JSON.stringify(L.S));
    state.settings.apiKey = ''; // a record export is meant to travel; the key is not
    const files = await L.db.allFiles();
    let bytes = 0;
    for (const f of Object.values(files)) bytes += f.bytes ? f.bytes.byteLength : (f.html || '').length;
    const out = { version: L.VERSION, exportedAt: new Date().toISOString(), state, materials: await L.db.allMaterials() };
    if (bytes <= FILE_EXPORT_LIMIT) {
      out.files = {};
      for (const [id, f] of Object.entries(files)) out.files[id] = f.bytes ? { kind: f.kind, name: f.name, bytes64: b64(f.bytes) } : f;
    } else out.filesOmitted = bytes;
    return out;
  };
  L.importRecord = async (obj) => {
    if (!obj || typeof obj !== 'object' || !obj.state || !Array.isArray(obj.state.courses)) {
      throw new Error('That file is not a Lyceum record export.');
    }
    const next = migrate(obj.state);
    Object.keys(L.S).forEach((k) => delete L.S[k]);
    Object.assign(L.S, next);
    for (const [id, text] of Object.entries(obj.materials || {})) await L.db.putMaterial(id, text);
    for (const [id, f] of Object.entries(obj.files || {})) await L.db.putFile(id, f.bytes64 ? { kind: f.kind, name: f.name, bytes: unb64(f.bytes64) } : f);
    await L.ledger.append('data_imported', { courses: L.S.courses.length, exportedAt: obj.exportedAt || null });
    L.saveNow();
    if (L.render) L.render();
  };

  // ---------- theme ----------
  L.theme = {
    set(mode) {
      const root = document.documentElement;
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
      try { if (mode === 'light' || mode === 'dark') localStorage.setItem(THEME_KEY, mode); else localStorage.removeItem(THEME_KEY); } catch (e) { /* ignore */ }
      if (L.S) { L.S.settings.theme = mode; L.save(); }
    },
    apply() { L.theme.set(L.S?.settings?.theme || 'system'); },
  };

  // ---------- ui helpers ----------
  const $ = (sel) => document.querySelector(sel);
  L.ui = {
    toast(message, kind = 'info', ms = 3200) {
      const host = $('#toasts'); if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast'; el.dataset.kind = kind; el.textContent = message;
      host.appendChild(el);
      while (host.children.length > 4) host.firstChild.remove();
      setTimeout(() => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 250); }, ms);
    },
    modal({ title, body = '', actions = [], wide = false, onAction }) {
      const host = $('#modals'); if (!host) return;
      host.innerHTML = `
        <div class="modal-backdrop" data-act="modal-cancel"></div>
        <div class="modal${wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <h2 id="modal-title" class="modal-title">${L.esc(title)}</h2>
          <div class="modal-body">${body}</div>
          <div class="modal-actions">${actions.map((a) => `<button class="btn ${a.primary ? (a.danger ? 'btn-danger' : 'btn-primary') : 'btn-quiet'}" data-act="${L.esc(a.act)}">${L.esc(a.label)}</button>`).join('')}</div>
        </div>`;
      host.classList.add('is-open');
      host._onAction = onAction;
      const first = host.querySelector('.modal-actions .btn-primary, .modal-actions .btn-danger, .modal-actions .btn');
      if (first) first.focus();
    },
    closeModal() { const host = $('#modals'); if (!host) return; host.classList.remove('is-open'); host.innerHTML = ''; host._onAction = null; },
    confirm({ title, body = '', ok = 'Confirm', cancel = 'Cancel', danger = false }) {
      return new Promise((resolve) => {
        L.ui.modal({
          title, body,
          actions: [{ label: cancel, act: 'modal-cancel' }, { label: ok, act: 'modal-ok', primary: true, danger }],
          onAction: (act) => { L.ui.closeModal(); resolve(act === 'modal-ok'); },
        });
      });
    },
    busy(label) {
      const host = $('#main') || document.body;
      let el = host.querySelector('.busy');
      if (!el) { el = document.createElement('div'); el.className = 'busy'; el.innerHTML = '<div class="busy-bar"><i></i></div><div class="log"></div>'; host.prepend(el); }
      const log = el.querySelector('.log');
      const add = (t) => { const line = document.createElement('div'); line.textContent = t; log.appendChild(line); };
      add(label);
      return { update: add, done() { el.remove(); } };
    },
  };
  document.addEventListener('click', (ev) => {
    const host = $('#modals');
    if (!host || !host.classList.contains('is-open')) return;
    const el = ev.target.closest('[data-act]');
    if (!el || !host.contains(el)) return;
    const act = el.dataset.act;
    if (act === 'modal-ok' || act === 'modal-cancel') {
      ev.preventDefault(); ev.stopPropagation();
      if (host._onAction) host._onAction(act); else L.ui.closeModal();
    }
  }, true);
  document.addEventListener('keydown', (ev) => {
    const host = $('#modals');
    if (ev.key === 'Escape' && host && host.classList.contains('is-open')) { if (host._onAction) host._onAction('modal-cancel'); else L.ui.closeModal(); }
  });

  // ---------- boot ----------
  L.load();
  L.theme.apply();
  window.addEventListener('pagehide', L.saveNow);
  window.addEventListener('beforeunload', L.saveNow);
  setInterval(() => L.emit('tick'), 1000);
  setInterval(() => { if (L.registrar) L.registrar.sweep().catch((e) => console.error(e)); }, 20000);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => L.boot && L.boot());
  else setTimeout(() => L.boot && L.boot(), 0);
})(window.L);


/* ---- sample.js ---- */
(function (L) {
  'use strict';
  // Built-in sample material. Plainly labelled as a sample in the UI; it goes through the
  // same registrar pipeline as anything the student uploads.
  L.SAMPLE = {
    name: 'Introduction to Probability — lecture notes (sample)',
    text: `# Introduction to Probability

These notes cover the first six lectures of a one-term introduction to probability. They assume comfort with algebra and summation notation, and nothing else.

## 1. Sample spaces and events

An experiment is any process whose outcome is uncertain: tossing a coin, drawing a card, measuring tomorrow's temperature. The sample space, written S, is the set of all possible outcomes. For one toss of a coin, S = {H, T}. For two tosses, S = {HH, HT, TH, TT}. For the number of emails you receive tomorrow, S = {0, 1, 2, ...}, which is infinite but countable. For a temperature reading, S is an interval of real numbers and is uncountable.

An event is a subset of the sample space. "At least one head in two tosses" is the event A = {HH, HT, TH}. Because events are sets, the language of sets is the language of events. The union A ∪ B is the event that A or B occurs (or both). The intersection A ∩ B is the event that both occur. The complement A^c is the event that A does not occur. Two events are mutually exclusive, or disjoint, if A ∩ B is empty: they cannot both happen.

De Morgan's laws carry over directly. (A ∪ B)^c = A^c ∩ B^c says that "neither A nor B" is the same as "not A and not B". Drawing a Venn diagram is a reliable way to check any claim about three or fewer events.

## 2. The axioms of probability

A probability is a function P that assigns a number to every event and satisfies three axioms. First, P(A) ≥ 0 for every event A. Second, P(S) = 1: something in the sample space must happen. Third, if A1, A2, ... are pairwise disjoint events, then P(A1 ∪ A2 ∪ ...) = P(A1) + P(A2) + .... This third axiom is called countable additivity and it is the one that does all the work.

Several useful facts follow from the axioms alone. The complement rule: P(A^c) = 1 − P(A). The probability of the empty event is 0. If A is a subset of B then P(A) ≤ P(B). The inclusion–exclusion formula for two events: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The subtraction corrects for the outcomes counted twice, once in A and once in B. For three events the formula adds the three pairwise intersections back in and subtracts the triple intersection.

When the sample space is finite and every outcome is equally likely, probability reduces to counting: P(A) = |A| / |S|. This is the classical definition, and it is why the first weeks of any probability course lean on combinatorics. The number of ways to choose k objects from n without regard to order is the binomial coefficient C(n, k) = n! / (k!(n − k)!). The probability that a five-card poker hand is a flush, for example, is 4 × C(13, 5) / C(52, 5), which is roughly 0.00198.

## 3. Conditional probability and independence

The conditional probability of A given B, written P(A | B), is the probability of A when we know that B has occurred. It is defined, for P(B) > 0, by P(A | B) = P(A ∩ B) / P(B). Conditioning shrinks the sample space to B and rescales so that the probabilities inside B sum to one.

Rearranging the definition gives the multiplication rule: P(A ∩ B) = P(B) P(A | B). Applied repeatedly it gives the chain rule for several events, which is how one computes the probability of drawing three aces in a row without replacement: (4/52)(3/51)(2/50).

Two events are independent if P(A ∩ B) = P(A) P(B), or equivalently P(A | B) = P(A) when P(B) > 0. Independence means that learning B tells you nothing about A. It is a modelling assumption, not something you can read off a Venn diagram, and it is easy to get wrong: disjoint events with positive probability are never independent, because if one occurs the other cannot. A collection of events is mutually independent if the product rule holds for every sub-collection, which is stronger than pairwise independence.

The law of total probability lets us compute an unconditional probability by conditioning on a partition. If B1, ..., Bn are disjoint events whose union is S, then P(A) = Σ P(A | Bi) P(Bi). In words: average the conditional probabilities of A, weighting each by how likely its condition is.

## 4. Bayes' theorem

Bayes' theorem reverses the direction of conditioning. From the multiplication rule written both ways, P(A ∩ B) = P(B | A) P(A) = P(A | B) P(B), so P(A | B) = P(B | A) P(A) / P(B). The denominator is usually expanded with the law of total probability.

The standard example is a diagnostic test. Suppose a disease has prevalence 1% and a test has sensitivity 99% (it detects the disease when present) and specificity 95% (it is negative when the disease is absent). A person tests positive. The probability they have the disease is P(D | +) = (0.99 × 0.01) / (0.99 × 0.01 + 0.05 × 0.99) = 0.0099 / 0.0594, which is about 0.167. Despite an accurate test, five in six positives are false positives, because the disease is rare. This phenomenon is called the base-rate fallacy when people ignore the prevalence.

The terms have names. P(A) is the prior, P(A | B) is the posterior, P(B | A) is the likelihood, and P(B) is the evidence or marginal likelihood. Bayes' theorem says: posterior is proportional to likelihood times prior. This one line is the foundation of Bayesian statistics.

## 5. Random variables and expectation

A random variable is a function from the sample space to the real numbers. It turns outcomes into numbers so that we can do arithmetic with them. The number of heads in three tosses is a random variable X taking values in {0, 1, 2, 3}. A random variable is discrete if it takes countably many values and continuous if it takes values in an interval.

A discrete random variable is described by its probability mass function p(x) = P(X = x), which is non-negative and sums to one over all x. The cumulative distribution function F(x) = P(X ≤ x) is defined for every random variable, discrete or continuous, and is non-decreasing from 0 to 1.

The expectation, or mean, of a discrete random variable is E[X] = Σ x p(x): a weighted average of the values, weighted by their probabilities. Expectation is linear: E[aX + bY] = aE[X] + bE[Y] for any constants a and b, whether or not X and Y are independent. Linearity is the most useful single fact in the course; it lets you compute the expected number of matches, fixed points, or successes by adding indicator variables without ever finding the full distribution.

The variance measures spread: Var(X) = E[(X − μ)²] = E[X²] − μ², where μ = E[X]. Its square root is the standard deviation, which has the same units as X. Variance is not linear: Var(aX) = a² Var(X), and Var(X + Y) = Var(X) + Var(Y) only when X and Y are uncorrelated, which is implied by independence.

## 6. Common discrete distributions

The Bernoulli distribution describes a single trial with success probability p: P(X = 1) = p, P(X = 0) = 1 − p, mean p, variance p(1 − p).

The binomial distribution counts successes in n independent Bernoulli trials with the same p. Its mass function is P(X = k) = C(n, k) p^k (1 − p)^(n − k) for k = 0, ..., n, with mean np and variance np(1 − p). Both moments follow from linearity: a binomial is a sum of n Bernoullis.

The geometric distribution counts the number of trials up to and including the first success: P(X = k) = (1 − p)^(k−1) p for k = 1, 2, .... Its mean is 1/p. The geometric distribution is memoryless: given that no success has occurred in the first m trials, the remaining wait has the same distribution as the original wait.

The Poisson distribution with rate λ has P(X = k) = e^(−λ) λ^k / k! for k = 0, 1, 2, .... Its mean and variance are both λ. It arises as the limit of a binomial with n large and p small while np = λ stays fixed, which is why it models counts of rare events in a fixed interval: typos on a page, calls arriving in a minute, radioactive decays in a second.

Choosing the right distribution is a matter of matching the story. Fixed number of trials and a count of successes: binomial. Waiting for the first success: geometric. Counting rare events at a steady rate: Poisson. Learning to recognise these stories is the main skill assessed in the first examination.

      const notices = [];

      <div class="progress mb-2"><i style="width:${s.chunks.length ? (done / s.chunks.length) * 100 : 0}%"></i></div>
      <div class="chunks">${s.chunks.map((k, i) => L.chunkRow(c, s, k, { number: i + 1 })).join('')}</div></div>`;

  L.inputs['chunk-done'] = async (el) => {

    L.render();
  };
})(window.L);

  const nextBlockDate = (c) => { const t = L.date.iso(L.today()); const s = c.sessions.find((x) => x.date >= t) || c.sessions[c.sessions.length - 1]; return s ? s.date : c.term.start; };
  const tabs = (c, tab) => `<nav class="tabs">${['plan', 'syllabus', 'assessments', 'grades', 'materials'].map((t) => `<a href="#/course/${c.id}?tab=${t}"${t === tab ? ' aria-current="page"' : ''}>${t.charAt(0).toUpperCase() + t.slice(1)}</a>`).join('')}</nav>`;

  function grades(c) {

    return `<div class="grid-2">
      <div class="stack gap-2">
        <div class="cols gap-2"><div class="tile" style="flex:1"><div class="tile-n">${c.final ? c.final.letter : (s.letter || '—')}</div><div class="tile-l">${c.final ? 'Final grade' : 'Current standing'}</div></div><div class="tile" style="flex:1"><div class="tile-n">${c.final ? (c.final.pct == null ? '—' : L.fmt.pct(c.final.pct)) : L.fmt.pct(s.current)}</div><div class="tile-l">${c.final ? 'Final mark' : 'Weighted, graded work only'}</div></div><div class="tile" style="flex:1"><div class="tile-n">${c.final ? '·' : L.fmt.pct(s.projected)}</div><div class="tile-l">Projected at this pace</div></div></div>

  function materials(c) {

      <div class="card"><div class="card-head"><h3>Units</h3><span class="small muted">${c.analysis.units.length}</span></div><div class="card-body stack gap-2">${c.analysis.units.map((u, i) => `<div><div style="font-weight:500">${i + 1}. ${esc(u.title)}</div><div class="small muted">${u.topics.map(esc).join(' · ')}</div></div>`).join('')}</div></div></div>

  }

  // ---------- day view: the study block, and the original pages for its reading chunks ----------

  let pageRenderToken = 0;
  L.views.day = {

    render(p, q) {

      const reads = s.chunks.filter((k) => k.kind === 'read');

      return `<div class="page"><div class="page-head"><div><span class="eyebrow"><a href="#/course/${c.id}">${esc(c.code)}</a> · Week ${s.week} · ${L.fmt.dateLong(s.date)}</span><h1 class="display">${esc(s.topic)}</h1><p class="lede">${L.fmt.dur(s.minutes)} of study · ${s.chunks.length} chunks${w ? ` · ${esc(w.title)}` : ''}</p></div>
        <div class="actions">${prev ? `<a class="btn btn-quiet" href="#/course/${c.id}/day/${prev.date}">← ${L.fmt.date(prev.date)}</a>` : ''}${next ? `<a class="btn btn-quiet" href="#/course/${c.id}/day/${next.date}">${L.fmt.date(next.date)} →</a>` : ''}</div></div>

          <div>
            ${active ? `<div class="reading-src"><span>${esc(active.title)}${active.pages ? ` · ${active.pages[0] === active.pages[1] ? `page ${active.pages[0]}` : `pages ${active.pages[0]}–${active.pages[1]}`}` : ''}${src ? ` · ${esc(src.name)}` : ''}</span>${canPages ? `<span class="switch"><a class="${mode === 'pages' ? 'is-on' : ''}" href="#/course/${c.id}/day/${s.date}?chunk=${active.id}">Pages</a><a class="${mode === 'text' ? 'is-on' : ''}" href="#/course/${c.id}/day/${s.date}?chunk=${active.id}&view=text">Text</a></span>` : ''}</div>
              <div id="reading-body" class="${canPages && mode === 'pages' ? 'pages' : 'reading'}"><p class="muted" style="font-family:var(--font-body);font-size:14px">Loading…</p></div>` : `<div class="panel">No reading today — this block is review and practice. ${w && w.segments.length === 0 ? 'Use the plan tab to reopen earlier days’ pages.' : ''}</div>`}
            ${notes ? `<div class="section"><div class="section-head"><h2>Lecture notes · week ${s.week}</h2><span class="small muted">${notes.source === 'llm' ? esc(notes.model || '') : 'offline'}</span></div><div class="notes" id="notes-body"></div></div>` : ''}
          </div>
          <aside class="reading-side">
            ${L.studyBlock(c, s)}
            ${w && w.objectives.length ? `<div class="card"><div class="card-head"><h3>This week's objectives</h3></div><div class="card-body"><ol style="margin:0;padding-left:18px" class="small">${w.objectives.map((o) => `<li>${esc(o)}</li>`).join('')}</ol></div></div>` : ''}
            <div class="card"><div class="card-body"><button class="btn w-full" data-act="notes" data-course="${c.id}" data-week="${s.week}">${notes ? 'Regenerate lecture notes' : 'Lecture notes for this week'}</button><p class="small muted mt-1">${L.faculty.available() ? 'Written by faculty from this week’s material.' : 'Compiled offline. Add a faculty key in Settings for written notes.'}</p></div></div>
          </aside></div></div>`;
    },
    async mount(root, p, q) {
      const c = R().course(p.id); const s = c && c.sessions.find((x) => x.date === p.date); if (!s) return;
      const reads = s.chunks.filter((k) => k.kind === 'read');
      const active = reads.find((k) => k.id === q.chunk) || reads[0];
      const body = root.querySelector('#reading-body');
      const notes = c.notes && c.notes[s.week];
      const nb = root.querySelector('#notes-body');
      if (notes && nb) nb.innerHTML = window.marked && window.DOMPurify ? window.DOMPurify.sanitize(window.marked.parse(notes.markdown)) : `<pre style="white-space:pre-wrap">${esc(notes.markdown)}</pre>`;
      if (!active || !body) return;
      const token = ++pageRenderToken;
      const src = c.material.sources.find((x) => x.id === active.source);
      const wantPages = src && src.hasFile && q.view !== 'text';
      const file = wantPages ? await L.db.getFile(src.id) : null;
      if (token !== pageRenderToken) return;
      if (file && file.kind === 'pdf' && active.pages && window.pdfjsLib) {
        try { await renderPdfPages(body, file.bytes, active.pages, token); return; }

        return;

      // extracted text for this chunk
      const text = (await L.db.getMaterial(c.id)) || '';
      if (token !== pageRenderToken) return;
      body.className = 'reading';
      const raw = text.slice(active.from, active.to);
      const paras = raw.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean);
      body.innerHTML = paras.map((x) => (/^#{1,6}\s/.test(x) ? `<h2>${esc(x.replace(/^#{1,6}\s*/, ''))}</h2>` : `<p>${esc(x).replace(/\n/g, '<br>')}</p>`)).join('') || '<p class="muted">The material for this chunk is not on this device.</p>';
    },
    unmount() { pageRenderToken++; },
  };
  async function renderPdfPages(body, bytes, [from, to], token) {
    const pdf = await window.pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    if (token !== pageRenderToken) return;
    body.className = 'pages';
    body.innerHTML = '';
    const width = Math.min(body.clientWidth || 720, 900);
    for (let n = from; n <= Math.min(to, pdf.numPages); n++) {
      const page = await pdf.getPage(n);
      if (token !== pageRenderToken) return;
      const base = page.getViewport({ scale: 1 });
      const scale = width / base.width;
      const dpr = window.devicePixelRatio || 1;
      const vp = page.getViewport({ scale: scale * dpr });
      const wrap = document.createElement('figure'); wrap.className = 'pdf-page';
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height; canvas.style.width = `${vp.width / dpr}px`; canvas.style.height = `${vp.height / dpr}px`;
      const cap = document.createElement('figcaption'); cap.className = 'mono small muted'; cap.textContent = `Page ${n} of ${pdf.numPages}`;
      wrap.append(canvas, cap); body.appendChild(wrap);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
  }

      c.notes = c.notes || {}; c.notes[w.n] = { markdown: r.markdown, source: r.source, model: r.model, at: new Date(L.now()).toISOString() };

      if (r.note) L.ui.toast(r.note, 'warn', 5000);

  };

  // ---------- assessment ----------
  const stateLine = { upcoming: 'Locked until it opens', open: 'Open', late: 'Late window', in_progress: 'In progress', graded: 'Graded', missed: 'Missed' };
  function before(c, a, st) {

      ${brief ? `<div class="section"><div class="section-head"><h2>Brief</h2></div><div class="notes">${window.marked && window.DOMPurify ? window.DOMPurify.sanitize(window.marked.parse(brief)) : `<pre style="white-space:pre-wrap">${esc(brief)}</pre>`}</div></div>` : ''}
      <div class="pledge mt-3"><label class="check"><input type="checkbox" id="pledge" data-in="pledge"${canBegin ? '' : ' disabled'}><span><b>Honour pledge.</b> I will complete this ${a.kind === 'quiz' || a.kind === 'midterm' || a.kind === 'final' ? 'paper' : 'work'} on my own, without notes where the paper is timed, and I understand that I have one attempt and that the timer does not stop if I leave this page.</span></label></div>

    </div>`;
  }
  function examRoom(c, a) {
    const dl = R().deadline(c, a);

  L.actions['enrol-confirm'] = async () => {
    const p = W.prospectus; if (!p) return;
    const ok = await L.ui.confirm({ title: `Enrol in ${p.code}?`, body: `<p><b>${esc(p.title)}</b> — ${p.term.weeks} weeks from ${L.fmt.dateLong(p.term.start)}, ${p.plan.hoursPerWeek} hours a week, ${p.assessments.length} assessments.</p><p>From this moment the schedule is binding: no date, weight or examination can be changed. Withdrawal is possible until ${L.fmt.date(L.date.addDays(L.date.parse(p.policy.withdrawBefore), -1))}.</p>`, ok: 'Enrol' });
    if (!ok) return;
    const c = await R().enrol(p);
    W.step = 1; W.sources = []; W.hint = ''; W.plans = null; W.prospectus = null; W.log = []; W.sampleLoaded = false;
    L.ui.toast(`Enrolled in ${c.code}. Term begins ${L.fmt.date(c.term.start)}.`, 'good', 5000);
    L.go(`/course/${c.id}`);
  };
})(window.L);

</script>

</script>
