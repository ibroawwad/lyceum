/* ============================================================
   Lyceum — design system, HabitKit direction
   Dark by default. Rounded charcoal cards, one bright colour per
   course, tile grids for daily study, a clean bold sans, no rules.
   ============================================================ */
:root {
  --bg: #121a29;
  --card: #1a2436;
  --card-2: #243046;
  --card-3: #2f3d56;
  --line: #27334a;
  --text: #ece7db;
  --text-2: #c3bfb3;
  --muted: #8b95a8;
  --accent: #e8d9a8;
  --accent-ink: #1a2436;
  --accent-soft: rgba(232, 217, 168, 0.14);
  --good: #7fd6a4;
  --warn: #f0c36b;
  --bad: #f08a8a;
  --focus: #9ec1ff;
  --ch: #22d3ee;
  --k-practise: #e2b86a; --k-review: #b9a7e6;
  --a-quiz: #8ec5e8; --a-pset: #e2b86a; --a-midterm: #f0a0a0; --a-final: #b9a7e6; --a-project: #9ecbb3;
  --r-card: 22px;
  --r-ctl: 14px;
  --r-tile: 3px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tab-h: 64px;
  --rail-w: 232px;
  /* legacy aliases used by older markup */
  --paper: var(--bg); --surface: var(--card); --surface-2: var(--card-2); --ink: var(--text); --ink-2: var(--text-2); --line-2: var(--card-3);
  --font-body: var(--font); --font-display: var(--font); --radius: var(--r-ctl); --radius-sm: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f3; --card: #ffffff; --card-2: #e6e9ef; --card-3: #d6dbe5; --line: #e1e5ec; --text: #16202f; --text-2: #3b4658; --muted: #6b7686;
    --accent: #2f4a78; --accent-ink: #ffffff; --accent-soft: rgba(47, 74, 120, 0.12); --good: #1f8a5b; --warn: #a3690b; --bad: #c8414b; --focus: #2f6fd6; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f3; --card: #ffffff; --card-2: #e6e9ef; --card-3: #d6dbe5; --line: #e1e5ec; --text: #16202f; --text-2: #3b4658; --muted: #6b7686;
  --accent: #2f4a78; --accent-ink: #ffffff; --accent-soft: rgba(47, 74, 120, 0.12); --good: #1f8a5b; --warn: #a3690b; --bad: #c8414b; --focus: #2f6fd6; color-scheme: light;
}

/* ---------- fog (the icon's sky, drifting) ---------- */
.fog { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.fog i { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; filter: blur(60px); opacity: 0.55; mix-blend-mode: screen; will-change: transform; }
.fog i:nth-child(1) { left: -30vmax; top: -35vmax; background: radial-gradient(closest-side, rgba(120,146,190,0.55), rgba(120,146,190,0) 70%); animation: fog-a 46s ease-in-out infinite alternate; }
.fog i:nth-child(2) { right: -35vmax; top: 10vmax; background: radial-gradient(closest-side, rgba(90,112,150,0.5), rgba(90,112,150,0) 70%); animation: fog-b 58s ease-in-out infinite alternate; }
.fog i:nth-child(3) { left: 10vmax; bottom: -45vmax; background: radial-gradient(closest-side, rgba(150,165,190,0.35), rgba(150,165,190,0) 70%); animation: fog-c 70s ease-in-out infinite alternate; }
@keyframes fog-a { to { transform: translate(18vmax, 10vmax) scale(1.15); } }
@keyframes fog-b { to { transform: translate(-16vmax, 14vmax) scale(0.9); } }
@keyframes fog-c { to { transform: translate(-12vmax, -18vmax) scale(1.2); } }
:root[data-theme="light"] .fog i { opacity: 0.35; mix-blend-mode: multiply; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .fog i { opacity: 0.35; mix-blend-mode: multiply; } }
.app, .toast-host, .modal-host { position: relative; z-index: 1; }
.rail { z-index: 30; }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; background: var(--bg); scroll-padding-bottom: calc(var(--tab-h) + 24px); scroll-padding-top: calc(env(safe-area-inset-top) + 12px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* ---------- motion ---------- */
.main > .page, .main > .welcome { animation: page-in 260ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
.stagger > * { animation: rise-in 360ms cubic-bezier(.2,.8,.2,1) both; }
.stagger > :nth-child(1) { animation-delay: 0ms; } .stagger > :nth-child(2) { animation-delay: 40ms; } .stagger > :nth-child(3) { animation-delay: 80ms; } .stagger > :nth-child(4) { animation-delay: 120ms; } .stagger > :nth-child(5) { animation-delay: 160ms; } .stagger > :nth-child(n+6) { animation-delay: 200ms; }
@keyframes rise-in { from { opacity: 0; transform: translateY(10px); } }
.pressable, .course-card, .btn, .chunk-check, .rail-nav a, .pace-card, .row { transition: transform 140ms cubic-bezier(.2,.8,.2,1), background-color 160ms, color 160ms, box-shadow 160ms, opacity 160ms; }
.course-card:active, .pace-card:active { transform: scale(0.985); }
.chunk-check:active { transform: scale(0.9); }
.rail-nav a:active svg { transform: scale(0.88); }
.rail-nav a svg { transition: transform 160ms cubic-bezier(.2,.8,.2,1); }
.rail-nav a[aria-current="page"] svg { transform: translateY(-1px); }
.progress > i { transition: width 600ms cubic-bezier(.2,.8,.2,1); }
.tile-n { animation: count-in 500ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes count-in { from { opacity: 0; transform: translateY(6px); } }
.tabs a { transition: background-color 180ms, color 180ms; }
.modal { animation: sheet-up 260ms cubic-bezier(.2,.8,.2,1); } .modal-backdrop { animation: fade-in 200ms; }
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } } @keyframes fade-in { from { opacity: 0; } }
.chunk[data-state="done"] .chunk-check::after, .chunk[data-state="late"] .chunk-check::after { animation: check-draw 260ms cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes check-draw { from { transform: rotate(-45deg) translate(1px, -1px) scale(0.3); opacity: 0; } }
.chart rect { transform-origin: bottom; animation: bar-up 600ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes bar-up { from { transform: scaleY(0); } }

/* ---------- type ---------- */
.display { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.serif { font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 13px; } .muted { color: var(--muted); }
.label, .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; text-transform: none; }
.eyebrow { display: block; margin-bottom: 6px; }
.lede { font-size: 15px; color: var(--text-2); max-width: 60ch; margin-top: 6px; }
.nowrap { white-space: nowrap; } .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; } .center { text-align: center; } .w-full { width: 100%; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 20px; } .mt-4 { margin-top: 32px; }
.mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 12px; } .mb-3 { margin-bottom: 20px; } .mb-4 { margin-bottom: 32px; }
.gap-1 { gap: 6px; } .gap-2 { gap: 12px; } .gap-3 { gap: 20px; }

/* ---------- logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.logo svg { width: 30px; height: 30px; flex: none; color: var(--text); }
.logo .mark-img { width: 30px; height: 30px; flex: none; }
.logo.is-big .mark-img { width: 72px; height: 72px; }

/* ---------- layout: phone-first, tab bar; desktop gets a slim rail ---------- */
@media (max-width: 1023px) { html, body { overflow-x: hidden; } }
.app { min-height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 35; }
.page > * { min-width: 0; }
.main { min-width: 0; }
.page { max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; }
.page-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.page-head.is-row { flex-direction: row; align-items: center; justify-content: space-between; }
.page-head > div:first-child { min-width: 0; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.rail[hidden] { display: none; }
.rail-brand, .rail-foot { display: none; }
.rail-nav { display: flex; height: var(--tab-h); }
.rail-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.rail-nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail-nav a[aria-current="page"] { color: var(--accent); }
.rail-nav .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.rail-nav .badge.is-quiet { background: var(--card-3); color: var(--text-2); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.cols { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-head h2 { font-size: 13px; font-weight: 600; color: var(--muted); }
.divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.card { background: color-mix(in srgb, var(--card) 92%, transparent); border-radius: var(--r-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.card-head h2, .card-head h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 14px 18px 16px; }
.card-body.pt-0 { padding-top: 6px; }
.card.quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--text); min-width: 0; }
.row:first-child { border-top: 0; }
.row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .t span { display: block; font-size: 12.5px; color: var(--muted); }
.row .letter { font-size: 18px; }
.panel { background: var(--card-2); border-radius: var(--r-ctl); padding: 12px 14px; }
.empty { padding: 28px 20px; background: var(--card); border-radius: var(--r-card); }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--text-2); max-width: 52ch; }
.today-grid { display: flex; flex-direction: column; gap: 12px; }
.reading-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
.reading-side { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1023px) { .reading-side { order: -1; } } /* on a phone the checklist comes before the pages */

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); padding-bottom: 0; }
  .rail { position: sticky; top: 0; bottom: auto; height: 100dvh; margin-top: calc(-1 * env(safe-area-inset-top)); padding-top: calc(22px + env(safe-area-inset-top)); display: flex; flex-direction: column; background: var(--bg); border-top: 0; border-right: 1px solid var(--line); padding: 22px 14px 18px; }
  .rail-brand { display: block; padding: 0 10px 22px; }
  .rail-nav { flex-direction: column; height: auto; gap: 2px; }
  .rail-nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; border-radius: var(--r-ctl); font-size: 14px; }
  .rail-nav a svg { width: 20px; height: 20px; }
  .rail-nav a[aria-current="page"] { background: var(--card); color: var(--text); }
  .rail-nav .badge { position: static; margin-left: auto; }
  .rail-foot { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 16px; }
  .page { max-width: 680px; padding: 36px 40px 60px; }
  .page-head { flex-direction: row; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  .page-head.is-row { align-items: center; }
  .display { font-size: 30px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .page.is-wide { max-width: 980px; }
  .reading-layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .reading-side { position: sticky; top: 24px; }
}
.rail-clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding: 0 12px; }
.rail-clock .big { font-size: 26px; font-weight: 600; line-height: 1; }
.rail-clock .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.rail-next { font-size: 12.5px; color: var(--text-2); padding: 10px 12px; border-radius: var(--r-ctl); background: var(--card); }
.rail-next .label { display: block; margin-bottom: 3px; }
.rail-next .when { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.rail-student { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.rail-student .seal { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.rail-student .name { font-weight: 600; font-size: 13.5px; line-height: 1.2; } .rail-student .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: var(--r-ctl); border: 0; background: var(--card-2); color: var(--text); font-weight: 600; font-size: 14px; line-height: 1.2; cursor: pointer; white-space: nowrap; transition: filter 120ms, transform 60ms; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: transparent; color: var(--text-2); }
.btn-quiet:hover { background: var(--card-2); }
.btn-danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn-icon { width: 40px; min-height: 40px; padding: 0; border-radius: 50%; font-size: 24px; font-weight: 500; line-height: 1; background: var(--card-2); color: var(--text); }
.btn[disabled], .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.input, .textarea, .select { width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: var(--r-ctl); background: var(--card-2); color: var(--text); font-size: 16px; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: 0; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 600; font-size: 13px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.switch { display: inline-flex; background: var(--card-2); border-radius: 10px; padding: 3px; gap: 2px; }
.switch button, .switch a { padding: 7px 12px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
.switch button[aria-pressed="true"], .switch a.is-on { background: var(--card); color: var(--text); }
.drop { border: 1.5px dashed var(--card-3); border-radius: var(--r-card); padding: 22px 16px; text-align: center; color: var(--muted); background: var(--card); }
.drop.is-over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop label.btn { position: relative; margin-top: 10px; }
.progress { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ch, var(--accent)); border-radius: 4px; transition: width 300ms; }
.progress.is-over > i { background: var(--bad); }
.log { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
.log div::before { content: "› "; color: var(--muted); }
.busy { border-radius: var(--r-card); background: var(--card); padding: 12px 16px; margin-bottom: 16px; }
.busy-bar { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.busy-bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: busy 1.2s ease-in-out infinite; }
@keyframes busy { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- data ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table .num, .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .row-muted td { color: var(--muted); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tile { padding: 12px 14px; border-radius: var(--r-ctl); background: var(--card-2); }
.tile-n { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile-l { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; background: var(--card-2); color: var(--text-2); white-space: nowrap; }
.chip::before { content: none; }
.chip[data-state="open"], .chip[data-state="good"], .chip[data-state="running"] { color: var(--good); } .chip[data-state="open"]::before, .chip[data-state="good"]::before, .chip[data-state="running"]::before { background: var(--good); }
.chip[data-state="late"], .chip[data-state="warn"], .chip[data-state="in_progress"] { color: var(--warn); } .chip[data-state="late"]::before, .chip[data-state="warn"]::before, .chip[data-state="in_progress"]::before { background: var(--warn); }
.chip[data-state="missed"], .chip[data-state="bad"] { color: var(--bad); } .chip[data-state="missed"]::before, .chip[data-state="bad"]::before { background: var(--bad); }
.chip[data-state="graded"], .chip[data-state="submitted"], .chip[data-state="completed"] { background: var(--text); color: var(--bg); } .chip[data-state="graded"]::before, .chip[data-state="submitted"]::before, .chip[data-state="completed"]::before { background: var(--bg); }
.chip[data-state="upcoming"], .chip[data-state="neutral"], .chip[data-state="withdrawn"] { color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--ch); flex: none; }
.code { font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; color: var(--ch); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--text-2); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .bar { flex: 1; height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ch, var(--accent)); }
.letter { font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
.icon-sq { width: 42px; height: 42px; border-radius: 13px; background: var(--ch); color: #0b0c0d; display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: 0.02em; flex: none; }
.icon-sq.is-sm { width: 34px; height: 34px; border-radius: 10px; font-size: 12px; }

/* ---------- study tiles (the signature grid) ---------- */
.tiles-wrap { max-width: 100%; overflow: hidden; }
.tiles { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--tile, 12px)); grid-auto-columns: var(--tile, 12px); gap: var(--gap, 3px); width: max-content; }
.tiles i, .tiles-row i { display: block; width: var(--tile, 12px); height: var(--tile, 12px); border-radius: max(2px, calc(var(--tile, 12px) * 0.28)); background: var(--card-3); transition: background-color 400ms ease, transform 300ms cubic-bezier(.2,.8,.2,1), opacity 300ms; }
.tiles i[data-v="full"], .tiles-row i[data-v="full"] { background: var(--ch); }
.tiles i[data-v="part"], .tiles-row i[data-v="part"] { background: color-mix(in srgb, var(--ch) 45%, var(--card-3)); }
.tiles i[data-v="none"], .tiles-row i[data-v="none"] { background: color-mix(in srgb, var(--bad) 22%, var(--card-3)); }
.tiles i[data-v="future"], .tiles-row i[data-v="future"] { background: var(--card-3); opacity: 0.8; }
.tiles i[data-v="off"], .tiles-row i[data-v="off"] { background: var(--card-2); opacity: 0.55; }
.tiles i.is-today, .tiles-row i.is-today { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--ch); }
.tiles i.is-today[data-v="full"] { animation: tile-pop 420ms cubic-bezier(.2,.9,.3,1.4); }
.tiles-row { display: grid; grid-auto-flow: column; grid-auto-columns: var(--tile, 12px); gap: var(--gap, 3px); width: max-content; max-width: 100%; overflow: hidden; }
@keyframes tile-pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
.tiles-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 8px; justify-content: flex-end; }
.tiles-legend i { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; background: var(--card-3); }
.tiles-legend i[data-v="part"] { background: color-mix(in srgb, var(--ch) 45%, var(--card-3)); } .tiles-legend i[data-v="full"] { background: var(--ch); }

/* ---------- course cards ---------- */
.course-card { display: flex; flex-direction: column; gap: 14px; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: var(--r-card); padding: 16px 18px 18px; color: var(--text); }
.course-card:hover { background: var(--card-2); }
.course-card .head { display: flex; align-items: center; gap: 12px; }
.course-card .head .t { min-width: 0; flex: 1; }
.course-card .head .t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.course-card .head .t span { font-size: 12.5px; color: var(--muted); }
.course-card .letter { font-size: 20px; color: var(--text-2); }
.course-lockup { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.course-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--text-2); }
.course-meta b { font-weight: 700; color: var(--text); }
.tabs { display: flex; gap: 2px; margin: 16px 0 16px; overflow-x: auto; scrollbar-width: none; background: var(--card); border-radius: 999px; padding: 4px; }
.tabs a { flex: 1; text-align: center; padding: 8px 6px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tabs a[aria-current="page"] { background: var(--card-2); color: var(--text); }
.syllabus { display: flex; flex-direction: column; gap: 10px; }
.week-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px 12px; padding: 14px 16px; background: var(--card); border-radius: var(--r-card); }
.week-row .wk { grid-column: 1; grid-row: 1 / 3; }
.week-row > :nth-child(3) { grid-column: 2; min-width: 0; }
.week-row.is-current { box-shadow: inset 0 0 0 1.5px var(--ch); }
.week-row.is-past { opacity: 0.7; }
.week-row .wk { font-size: 11px; font-weight: 600; color: var(--muted); }
.week-row .wk b { display: block; font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; margin-top: 2px; }
.week-row .dates { grid-column: 2; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.week-row .topic { font-weight: 600; }
.week-row .parts { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.week-row .objectives { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-2); }
.week-row details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 6px; list-style: none; }
.week-row details summary::before { content: "+ "; } .week-row details[open] summary::before { content: "– "; }

/* ---------- study blocks & chunks ---------- */

.chunk-check::after { content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--card-3); border-bottom: 2.5px solid var(--card-3); transform: rotate(-45deg) translate(1px, -1px); }
.chunk[data-state="due"] .chunk-check:hover, .chunk[data-state="overdue"] .chunk-check:hover { box-shadow: inset 0 0 0 2px var(--ch); }
.chunk[data-state="done"] .chunk-check, .chunk[data-state="late"] .chunk-check { background: var(--ch); box-shadow: none; } .chunk[data-state="done"] .chunk-check::after, .chunk[data-state="late"] .chunk-check::after { border-color: #0b0c0d; }
.chunk[data-state="done"] .chunk-title, .chunk[data-state="late"] .chunk-title { color: var(--muted); }

@media (min-width: 1024px) { .plan-days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- today ---------- */

/* ---------- exam ---------- */

.exam-bar .timer { grid-column: 2; grid-row: 1 / 3; font-family: var(--font-mono); font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

@keyframes pulse { 50% { opacity: 0.55; } }

.result { max-width: 780px; }

/* ---------- calendar ---------- */

.calendar { display: none; }

@media (min-width: 1024px) {
  .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-radius: var(--r-card); overflow: hidden; background: var(--line); gap: 1px; }

  .cal-day { background: var(--card); min-height: 104px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
  .cal-day .d { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
  .cal-day.is-other { background: var(--bg); } .cal-day.is-other .d { color: var(--muted); }
  .cal-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); } .cal-day.is-today .d { color: var(--accent); font-weight: 700; }

  .timetable .tt-col { position: relative; height: 520px; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 40px); }
  .timetable .tt-hours { position: relative; height: 520px; }
  .timetable .tt-hours span { position: absolute; right: 8px; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .tt-block { position: absolute; left: 3px; right: 3px; padding: 4px 6px; border-radius: 6px; background: color-mix(in srgb, var(--ch) 22%, transparent); border-left: 3px solid var(--ch); font-size: 11.5px; line-height: 1.25; overflow: hidden; color: var(--text); }
  .tt-block b { display: block; font-family: var(--font-mono); font-weight: 600; }
}

/* ---------- record ---------- */
.transcript { background: var(--card); padding: 18px 16px; border-radius: var(--r-card); }

.transcript .table-wrap { margin: 0 -16px; padding: 0 16px; }
.ledger-list .table td { font-size: 13px; }
.hash { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
@media (min-width: 1024px) { .transcript { padding: 28px 32px; } }

.wizard-step { flex: 1 1 0; min-width: 0; padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card); border-radius: 10px; display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
@media (max-width: 760px) { .wizard-step { flex: 0 0 auto; padding: 8px 9px; } .wizard-step:not(.is-active) { font-size: 0; gap: 0; } .wizard-step:not(.is-active) .n { font-size: 11px; } .wizard-step.is-active { flex: 1 1 auto; } }
.wizard-step .n { font-family: var(--font-mono); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; flex: none; }

.wizard-step.is-done .n { background: var(--text); color: var(--bg); }
.sources { display: flex; flex-direction: column; }

.pace-card .pace-n span { font-size: 14px; color: var(--muted); font-weight: 500; }
.pace-card p, .pace-card .kv { grid-column: 1; }

.prospectus { background: var(--card); border-radius: var(--r-card); }
.prospectus-head { padding: 18px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.prospectus-head h2 { font-size: 22px; line-height: 1.15; margin-top: 4px; }

.prospectus details summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); list-style: none; }
.prospectus details summary::before { content: "+ "; } .prospectus details[open] summary::before { content: "– "; }
@media (min-width: 1024px) { .paces { grid-template-columns: repeat(3, 1fr); } .pace-card { grid-template-columns: 1fr; } .pace-card .btn { grid-column: 1; grid-row: auto; margin-top: 8px; } .prospectus-head, .prospectus-body { padding: 24px 28px; } }

/* ---------- toasts, modals ---------- */

.toast { padding: 12px 14px; border-radius: var(--r-ctl); background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 500; border-left: 4px solid var(--muted); animation: rise 180ms ease-out; }
.toast[data-kind="good"] { border-left-color: var(--good); } .toast[data-kind="warn"] { border-left-color: var(--warn); } .toast[data-kind="bad"] { border-left-color: var(--bad); }

.modal-host { position: fixed; inset: 0; z-index: 40; display: none; }

.sheet-table tbody th { border-bottom: 1px solid var(--rule); }
.sheet-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; } .sheet-table td.num { text-align: right; }
.sheet-table tr:last-child td, .sheet-table tr:last-child th { border-bottom: 0; }
.sheet-dim { color: var(--dim); font-size: 12.5px; }
.sheet-cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.sheet-clauses { margin: 16px 0 0; padding-left: 22px; font-size: 14px; } .sheet-clauses li { margin-bottom: 4px; }
.sheet-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; padding-top: 18px; border-top: 2px solid var(--gold); }
.sign-label { font-family: Inter, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.pad-wrap { position: relative; height: 120px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pad-wrap canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.pad-wrap.is-signed img { max-height: 100px; max-width: 90%; }
.pad-wrap.is-registrar { border: 0; background: transparent; color: var(--gold); gap: 10px; justify-content: flex-start; }
.registrar-script { font-style: italic; font-size: 24px; color: var(--green); }
.pad-clear { position: absolute; right: 6px; bottom: 6px; font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; border: 0; background: #efece4; color: #4a4536; padding: 4px 8px; border-radius: 6px; }
.sign-name { width: 100%; margin-top: 8px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--ink); background: transparent; font-family: "EB Garamond", Georgia, serif; font-size: 18px; color: var(--ink); border-radius: 0; }
.sign-name.is-signed { font-weight: 500; }
.sign-name::placeholder { color: #a39c8c; font-style: italic; font-size: 15px; }
.sign-date { font-family: Inter, system-ui, sans-serif; font-size: 11px; color: var(--dim); margin-top: 6px; }
@media (max-width: 760px) {
  .assess-table thead { display: none; }
  .assess-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .assess-table td { display: block; border: 0; padding: 0; text-align: left; }
  .assess-table td:first-child { grid-column: 1 / -1; }
  .assess-table td:nth-child(2)::before { content: "Opens "; color: var(--muted); } .assess-table td:nth-child(3)::before { content: "Due "; color: var(--muted); }
  .assess-table td:nth-child(2), .assess-table td:nth-child(3) { grid-column: 1; font-size: 13px; }
  .assess-table td:nth-child(4), .assess-table td:nth-child(5) { display: none; }
  .assess-table td:nth-child(6) { grid-column: 2; grid-row: 2; text-align: right; }
  .assess-table td:nth-child(7) { grid-column: 2; grid-row: 3; text-align: right; }
  .assess-table td:nth-child(8) { grid-column: 1 / -1; text-align: right; margin-top: 4px; }
  .breakdown-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
  .tiles-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .sheet { padding: 22px 18px; font-size: 14px; }
  .sheet-head { grid-template-columns: auto 1fr; } .sheet-no { grid-column: 1 / -1; text-align: left; }
  .sheet-name { font-size: 24px; } .sheet-title { font-size: 24px; }
  .sheet-cols, .sheet-sign { grid-template-columns: 1fr; gap: 16px; }
  .sheet-table { font-size: 13px; } .sheet-table th { white-space: normal; }
}
.chart text { font-family: var(--font); font-size: 15px; }

/* ---------- print ---------- */
@media print {
  @page { margin: 12mm; }
  .rail, .page-head .actions, .btn, .toast-host, .modal-host, .tabs, .page-head, .page > p { display: none !important; }
  .app { display: block; padding: 0; } .page { max-width: none; padding: 0; } body { background: #fff; color: #000; }
  .transcript { border: 0; padding: 0; }
  .sheet { max-width: none; box-shadow: none; padding: 0; }
  .sheet.contract { font-size: 13px; }
  .sheet.certificate svg { width: 100%; }
  .pad-clear { display: none; }
}

</style>
</head>
<body>
<div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app" class="app">
  <aside id="rail" class="rail" aria-label="Navigation"></aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="toasts" class="toast-host" aria-live="polite"></div>
<div id="modals" class="modal-host"></div>
<script>

/* ---- core.js ---- */
window.L = window.L || {};
(function (L) {
  'use strict';

  L.VERSION = 1;
  const KEY = 'lyceum.v1';
  const THEME_KEY = 'lyceum.theme';

  // ---------- small utilities ----------
  L.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  L.clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  L.sum = (arr) => arr.reduce((a, b) => a + (Number(b) || 0), 0);
  L.by = (key) => {
    const f = typeof key === 'function' ? key : (o) => o[key];
    return (a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; };
  };
  L.cc = (c) => (c && c.color) || '#8ec5e8'; // a course's colour, HabitKit-style
  L.groupBy = (arr, fn) => arr.reduce((m, x) => { const k = typeof fn === 'function' ? fn(x) : x[fn]; (m[k] = m[k] || []).push(x); return m; }, {});
  L.uid = (prefix = 'x') => {
    const b = new Uint8Array(6); crypto.getRandomValues(b);
    return prefix + '_' + Array.from(b, (n) => (n % 36).toString(36)).join('') + (Date.now() % 1296).toString(36).padStart(2, '0');
  };
  L.sha256 = async (str) => {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  };

  // ---------- event bus ----------
  const handlers = {};
  L.on = (ev, fn) => { (handlers[ev] = handlers[ev] || []).push(fn); };
  L.off = (ev, fn) => { handlers[ev] = (handlers[ev] || []).filter((f) => f !== fn); };
  L.emit = (ev, payload) => { (handlers[ev] || []).forEach((fn) => { try { fn(payload); } catch (e) { console.error(e); } }); };

  // ---------- state ----------
  function defaults() {
    return {
      version: L.VERSION,
      student: null,
      settings: { apiKey: '', model: 'anthropic/claude-fable-5.1', weeklyHours: 12, theme: 'dark' },
      clock: { offsetMs: 0 },
      courses: [],
      ledger: [],
      ui: { collapsed: {}, lastRoute: '' },
    };
  }
  function migrate(s) {
    const d = defaults();
    const out = Object.assign(d, s || {});
    out.settings = Object.assign(d.settings, s?.settings || {});
    if (out.settings.theme === 'system' && !out.settings.themeChosen) out.settings.theme = 'dark'; // dark is the default until the student picks
    out.clock = Object.assign(d.clock, s?.clock || {});
    out.ui = Object.assign(d.ui, s?.ui || {});
    out.courses = (Array.isArray(s?.courses) ? s.courses : []).filter((c) => {
      const ok = c && c.id && c.term && c.plan && Array.isArray(c.sessions) && Array.isArray(c.assessments) && Array.isArray(c.weeks) && c.material && c.policy;
      if (!ok) console.warn('Lyceum: skipped a corrupt course record', c && c.id);
      return ok;
    });
    out.ledger = Array.isArray(s?.ledger) ? s.ledger : [];
    out.version = L.VERSION;
    return out;
  }
  L.load = () => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
    let parsed = null;
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { console.warn('Lyceum: stored record unreadable, starting fresh'); } }
    L.S = migrate(parsed);
    return L.S;
  };
  let saveTimer = null;
  L.storageProblem = null; // set when the record cannot be written; the UI shows it until it clears
  L.saveNow = () => {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try { localStorage.setItem(KEY, JSON.stringify(L.S)); L.storageProblem = null; }
    catch (e) {
      console.error('Lyceum: could not save', e);
      L.storageProblem = /quota/i.test(e.name + e.message) ? 'Storage is full on this device. Export your record from Settings, then erase old courses.' : 'This device refused to save the record: ' + e.message;
      if (L.ui) L.ui.toast(L.storageProblem, 'bad', 8000);
    }
    L.emit('state');
  };
  L.save = () => { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(L.saveNow, 150); };
  L.reset = async () => {
    try { localStorage.removeItem(KEY); localStorage.removeItem(THEME_KEY); } catch (e) { /* ignore */ }
    try { await new Promise((res) => { const r = indexedDB.deleteDatabase('lyceum'); r.onsuccess = r.onerror = r.onblocked = () => res(); }); } catch (e) { /* ignore */ }
    location.replace(location.pathname + location.search + '#/welcome');
    location.reload();
  };

  // ---------- clock ----------
  L.debug = (() => { try { return new URLSearchParams(location.search).has('debug'); } catch (e) { return false; } })();
  L.now = () => Date.now() + (L.S?.clock?.offsetMs || 0);
  L.today = () => L.date.startOfDay(new Date(L.now()));
  L.clock = {
    async setOffset(ms) {
      if (!L.debug) throw new Error('The registrar clock can only be moved in debug mode.');
      const from = L.S.clock.offsetMs || 0;
      L.S.clock.offsetMs = Math.round(ms);
      await L.ledger.append('clock_override', { fromMs: from, toMs: L.S.clock.offsetMs, now: new Date(L.now()).toISOString() });
      L.save();
    },
    async reset() {
      const from = L.S.clock.offsetMs || 0;
      L.S.clock.offsetMs = 0;
      if (from !== 0) await L.ledger.append('clock_reset', { fromMs: from });
      L.save();
    },
  };

  // ---------- dates (local wall-clock) ----------
  const pad = (n) => String(n).padStart(2, '0');
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  L.date = {
    parse(v) {
      if (v instanceof Date) return new Date(v.getTime());
      if (typeof v === 'number') return new Date(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v + 'T00:00:00');
      return new Date(v);
    },
    iso(d) { d = L.date.parse(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
    isoLocal(d) { d = L.date.parse(d); return `${L.date.iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; },
    startOfDay(d) { d = L.date.parse(d); d.setHours(0, 0, 0, 0); return d; },
    addDays(d, n) { d = L.date.parse(d); d.setDate(d.getDate() + n); return d; },
    addMin(d, n) { d = L.date.parse(d); d.setMinutes(d.getMinutes() + n); return d; },
    setTime(d, h, m = 0, s = 0) { d = L.date.parse(d); d.setHours(h, m, s, 0); return d; },
    dow(d) { d = L.date.parse(d); return (d.getDay() + 6) % 7; },
    nextMonday(from) {
      const now = from ? L.date.parse(from) : new Date(L.now());
      const day = L.date.startOfDay(now);
      const dow = L.date.dow(day);
      if (dow === 0 && now.getHours() < 8) return day;
      return L.date.addDays(day, 7 - dow);
    },
    dayName: (d) => DAYS[L.date.dow(d)],
    monthName: (d) => MONTHS[L.date.parse(d).getMonth()],
  };
  L.fmt = {
    date(d) { d = L.date.parse(d); return `${DAYS[L.date.dow(d)].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; },
    dateLong(d) { d = L.date.parse(d); return `${DAYS[L.date.dow(d)]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
    time(d) { d = L.date.parse(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; },
    dt(d) { return `${L.fmt.date(d)}, ${L.fmt.time(d)}`; },
    rel(ms) {
      const past = ms < 0; const a = Math.abs(ms);
      let s;
      if (a < 60e3) return 'now';
      if (a < 3600e3) s = `${Math.round(a / 60e3)} min`;
      else if (a < 86400e3) { const h = Math.floor(a / 3600e3); const m = Math.round((a % 3600e3) / 60e3); s = m ? `${h}h ${m}m` : `${h}h`; }
      else { const d = Math.floor(a / 86400e3); const h = Math.round((a % 86400e3) / 3600e3); s = h ? `${d}d ${h}h` : `${d}d`; }
      return past ? `${s} ago` : `in ${s}`;
    },
    dur(min) { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; },
    pct(n) { return n == null || isNaN(n) ? '—' : `${(Math.round(n * 10) / 10).toFixed(1)}%`; },
    num(n) { return Number(n || 0).toLocaleString('en-GB'); },
    clock(d) { d = L.date.parse(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; },
  };

  // ---------- IndexedDB for materials ----------
  let dbPromise = null;
  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve) => {
      if (typeof indexedDB === 'undefined') return resolve(null);
      const req = indexedDB.open('lyceum', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('materials')) db.createObjectStore('materials');
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files'); // original documents (PDF bytes, HTML)
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { console.warn('Lyceum: IndexedDB unavailable', req.error); resolve(null); };
    });
    return dbPromise;
  }
  function tx(mode, fn, storeName = 'materials') {
    return openDb().then((db) => new Promise((resolve, reject) => {
      if (!db) return resolve(null);
      const t = db.transaction(storeName, mode);
      const store = t.objectStore(storeName);
      const req = fn(store);
      t.oncomplete = () => resolve(req && 'result' in req ? req.result : null);
      t.onerror = () => reject(t.error);
    }));
  }
  const all = (storeName) => openDb().then((db) => new Promise((resolve, reject) => {
    if (!db) return resolve({});
    const out = {};
    const req = db.transaction(storeName, 'readonly').objectStore(storeName).openCursor();
    req.onsuccess = () => { const c = req.result; if (!c) return resolve(out); out[c.key] = c.value; c.continue(); };
    req.onerror = () => reject(req.error);
  }));
  L.db = {
    putMaterial: (id, text) => tx('readwrite', (s) => s.put(text, id)),
    getMaterial: (id) => tx('readonly', (s) => s.get(id)).then((r) => (r == null ? null : r)),
    deleteMaterial: (id) => tx('readwrite', (s) => s.delete(id)),
    allMaterials: () => all('materials'),
    // originals: { kind:'pdf', name, blob: Blob } | { kind:'html', name, html }. Blobs are what iOS Safari stores reliably.
    putFile: (id, file) => tx('readwrite', (s) => s.put(file.bytes ? { kind: file.kind, name: file.name, blob: new Blob([file.bytes], { type: 'application/pdf' }) } : file, id), 'files'),
    getFile: (id) => tx('readonly', (s) => s.get(id), 'files').then(async (r) => { if (r == null) return null; if (r.blob && !r.bytes) r.bytes = await r.blob.arrayBuffer(); return r; }),
    deleteFile: (id) => tx('readwrite', (s) => s.delete(id), 'files'),
    allFiles: () => all('files'),
  };

  // ---------- ledger (hash chain) ----------
  let queue = Promise.resolve();
  function entryBytes(e) {
    const body = { i: e.i, t: e.t, type: e.type };
    if (e.courseId !== undefined) body.courseId = e.courseId;
    if (e.ref !== undefined) body.ref = e.ref;
    body.detail = e.detail;
    return e.prev + '|' + JSON.stringify(body);
  }
  L.ledger = {
    append(type, detail = {}) {
      const run = async () => {
        const prev = L.S.ledger.length ? L.S.ledger[L.S.ledger.length - 1].hash : '0';
        const e = { i: L.S.ledger.length, t: new Date(L.now()).toISOString(), type, detail, prev };
        if (detail.courseId !== undefined) e.courseId = detail.courseId;
        if (detail.ref !== undefined) e.ref = detail.ref;
        e.hash = await L.sha256(entryBytes(e));
        L.S.ledger.push(e);
        L.save();
        return e;
      };
      queue = queue.then(run, run);
      return queue;
    },
    async verify() {
      let prev = '0';
      for (let i = 0; i < L.S.ledger.length; i++) {
        const e = L.S.ledger[i];
        if (e.i !== i || e.prev !== prev) return { ok: false, brokenAt: i };
        const h = await L.sha256(entryBytes(e));
        if (h !== e.hash) return { ok: false, brokenAt: i };
        prev = e.hash;
      }
      return { ok: true, brokenAt: null };
    },
  };

  // ---------- export / import ----------
  const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (str) => { const bin = atob(str); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  const FILE_EXPORT_LIMIT = 40 * 1024 * 1024;
  L.exportRecord = async () => {
    const state = JSON.parse(JSON.stringify(L.S));
    state.settings.apiKey = ''; // a record export is meant to travel; the key is not
    const files = await L.db.allFiles();
    let bytes = 0;
    for (const f of Object.values(files)) bytes += f.blob ? f.blob.size : f.bytes ? f.bytes.byteLength : (f.html || '').length;
    const out = { version: L.VERSION, exportedAt: new Date().toISOString(), state, materials: await L.db.allMaterials() };
    if (bytes <= FILE_EXPORT_LIMIT) {
      out.files = {};
      for (const [id, f] of Object.entries(files)) {
        const raw = f.blob ? await f.blob.arrayBuffer() : f.bytes;
        out.files[id] = raw ? { kind: f.kind, name: f.name, bytes64: b64(raw) } : f;
      }
    } else out.filesOmitted = bytes;
    return out;
  };
  L.importRecord = async (obj) => {
    if (!obj || typeof obj !== 'object' || !obj.state || !Array.isArray(obj.state.courses)) {
      throw new Error('That file is not a Lyceum record export.');
    }
    const next = migrate(obj.state);
    Object.keys(L.S).forEach((k) => delete L.S[k]);
    Object.assign(L.S, next);
    for (const [id, text] of Object.entries(obj.materials || {})) await L.db.putMaterial(id, text);
    for (const [id, f] of Object.entries(obj.files || {})) await L.db.putFile(id, f.bytes64 ? { kind: f.kind, name: f.name, bytes: unb64(f.bytes64) } : f);
    await L.ledger.append('data_imported', { courses: L.S.courses.length, exportedAt: obj.exportedAt || null });
    L.saveNow();
    if (L.render) L.render();
  };

  // ---------- theme ----------
  L.theme = {
    set(mode) {
      const root = document.documentElement;
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
      try { if (mode === 'light' || mode === 'dark') localStorage.setItem(THEME_KEY, mode); else localStorage.removeItem(THEME_KEY); } catch (e) { /* ignore */ }
      if (L.S) { L.S.settings.theme = mode; L.S.settings.themeChosen = true; L.save(); }
    },
    apply() { const chosen = L.S?.settings?.themeChosen; L.theme.set(L.S?.settings?.theme || 'dark'); if (L.S && !chosen) { L.S.settings.themeChosen = false; } },
  };

  // ---------- ui helpers ----------
  const $ = (sel) => document.querySelector(sel);
  L.ui = {
    toast(message, kind = 'info', ms = 3200) {
      const host = $('#toasts'); if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast'; el.dataset.kind = kind; el.textContent = message;
      host.appendChild(el);
      while (host.children.length > 4) host.firstChild.remove();
      setTimeout(() => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 250); }, ms);
    },
    modal({ title, body = '', actions = [], wide = false, onAction }) {
      const host = $('#modals'); if (!host) return;
      host.innerHTML = `
        <div class="modal-backdrop" data-act="modal-cancel"></div>
        <div class="modal${wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <h2 id="modal-title" class="modal-title">${L.esc(title)}</h2>
          <div class="modal-body">${body}</div>
          <div class="modal-actions">${actions.map((a) => `<button class="btn ${a.primary ? (a.danger ? 'btn-danger' : 'btn-primary') : 'btn-quiet'}" data-act="${L.esc(a.act)}">${L.esc(a.label)}</button>`).join('')}</div>
        </div>`;
      host.classList.add('is-open');
      host._onAction = onAction;
      const first = host.querySelector('.modal-actions .btn-primary, .modal-actions .btn-danger, .modal-actions .btn');
      if (first) first.focus();
    },
    closeModal() { const host = $('#modals'); if (!host) return; host.classList.remove('is-open'); host.innerHTML = ''; host._onAction = null; },
    confirm({ title, body = '', ok = 'Confirm', cancel = 'Cancel', danger = false }) {
      return new Promise((resolve) => {
        L.ui.modal({
          title, body,
          actions: [{ label: cancel, act: 'modal-cancel' }, { label: ok, act: 'modal-ok', primary: true, danger }],
          onAction: (act) => { L.ui.closeModal(); resolve(act === 'modal-ok'); },
        });
      });
    },
    busy(label) {
      const host = $('#main') || document.body;

(function (L) {
  'use strict';
  // Built-in sample material. Plainly labelled as a sample in the UI; it goes through the
  // same registrar pipeline as anything the student uploads.
  L.SAMPLE = {
    name: 'Introduction to Probability — lecture notes (sample)',
    text: `# Introduction to Probability

These notes cover the first six lectures of a one-term introduction to probability. They assume comfort with algebra and summation notation, and nothing else.

## 1. Sample spaces and events

An experiment is any process whose outcome is uncertain: tossing a coin, drawing a card, measuring tomorrow's temperature. The sample space, written S, is the set of all possible outcomes. For one toss of a coin, S = {H, T}. For two tosses, S = {HH, HT, TH, TT}. For the number of emails you receive tomorrow, S = {0, 1, 2, ...}, which is infinite but countable. For a temperature reading, S is an interval of real numbers and is uncountable.

An event is a subset of the sample space. "At least one head in two tosses" is the event A = {HH, HT, TH}. Because events are sets, the language of sets is the language of events. The union A ∪ B is the event that A or B occurs (or both). The intersection A ∩ B is the event that both occur. The complement A^c is the event that A does not occur. Two events are mutually exclusive, or disjoint, if A ∩ B is empty: they cannot both happen.

De Morgan's laws carry over directly. (A ∪ B)^c = A^c ∩ B^c says that "neither A nor B" is the same as "not A and not B". Drawing a Venn diagram is a reliable way to check any claim about three or fewer events.

## 2. The axioms of probability

A probability is a function P that assigns a number to every event and satisfies three axioms. First, P(A) ≥ 0 for every event A. Second, P(S) = 1: something in the sample space must happen. Third, if A1, A2, ... are pairwise disjoint events, then P(A1 ∪ A2 ∪ ...) = P(A1) + P(A2) + .... This third axiom is called countable additivity and it is the one that does all the work.

Several useful facts follow from the axioms alone. The complement rule: P(A^c) = 1 − P(A). The probability of the empty event is 0. If A is a subset of B then P(A) ≤ P(B). The inclusion–exclusion formula for two events: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The subtraction corrects for the outcomes counted twice, once in A and once in B. For three events the formula adds the three pairwise intersections back in and subtracts the triple intersection.

When the sample space is finite and every outcome is equally likely, probability reduces to counting: P(A) = |A| / |S|. This is the classical definition, and it is why the first weeks of any probability course lean on combinatorics. The number of ways to choose k objects from n without regard to order is the binomial coefficient C(n, k) = n! / (k!(n − k)!). The probability that a five-card poker hand is a flush, for example, is 4 × C(13, 5) / C(52, 5), which is roughly 0.00198.

## 3. Conditional probability and independence

The conditional probability of A given B, written P(A | B), is the probability of A when we know that B has occurred. It is defined, for P(B) > 0, by P(A | B) = P(A ∩ B) / P(B). Conditioning shrinks the sample space to B and rescales so that the probabilities inside B sum to one.

Rearranging the definition gives the multiplication rule: P(A ∩ B) = P(B) P(A | B). Applied repeatedly it gives the chain rule for several events, which is how one computes the probability of drawing three aces in a row without replacement: (4/52)(3/51)(2/50).

Two events are independent if P(A ∩ B) = P(A) P(B), or equivalently P(A | B) = P(A) when P(B) > 0. Independence means that learning B tells you nothing about A. It is a modelling assumption, not something you can read off a Venn diagram, and it is easy to get wrong: disjoint events with positive probability are never independent, because if one occurs the other cannot. A collection of events is mutually independent if the product rule holds for every sub-collection, which is stronger than pairwise independence.

The law of total probability lets us compute an unconditional probability by conditioning on a partition. If B1, ..., Bn are disjoint events whose union is S, then P(A) = Σ P(A | Bi) P(Bi). In words: average the conditional probabilities of A, weighting each by how likely its condition is.

## 4. Bayes' theorem

Bayes' theorem reverses the direction of conditioning. From the multiplication rule written both ways, P(A ∩ B) = P(B | A) P(A) = P(A | B) P(B), so P(A | B) = P(B | A) P(A) / P(B). The denominator is usually expanded with the law of total probability.

The standard example is a diagnostic test. Suppose a disease has prevalence 1% and a test has sensitivity 99% (it detects the disease when present) and specificity 95% (it is negative when the disease is absent). A person tests positive. The probability they have the disease is P(D | +) = (0.99 × 0.01) / (0.99 × 0.01 + 0.05 × 0.99) = 0.0099 / 0.0594, which is about 0.167. Despite an accurate test, five in six positives are false positives, because the disease is rare. This phenomenon is called the base-rate fallacy when people ignore the prevalence.

The terms have names. P(A) is the prior, P(A | B) is the posterior, P(B | A) is the likelihood, and P(B) is the evidence or marginal likelihood. Bayes' theorem says: posterior is proportional to likelihood times prior. This one line is the foundation of Bayesian statistics.

## 5. Random variables and expectation

A random variable is a function from the sample space to the real numbers. It turns outcomes into numbers so that we can do arithmetic with them. The number of heads in three tosses is a random variable X taking values in {0, 1, 2, 3}. A random variable is discrete if it takes countably many values and continuous if it takes values in an interval.

A discrete random variable is described by its probability mass function p(x) = P(X = x), which is non-negative and sums to one over all x. The cumulative distribution function F(x) = P(X ≤ x) is defined for every random variable, discrete or continuous, and is non-decreasing from 0 to 1.

The expectation, or mean, of a discrete random variable is E[X] = Σ x p(x): a weighted average of the values, weighted by their probabilities. Expectation is linear: E[aX + bY] = aE[X] + bE[Y] for any constants a and b, whether or not X and Y are independent. Linearity is the most useful single fact in the course; it lets you compute the expected number of matches, fixed points, or successes by adding indicator variables without ever finding the full distribution.

The variance measures spread: Var(X) = E[(X − μ)²] = E[X²] − μ², where μ = E[X]. Its square root is the standard deviation, which has the same units as X. Variance is not linear: Var(aX) = a² Var(X), and Var(X + Y) = Var(X) + Var(Y) only when X and Y are uncorrelated, which is implied by independence.

## 6. Common discrete distributions

The Bernoulli distribution describes a single trial with success probability p: P(X = 1) = p, P(X = 0) = 1 − p, mean p, variance p(1 − p).

The binomial distribution counts successes in n independent Bernoulli trials with the same p. Its mass function is P(X = k) = C(n, k) p^k (1 − p)^(n − k) for k = 0, ..., n, with mean np and variance np(1 − p). Both moments follow from linearity: a binomial is a sum of n Bernoullis.

The geometric distribution counts the number of trials up to and including the first success: P(X = k) = (1 − p)^(k−1) p for k = 1, 2, .... Its mean is 1/p. The geometric distribution is memoryless: given that no success has occurred in the first m trials, the remaining wait has the same distribution as the original wait.

The Poisson distribution with rate λ has P(X = k) = e^(−λ) λ^k / k! for k = 0, 1, 2, .... Its mean and variance are both λ. It arises as the limit of a binomial with n large and p small while np = λ stays fixed, which is why it models counts of rare events in a fixed interval: typos on a page, calls arriving in a minute, radioactive decays in a second.

Choosing the right distribution is a matter of matching the story. Fixed number of trials and a count of successes: binomial. Waiting for the first success: geometric. Counting rare events at a steady rate: Poisson. Learning to recognise these stories is the main skill assessed in the first examination.
`
  };
})(window.L);
