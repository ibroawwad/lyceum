    if (b.available < MIN_HPW) {
      const running = courses('active').sort(L.by((c) => c.term.end));
      const nextFree = running.length ? running[0].term.end : null;
      throw new RegistrarError('budget', `Your timetable is full: ${b.available % 1 ? b.available.toFixed(1) : b.available} hours a week are free and a course needs at least ${MIN_HPW}.${nextFree ? ` The next course ends on ${L.fmt.date(nextFree)}.` : ''}`, { available: b.available, nextFree });
    }
    const totalHours = hoursFor({ words, segments, analysis });
    const studyDays = pace.studyDays;
    // daily effort sets the weekly load; if the budget cannot carry it, the pace is reduced to fit (and says so)
    let minutesPerDay = pace.minutesPerDay;
    let hoursPerWeek = (minutesPerDay * studyDays.length) / 60;
    let reduced = false;
    if (hoursPerWeek > b.available + 1e-9) { hoursPerWeek = Math.floor(b.available * 2) / 2; minutesPerDay = Math.floor((hoursPerWeek * 60) / studyDays.length); reduced = true; }
    const weeks = L.clamp(Math.ceil(totalHours / hoursPerWeek), 2, 52);
    const credits = hoursPerWeek >= 9 ? 4 : hoursPerWeek >= 6 ? 3 : hoursPerWeek >= 4 ? 2 : 1;
    const start = D.nextMonday(L.today());
    const term = { start: D.iso(start), end: D.iso(D.addDays(start, weeks * 7 - 1)), weeks };
    const concurrent = L.S.courses.filter((c) => c.state === 'enrolled' && overlaps(c, { term }));

    // timetable slot: one daily study block on each study day, at an hour no concurrent course uses on those days
    const rows = [9, 11, 14, 16, 18, 7, 20].map((h) => ({ days: studyDays, start: h * 60, minutes: minutesPerDay }));
    const taken = (slot) => concurrent.some((c) => c.sessions.some((s) => slot.days.includes(s.day) && slot.start < s.start + s.minutes && s.start < slot.start + slot.minutes));
    const slot = rows.find((r) => !taken(r));
    if (!slot) throw new RegistrarError('timetable', 'No timetable slot is free for this term. Wait for a course to end, or withdraw from one.');

    // weeks: pour units into weeks by relative size; the midterm week takes half a load, the final week a third
    const midWeek = weeks >= 5 ? Math.ceil(weeks / 2) : 0;
    const capacity = (n) => (n === weeks ? 0.35 : n === midWeek ? 0.5 : 1);
    const C = L.sum(Array.from({ length: weeks }, (_, i) => capacity(i + 1)));
    const units = analysis.units;
    const sizeSum = L.sum(units.map((u) => u.relativeSize));
    const shares = units.map((u) => (u.relativeSize / sizeSum) * C);
    const weeksOut = [];
    let ui = 0, uLeft = shares[0], uDone = 0;
    for (let n = 1; n <= weeks; n++) {
      let cap = capacity(n);
      const parts = [];
      while (cap > 1e-9 && ui < units.length) {
        const take = Math.min(cap, uLeft);
        const frac = take / shares[ui];
        parts.push({ unit: ui, from: uDone, to: Math.min(1, uDone + frac) });
        uDone += frac; uLeft -= take; cap -= take;
        if (uLeft <= 1e-9) { ui++; uLeft = shares[ui] || 0; uDone = 0; }
      }
      if (!parts.length && ui < units.length) parts.push({ unit: ui, from: uDone, to: uDone });
      weeksOut.push({ n, start: D.iso(D.addDays(start, (n - 1) * 7)), rawParts: parts, kind: n === weeks ? 'final' : n === midWeek ? 'midterm' : 'teaching' });
    }
    if (ui < units.length) { const tail = weeksOut[weeksOut.length - 1]; for (let k = ui; k < units.length; k++) tail.rawParts.push({ unit: k, from: k === ui ? uDone : 0, to: 1 }); }
    const partCount = {}; weeksOut.forEach((w) => w.rawParts.forEach((p) => { partCount[p.unit] = (partCount[p.unit] || 0) + 1; }));
    const partSeen = {};
    let nextSeg = 0; // segments are handed out in order so no two weeks read the same pages
    for (const w of weeksOut) {
      const parts = [];
      let wantEnd = nextSeg - 1;
      for (const p of w.rawParts) {
        const u = units[p.unit];
        const [a, z] = u.segments; const n = z - a + 1;
        wantEnd = Math.max(wantEnd, L.clamp(a + Math.ceil(p.to * n) - 1, a, z));
        partSeen[p.unit] = (partSeen[p.unit] || 0) + 1;
        parts.push({ unit: p.unit, fraction: Math.max(0, p.to - p.from), label: partCount[p.unit] > 1 ? `${u.title} · Part ${partSeen[p.unit]} of ${partCount[p.unit]}` : u.title });
      }
      const segs = [];
      for (let i = nextSeg; i <= wantEnd && i < segments.length; i++) if ((segments[i].role || 'body') === 'body') segs.push(i);
      if (!segs.length && w.n < weeks) { let j = nextSeg; while (j < segments.length && (segments[j].role || 'body') !== 'body') j++; if (j < segments.length) { segs.push(j); wantEnd = Math.max(wantEnd, j); } }
      if (segs.length) nextSeg = Math.max(nextSeg, segs[segs.length - 1] + 1); else nextSeg = Math.max(nextSeg, wantEnd + 1);
      const titles = parts.map((p) => units[p.unit].title).filter((t, i, arr) => arr.indexOf(t) === i);
      let title = titles.length <= 2 ? titles.join(' · ') : `${titles.slice(0, 2).join(' · ')} … and ${titles.length - 2} more`;
      if (w.kind === 'final') title = 'Review and final examination';
      if (w.kind === 'midterm') title = 'Midterm week · ' + title;
      w.title = title; w.parts = parts; w.segments = segs; w.objectives = parts.flatMap((p) => units[p.unit].objectives).filter((o, i, arr) => arr.indexOf(o) === i).slice(0, 6);
      delete w.rawParts;
    }
    // anything left over (rounding) goes to the last teaching week
    if (nextSeg < segments.length) { const w = weeksOut[Math.max(0, weeks - 2)]; for (let i = nextSeg; i < segments.length; i++) if ((segments[i].role || 'body') === 'body') w.segments.push(i); }

    // assessments
    const examDays = new Set();
    for (const c of concurrent) for (const a of c.assessments) if (a.kind === 'midterm' || a.kind === 'final') examDays.add(a.opensAt.slice(0, 10));
    const assessments = [];
    let qn = 0, pn = 0;
    const wk = (n) => weeksOut[n - 1].start;
    for (const w of weeksOut) {
      if (w.kind !== 'final') {
        qn++;
        assessments.push({ id: L.uid('a'), kind: 'quiz', title: `Quiz ${qn}`, week: w.n, coversWeeks: [w.n], opensAt: at(D.addDays(D.parse(w.start), 4), 8), dueAt: at(D.addDays(D.parse(w.start), 6), 23, 59, 0), closesAt: at(D.addDays(D.parse(w.start), 6), 23, 59, 0), durationMin: 15, lateAllowed: false, paper: null, attempt: null, grade: null });
      }
      if (w.n % 2 === 0 && w.kind !== 'final') {
        pn++;
        const due = at(D.addDays(D.parse(w.start), 6), 23, 59, 0);
        assessments.push({ id: L.uid('a'), kind: 'pset', title: `Problem set ${pn}`, week: w.n, coversWeeks: [w.n - 1, w.n], opensAt: at(w.start, 8), dueAt: due, closesAt: iso(D.addDays(D.parse(due), 3)), durationMin: null, lateAllowed: true, paper: null, attempt: null, grade: null });
      }
    }
    const examDate = (weekStart, prefs) => {
      for (const day of prefs) { const d = D.iso(D.addDays(D.parse(weekStart), day)); if (!examDays.has(d)) { examDays.add(d); return d; } }
      const d = D.iso(D.addDays(D.parse(weekStart), prefs[0])); examDays.add(d); return d;
    };
    let midDate = null, finalDate;
    if (midWeek) {
      midDate = examDate(wk(midWeek), [2, 3, 1]);
      assessments.push({ id: L.uid('a'), kind: 'midterm', title: 'Midterm examination', week: midWeek, coversWeeks: Array.from({ length: midWeek }, (_, i) => i + 1), opensAt: at(midDate, 9), dueAt: at(midDate, 21), closesAt: at(midDate, 21), durationMin: 75, lateAllowed: false, paper: null, attempt: null, grade: null });
    }
    if (weeks >= 8) {
      const due = at(D.addDays(D.parse(wk(weeks - 1)), 4), 23, 59, 0);
      assessments.push({ id: L.uid('a'), kind: 'project', title: 'Term project', week: weeks - 1, coversWeeks: Array.from({ length: weeks - 1 }, (_, i) => i + 1), opensAt: at(wk(3), 8), dueAt: due, closesAt: iso(D.addDays(D.parse(due), 3)), durationMin: null, lateAllowed: true, paper: null, attempt: null, grade: null });
    }
    finalDate = examDate(wk(weeks), [4, 3, 2]);
    assessments.push({ id: L.uid('a'), kind: 'final', title: 'Final examination', week: weeks, coversWeeks: weeksOut.map((w) => w.n), opensAt: at(finalDate, 9), dueAt: at(finalDate, 21), closesAt: at(finalDate, 21), durationMin: 120, lateAllowed: false, paper: null, attempt: null, grade: null });
    assessments.sort(L.by('dueAt'));

    // daily study blocks with bite-sized chunks; reading gets the larger share of each day, practice the rest
    const maxMin = L.clamp(Math.round(minutesPerDay / 3), 10, 25);
    const practiseMin = L.clamp(Math.round(minutesPerDay * 0.3), 10, 30);
    const locateIn = (from, to) => locateWith(sources, from, to);
    const sessions = [];
    let dayIndex = 0;
    let prevTitles = [];
    for (const w of weeksOut) {
      const reading = w.segments.filter((i) => (segments[i].role || 'body') === 'body').flatMap((i) => chunkSegment(text, segments[i], maxMin).map((p) => Object.assign(p, { segment: i })));
      let days = studyDays.map((day) => ({ day, date: D.iso(D.addDays(D.parse(w.start), day)) }));
      if (w.kind === 'final') days = days.filter((d) => d.date < finalDate);
      if (w.kind === 'midterm' && midDate) days = days.filter((d) => d.date !== midDate);
      if (!days.length) continue;
      // spread the week's reading across its days: each day takes its share by count, capped by the day's reading time
      const readBudget = Math.max(maxMin, Math.min(Math.ceil(L.sum(reading.map((r) => r.minutes)) / days.length), Math.round(minutesPerDay * 0.7)));
      let ri = 0;
      days.forEach((d, di) => {
        const chunks = [];
        let acc = 0;
        const share = Math.ceil((reading.length - ri) / (days.length - di));
        while (ri < reading.length && chunks.length < share && (acc === 0 || acc + reading[ri].minutes <= readBudget * 1.25)) {
          const r = reading[ri++];
          const loc = locateIn(r.from, r.to);
          chunks.push({ id: L.uid('k'), kind: 'read', title: shortTitle(r.title), segment: r.segment, from: r.from, to: r.to, pages: loc.pages, source: loc.source ? loc.source.id : null, minutes: r.minutes, done: null });
          acc += r.minutes;
        }
        const clean = (t) => shortTitle(t.replace(/ · part \d+$/, '').replace(/ …$/, ''));
        if (dayIndex > 0 && prevTitles.length) chunks.push({ id: L.uid('k'), kind: 'review', title: `Review · ${clean(prevTitles[0])}`, hint: 'Recall yesterday\'s key ideas without looking, then check them against the pages.', minutes: 10, done: null });
        const focus = chunks.filter((k) => k.kind === 'read').map((k) => k.title);
        if (w.kind === 'final' || w.kind === 'midterm') chunks.push({ id: L.uid('k'), kind: 'practise', title: `Practise · ${w.kind === 'final' ? 'final exam' : 'midterm'}`, hint: `Work problems across ${w.kind === 'final' ? 'the whole course' : 'weeks 1–' + midWeek}; time yourself.`, minutes: practiseMin, done: null });
        else chunks.push({ id: L.uid('k'), kind: 'practise', title: `Practise · ${clean(focus[0] || prevTitles[0] || w.title)}`, hint: 'Rework the examples, then write two problems of your own and solve them.', minutes: practiseMin, done: null });
        const minutes = L.sum(chunks.map((k) => k.minutes));
        sessions.push({ id: L.uid('s'), week: w.n, day: d.day, date: d.date, start: slot.start, minutes, kind: 'Study block', topic: focus.length ? focus[0].replace(/ · part \d+$/, '') : (w.kind === 'final' ? 'Review' : w.title), chunks });
        prevTitles = focus.length ? focus : prevTitles;
        dayIndex++;
      });
      // leftover reading (rare rounding) lands on the week's last day
      while (ri < reading.length) { const r = reading[ri++]; const loc = locateIn(r.from, r.to); const last = sessions[sessions.length - 1]; last.chunks.splice(last.chunks.findIndex((k) => k.kind !== 'read'), 0, { id: L.uid('k'), kind: 'read', title: shortTitle(r.title), segment: r.segment, from: r.from, to: r.to, pages: loc.pages, source: loc.source ? loc.source.id : null, minutes: r.minutes, done: null }); last.minutes += r.minutes; }
    }

    // weights
    let weights = weeks < 5 ? { quiz: 20, pset: 30, final: 45, participation: 5 }
      : weeks < 8 ? { quiz: 15, pset: 25, midterm: 20, final: 35, participation: 5 }
        : { quiz: 10, pset: 20, midterm: 20, project: 15, final: 30, participation: 5 };
    for (const k of Object.keys(weights)) if (k !== 'participation' && !assessments.some((a) => a.kind === k)) { weights.final += weights[k]; delete weights[k]; }
    const policy = { weights, late: { perDayPct: 10, maxDays: 3 }, scale: 'standard', withdrawBefore: D.iso(D.addDays(start, Math.floor(weeks * 7 * 0.6))) };

    // identity
    const levelNo = analysis.level === 'advanced' ? 3 : analysis.level === 'intermediate' ? 2 : 1;
    const seq = 1 + L.S.courses.filter((c) => c.subjectCode === analysis.subjectCode).length;
    const code = `${analysis.subjectCode} ${levelNo}${String(seq).padStart(2, '0')}`;
    const colorUse = COLORS.map((h) => L.S.courses.filter((c) => c.color === h).length);
    const color = COLORS[colorUse.indexOf(Math.min(...colorUse))]; // least used; ties go to the first free, so course 1 is cyan, 2 amber…

    return {
      code, title: analysis.title, subject: analysis.subject, subjectCode: analysis.subjectCode, level: analysis.level, difficulty: analysis.difficulty,
      description: analysis.description, prerequisites: analysis.prerequisites || [], credits, color,
      material: { sources: sources.map((s) => ({ id: s.id, name: s.name, kind: s.kind, words: s.words, chars: s.chars, pages: s.pages, url: s.url, offset: s.offset || 0, pageStarts: s.pageStarts, hasFile: !!s.file })), words, chars: text.length, segments: segments.map((g) => ({ i: g.i, title: g.title, start: g.start, end: g.end, words: g.words, role: g.role || 'body' })) },
      analysis: { source: analysis.source || 'offline', model: analysis.model, note: analysis.note, units },
      term, plan: { pace: paceKey, paceLabel: pace.label, hoursPerWeek, totalHours: Math.round(totalHours * 10) / 10, slot, studyDays, minutesPerDay, sessionsPerWeek: studyDays.length, reduced },
      weeks: weeksOut, sessions, assessments, policy, notes: {},
      sourcesText: text, sourceFiles: sources.filter((s) => s.file).map((s) => ({ id: s.id, file: s.file })),
    };
  }
  function locateWith(sources, from, to) {
    let src = sources[0];
    for (const s of sources) if ((s.offset || 0) <= from) src = s;
    if (!src || !src.pageStarts) return { source: src, pages: null };
    const pageOf = (off) => { const rel = off - (src.offset || 0); let p = 0; for (let i = 0; i < src.pageStarts.length; i++) if (src.pageStarts[i] <= rel) p = i; return p + 1; };
    return { source: src, pages: [pageOf(from), pageOf(Math.max(from, to - 1))] };
  }

  // The three pacings. Each is a full prospectus or { unavailable } — a throw only when all three are impossible.
  function plans(input) {
    const out = {};
    const errs = [];
    for (const key of Object.keys(PACES)) {
      try { out[key] = buildPlan(Object.assign({}, input, { paceKey: key })); }
      catch (e) { out[key] = { pace: key, paceLabel: PACES[key].label, unavailable: e.message, code: e.code }; errs.push(e); }
    }
    if (!Object.keys(PACES).some((k) => !out[k].unavailable)) throw errs[0] || new RegistrarError('budget', 'No pacing fits your study budget.');
    return out;
  }
  const plan = (input) => plans(input).standard; // kept for tools that want one prospectus

  async function enrol(prospectus, contract) {
    if (prospectus.unavailable) throw new Error(prospectus.unavailable);
    if (!contract || !contract.signature || !contract.name) throw new Error('Enrolment needs a signed registration contract.');
    const no = contract.no || L.papers.contractNo();
    const textHash = await L.sha256(L.papers.contractText(prospectus, L.S.student, no));
    const c = Object.assign({}, prospectus, { id: L.uid('c'), createdAt: new Date(L.now()).toISOString(), state: 'enrolled', contract: { no, signedAt: new Date(L.now()).toISOString(), name: contract.name, signature: contract.signature, textHash } });
    const text = c.sourcesText; delete c.sourcesText;
    const files = c.sourceFiles || []; delete c.sourceFiles;
    // the record comes first; a storage failure for the material must never lose the enrolment
    L.S.courses.push(c);
    L.saveNow();
    const problems = [];
    try { await L.db.putMaterial(c.id, text); } catch (e) { console.error(e); c.material.textStored = false; problems.push('the text copy'); }
    for (const f of files) {
      try { await L.db.putFile(f.id, f.file); }
      catch (e) { console.error(e); const src = c.material.sources.find((x) => x.id === f.id); if (src) src.hasFile = false; problems.push(`the original of ${f.file.name || 'a file'}`); }
    }
    await L.ledger.append('contract_signed', { courseId: c.id, no, textHash, name: contract.name });
    await L.ledger.append('enrolled', { courseId: c.id, code: c.code, title: c.title, weeks: c.term.weeks, start: c.term.start, end: c.term.end, hoursPerWeek: c.plan.hoursPerWeek, pace: c.plan.pace });
    L.saveNow();
    if (problems.length && L.ui) L.ui.toast(`Enrolled, but this device could not store ${problems.join(' and ')}. Reading will use what is available.`, 'warn', 8000);
    return c;
  }

  async function withdraw(courseId) {
    const c = course(courseId);
    if (!c || c.state !== 'enrolled') throw new Error('This course is not active.');
    const st = courseState(c);
    if (st === 'completed') throw new Error(`${c.code} has ended. The grade stands.`);
    if (D.iso(L.today()) >= c.policy.withdrawBefore) throw new Error(`The withdrawal deadline for ${c.code} was ${L.fmt.date(D.addDays(D.parse(c.policy.withdrawBefore), -1))}. The grade will stand.`);
    c.state = 'withdrawn';
    c.withdrawnAt = new Date(L.now()).toISOString();
    c.final = { pct: null, letter: 'W', at: c.withdrawnAt };
    await L.ledger.append('withdrawn', { courseId: c.id, code: c.code, week: currentWeek(c) });
    L.save();
  }

  // ---------- calendar queries ----------
  function sessionsOn(date) {
    const d = D.iso(date);
    const out = [];
    for (const c of L.S.courses) if (c.state === 'enrolled') for (const s of c.sessions) if (s.date === d) out.push({ course: c, session: s });
    return out.sort((a, b) => a.session.start - b.session.start);
  }
  function deadlines({ from, to }) {
    const a = ms(from), z = ms(to);
    const out = [];
    for (const c of L.S.courses) if (c.state === 'enrolled') for (const x of c.assessments) { const t = ms(x.dueAt); if (t >= a && t <= z) out.push({ course: c, assessment: x, at: t }); }
    return out.sort(L.by('at'));
  }
  function nextDeadline() {
    const now = L.now();
    let best = null;
    for (const c of L.S.courses) {
      if (c.state !== 'enrolled' || courseState(c) === 'completed') continue;
      for (const a of c.assessments) {
        const st = assessmentState(c, a);
        if (!['upcoming', 'open', 'late', 'in_progress'].includes(st)) continue;
        const t = st === 'late' ? ms(a.closesAt) : st === 'in_progress' ? deadline(c, a) : ms(a.dueAt);
        if (t >= now && (!best || t < best.at)) best = { course: c, assessment: a, at: t };
      }
    }
    return best;
  }
  function load(weekStart) {
    const d = weekStart ? D.iso(weekStart) : D.iso(D.addDays(L.today(), -D.dow(L.today())));
    const end = D.iso(D.addDays(D.parse(d), 6));
    const hours = L.sum(L.S.courses.filter((c) => c.state === 'enrolled' && c.term.start <= end && c.term.end >= d).map((c) => c.plan.hoursPerWeek));
    return { hours, budget: Number(L.S.settings.weeklyHours) || 12 };
  }

  // ---------- grades ----------
  const letter = (pct) => SCALE.find(([min]) => pct >= min)[1];
  const points = (lt) => (SCALE.find(([, l]) => l === lt) || [0, 'F', 0])[2];
  function standing(c, { finalise = false } = {}) {
    const today = D.iso(L.today());
    const cats = [];
    let contribSum = 0, weightUsed = 0, gradedAvgSum = 0, gradedN = 0;
    for (const [kind, weight] of Object.entries(c.policy.weights)) {
      if (kind === 'participation' || !weight) continue;
      const items = c.assessments.filter((a) => a.kind === kind);
      const done = items.filter((a) => a.grade);
      const avg = done.length ? L.sum(done.map((a) => a.grade.pct)) / (finalise ? items.length : done.length) : (finalise ? 0 : null);
      const contrib = avg == null ? null : (weight * avg) / 100;
      cats.push({ kind, weight, done: done.length, total: items.length, avg, contrib });
      if (contrib != null) { contribSum += contrib; weightUsed += weight; }
      done.forEach((a) => { gradedAvgSum += a.grade.pct; gradedN++; });
    }
    // participation = chunks done on their day (full credit) or later (half), over chunks due so far
    // a day's chunks fall due at the end of that day; today's count only once they are done
    const dueChunks = c.sessions.filter((s) => finalise || s.date <= today).flatMap((s) => s.chunks.filter((ch) => finalise || s.date < today || ch.done).map((ch) => ({ s, ch })));
    const credit = L.sum(dueChunks.map(({ s, ch }) => (!ch.done ? 0 : D.iso(ch.done) <= s.date ? 1 : 0.5)));
    const done = dueChunks.filter(({ ch }) => ch.done).length;
    const pw = c.policy.weights.participation || 0;
    const participation = { done, due: dueChunks.length, credit, weight: pw, avg: dueChunks.length ? (credit / dueChunks.length) * 100 : null };
    if (pw && dueChunks.length) {
      cats.push({ kind: 'participation', weight: pw, done, total: dueChunks.length, avg: participation.avg, contrib: (pw * participation.avg) / 100 });
      contribSum += (pw * participation.avg) / 100; weightUsed += pw;
    }
    const current = weightUsed ? (contribSum / weightUsed) * 100 : null;
    // projection: ungraded items assumed at the running average of graded work
    let projected = null;
    if (gradedN) {
      const runAvg = gradedAvgSum / gradedN;
      let sum = 0;
      for (const [kind, weight] of Object.entries(c.policy.weights)) {
        if (kind === 'participation') { sum += weight * (participation.avg == null ? runAvg : participation.avg) / 100; continue; }
        const items = c.assessments.filter((a) => a.kind === kind);
        if (!items.length) continue;
        const avg = L.sum(items.map((a) => (a.grade ? a.grade.pct : runAvg))) / items.length;
        sum += (weight * avg) / 100;
      }
      projected = sum;
    }
    return { current, projected, letter: current == null ? null : letter(current), categories: cats, participation };
  }
  function gpa() {
    const done = L.S.courses.filter((c) => c.final && c.final.letter !== 'W');
    const credits = L.sum(done.map((c) => c.credits));
    const g = credits ? L.sum(done.map((c) => points(c.final.letter) * c.credits)) / credits : null;
    return { gpa: g == null ? null : Math.round(g * 100) / 100, credits, completed: done.length };
  }

  // ---------- assessment lifecycle ----------
  function assessmentState(c, a) {
    if (a.grade) return a.grade.missed ? 'missed' : 'graded';
    if (a.attempt && a.attempt.startedAt && !a.attempt.submittedAt) return 'in_progress';

  L.logo = (big = false) => `<span class="logo${big ? ' is-big' : ''}"><img class="mark-img" src="${L.ICON}" alt="" width="${big ? 72 : 30}" height="${big ? 72 : 30}"><span>Lyceum</span></span>`;
  // one tile per calendar day of the term: full / part / none / future / off (no study block that day)
  L.tileState = (c, iso) => {
    const s = c.sessions.find((x) => x.date === iso);
    const today = L.date.iso(L.today());
    if (!s) return 'off';
    if (iso > today) return 'future';
    const done = s.chunks.filter((k) => k.done).length;
    return done === s.chunks.length && s.chunks.length ? 'full' : done ? 'part' : 'none';
  };
  L.tilesGrid = (c) => {
    const today = L.date.iso(L.today());
    const start = L.date.parse(c.term.start);
    const cols = Math.max(12, c.term.weeks); // a fixed horizon keeps short courses from looking like three fat columns
    const end = L.date.addDays(start, cols * 7 - 1);
    const out = [];
    for (let d = start; d <= end; d = L.date.addDays(d, 1)) { const iso = L.date.iso(d); const v = iso > c.term.end ? 'off' : L.tileState(c, iso); out.push(`<i data-v="${v}"${iso === today ? ' class="is-today"' : ''} title="${iso}"></i>`); }
    return `<div class="tiles-wrap"><div class="tiles" style="--ch:${L.cc(c)};--cols:${cols}">${out.join('')}</div></div>`;
  };
  L.tilesRow = (c, days = 14) => {
    const today = L.today();
    const out = [];
    for (let i = days - 1; i >= 0; i--) { const iso = L.date.iso(L.date.addDays(today, -i)); const v = iso < c.term.start || iso > c.term.end ? 'off' : L.tileState(c, iso); out.push(`<i data-v="${v}"${i === 0 ? ' class="is-today"' : ''}></i>`); }
    return `<div class="tiles-row" style="--ch:${L.cc(c)}">${out.join('')}</div>`;
  };

  // ---------- rail ----------
  function renderRail() {
    const rail = document.getElementById('rail');
    if (!rail) return;
    const s = L.S.student;
    if (!s) { rail.innerHTML = ''; rail.hidden = true; return; }
    rail.hidden = false;
    const { name } = L.route();
    const cur = (n) => (n === name || (n === 'courses' && ['course', 'day', 'week', 'assess', 'contract', 'certificate'].includes(name)) || (n === 'settings' && ['enrol', 'record'].includes(name)) ? ' aria-current="page"' : '');
    const openNow = L.S.courses.filter((c) => c.state === 'enrolled').flatMap((c) => c.assessments.filter((a) => ['open', 'late', 'in_progress'].includes(R().assessmentState(c, a)))).length;
    const active = R().courses('active').length;
    const nd = R().nextDeadline();
    rail.innerHTML = `
      <div class="rail-brand">${L.logo()}</div>
      <nav class="rail-nav">
        <a href="#/today"${cur('today')}>${I.today}<span>Today</span>${openNow ? `<span class="badge">${openNow}</span>` : ''}</a>
        <a href="#/courses"${cur('courses')}>${I.courses}<span>Courses</span>${active ? `<span class="badge is-quiet">${active}</span>` : ''}</a>
        <a href="#/calendar"${cur('calendar')}>${I.calendar}<span>Calendar</span></a>
        <a href="#/stats"${cur('stats')}>${I.stats}<span>Stats</span></a>
        <a href="#/settings"${cur('settings')}>${I.settings}<span>More</span></a>
      </nav>
      <div class="rail-foot">
        <div class="rail-clock"><div class="big" data-clock>${L.fmt.time(L.now())}</div><div class="sub" data-clock-date>${L.fmt.date(L.now())} ${new Date(L.now()).getFullYear()}${L.S.clock.offsetMs ? ' · clock offset' : ''}</div></div>
        ${nd ? `<div class="rail-next"><span class="label">Next deadline</span><div>${esc(nd.course.code)} · ${esc(nd.assessment.title)}</div><div class="when" data-countdown="${nd.at}">${L.fmt.rel(nd.at - L.now())}</div></div>` : ''}
        <div class="rail-student"><div class="seal">${esc(s.name.trim().charAt(0).toUpperCase())}</div><div><div class="name">${esc(s.name)}</div><div class="id">${esc(s.id)}</div></div></div>
      </div>`;
  }

  // tile grids get an explicit pixel size from their container so they never spill out of a card (Safari
  // sizes aspect-ratio grid items unreliably); long terms scroll to the most recent weeks
  L.sizeTiles = (root = document) => {
    root.querySelectorAll('.tiles').forEach((g) => {
      const wrap = g.parentElement; const cols = Number(g.style.getPropertyValue('--cols')) || 12;
      const w = wrap.clientWidth || 300;
      const gap = w / cols > 18 ? 4 : 3;
      const tile = L.clamp(Math.floor((w - (cols - 1) * gap) / cols), 7, 22);
      g.style.setProperty('--tile', `${tile}px`); g.style.setProperty('--gap', `${gap}px`);
      wrap.scrollLeft = wrap.scrollWidth;
    });
    root.querySelectorAll('.tiles-row').forEach((g) => {
      const n = g.children.length || 14; const w = g.parentElement.clientWidth || 300;
      const gap = 3; g.style.setProperty('--gap', `${gap}px`);
      g.style.setProperty('--tile', `${L.clamp(Math.floor((w - (n - 1) * gap) / n), 6, 14)}px`);
    });
  };
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => L.sizeTiles(), 120); });

  // ---------- render ----------
  let current = null;
  L.render = () => {
    const main = document.getElementById('main');
    if (!main) return;
    const route = L.route();
    if (!L.S.student && route.name !== 'welcome') { L.go('/welcome'); return; }
    if (L.S.student && route.name === 'welcome') { L.go('/today'); return; }
    const view = L.views[route.name] || L.views.today;
    if (current && current.unmount) { try { current.unmount(); } catch (e) { console.error(e); } }
    current = view;
    document.title = (view.title ? (typeof view.title === 'function' ? view.title(route.params) : view.title) + ' · ' : '') + 'Lyceum';
    try { renderRail(); } catch (e) { console.error(e); }
    const busy = main.querySelector('.busy'); // keep an in-flight progress strip across re-renders
    try { main.innerHTML = view.render(route.params, route.query); }
    catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="empty"><h2>This page could not be drawn.</h2><p class="mono small">${esc(e.message)}</p><p><a class="btn mt-2" href="#/today">Back to Today</a></p></div></div>`; return; }
    if (busy) main.prepend(busy);
    L.sizeTiles(main);
    if (view.mount) { try { const r = view.mount(main, route.params, route.query); if (r && r.catch) r.catch((e) => { console.error(e); L.ui.toast(e.message || 'Something went wrong.', 'bad'); }); } catch (e) { console.error(e); } }
    L.S.ui.lastRoute = location.hash;
    window.scrollTo(0, 0);
  };

  L.boot = () => {
    document.addEventListener('click', async (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el || el.closest('#modals')) return;
      const fn = L.actions[el.dataset.act];
      if (!fn) return;
      ev.preventDefault();
      try { await fn(el, ev); } catch (e) { console.error(e); L.ui.toast(e.message || 'Something went wrong.', 'bad'); }
    });
    const onInput = (ev) => { const el = ev.target.closest('[data-in]'); if (!el) return; const fn = L.inputs[el.dataset.in]; if (fn) { try { fn(el, ev); } catch (e) { console.error(e); } } };
    document.addEventListener('input', onInput);
    document.addEventListener('change', onInput);
    window.addEventListener('hashchange', L.render);
    L.on('tick', () => {
      document.querySelectorAll('[data-clock]').forEach((n) => { n.textContent = L.fmt.time(L.now()); });
      document.querySelectorAll('[data-countdown]').forEach((n) => { n.textContent = L.fmt.rel(Number(n.dataset.countdown) - L.now()); });
      L.emit('tick-views');
    });
    let tick = 0;
    L.on('tick', () => { if (++tick % 30 === 0 && !document.querySelector('.exam')) renderRail(); });
    R().sweep().then(() => L.render()).catch((e) => { console.error(e); L.render(); });
  };

  // ---------- welcome ----------
  L.views.welcome = {
    title: 'Start',
    render() {
      return `<div class="welcome">
        ${L.logo(true)}
        <h1>Any material becomes a real course, with a real calendar.</h1>

        <div class="card"><div class="card-head"><h3>Breakdown</h3></div><div class="card-body"><div class="breakdown-wrap"><table class="table"><thead><tr><th>Category</th><th class="num">Weight</th><th class="num">Graded</th><th class="num">Average</th><th class="num">Contributes</th></tr></thead><tbody>
          ${Object.entries(c.policy.weights).map(([k, w]) => { const cat = s.categories.find((x) => x.kind === k); const items = c.assessments.filter((a) => a.kind === k).length; return `<tr><td>${k === 'participation' ? 'Participation (attendance)' : esc(KT(k) + (items > 1 ? 's' : ''))}</td><td class="num">${w}%</td><td class="num">${k === 'participation' ? `${s.participation.attended}/${s.participation.held}` : `${cat ? cat.done : 0}/${items}`}</td><td class="num">${cat && cat.avg != null ? L.fmt.pct(cat.avg) : '—'}</td><td class="num">${cat && cat.contrib != null ? cat.contrib.toFixed(1) + ' pts' : '—'}</td></tr>`; }).join('')}

        <div class="card"><div class="card-head"><h3>Letter scale</h3><span class="small muted">standard 4.0</span></div><div class="card-body"><div class="weights">${scale.map(([min, l, p]) => `<div class="small"><span class="letter" style="font-size:16px">${l}</span> <span class="muted">≥ ${min}%</span> <span class="mono muted">${p.toFixed(1)}</span></div>`).join('')}</div></div></div>

  function materials(c) {

      <p class="small muted mt-2">Analysed by ${c.analysis.source === 'llm' ? `faculty (${esc(c.analysis.model || 'model')})` : 'the offline registrar'}.${c.analysis.note ? ' ' + esc(c.analysis.note) : ''}</p>
      ${(() => { const skipped = c.material.segments.filter((g) => g.role && g.role !== 'body'); if (!skipped.length) return ''; return `<p class="small muted mt-1"><b>Not scheduled</b> (front and back matter): ${skipped.map((g) => { const loc = R().locate(c, g.start, g.end); return esc(g.title) + (loc.pages ? ` (pp. ${loc.pages[0]}–${loc.pages[1]})` : ''); }).join(', ')}.</p>`; })()}</div></div>
      <div class="card"><div class="card-head"><h3>Units</h3><span class="small muted">${c.analysis.units.length}</span></div><div class="card-body stack gap-2">${c.analysis.units.map((u, i) => `<div><div style="font-weight:500">${i + 1}. ${esc(u.title)}</div><div class="small muted">${u.topics.map(esc).join(' · ')}</div></div>`).join('')}</div></div></div>
      <div class="section"><div class="section-head"><h2>About this course</h2></div><p style="max-width:70ch">${esc(c.description)}</p>${c.prerequisites.length ? `<p class="small muted">Assumed: ${c.prerequisites.map(esc).join('; ')}.</p>` : ''}</div>`;
  }
  function planTab(c) {
    const today = L.date.iso(L.today());
    const byWeek = L.groupBy(c.sessions, 'week');
    return `<div class="plan">${c.weeks.map((w) => `<div class="plan-week"><div class="section-head"><h2>Week ${w.n} · ${esc(w.title)}</h2><span class="small muted mono">${L.fmt.date(w.start)} – ${L.fmt.date(L.date.addDays(L.date.parse(w.start), 6))}</span></div>
      <div class="plan-days">${(byWeek[w.n] || []).map((s) => `<div class="plan-day${s.date === today ? ' is-today' : s.date < today ? ' is-past' : ''}"><div class="plan-date"><b>${L.date.dayName(s.date).slice(0, 3)}</b> ${L.fmt.date(s.date).slice(4)}</div>${L.studyBlock(c, s)}</div>`).join('') || '<p class="muted small">No study blocks this week.</p>'}</div></div>`).join('')}</div>`;
  }
  L.views.course = {
    title: (p) => R().course(p.id)?.code || 'Course',
    render(p, q) {
      const c = R().course(p.id); if (!c) return notFound('Course');
      const tab = ['plan', 'syllabus', 'assessments', 'grades', 'materials'].includes(q.tab) ? q.tab : 'plan';
      const body = tab === 'plan' ? planTab(c) : tab === 'syllabus' ? syllabus(c) : tab === 'assessments' ? assessments(c) : tab === 'grades' ? grades(c) : materials(c);
      return `<div class="page">${header(c)}${tabs(c, tab)}${body}</div>`;
    },
  };

  // ---------- day view: the study block, and the original pages for its reading chunks ----------
  L.views.week = { title: 'Week', render(p) { const c = R().course(p.id); if (!c) return notFound('Course'); const s = c.sessions.find((x) => x.week === p.n) || c.sessions[0]; setTimeout(() => L.go(s ? `/course/${c.id}/day/${s.date}` : `/course/${c.id}`), 0); return '<div class="page"></div>'; } };
  let pageRenderToken = 0;
  L.views.day = {
    title: (p) => R().course(p.id)?.code || 'Study',
    render(p, q) {
      const c = R().course(p.id); if (!c) return notFound('Course');
      const s = c.sessions.find((x) => x.date === p.date); if (!s) return notFound('Study block');
      const idx = c.sessions.indexOf(s);
      const prev = c.sessions[idx - 1], next = c.sessions[idx + 1];
      const reads = s.chunks.filter((k) => k.kind === 'read');
      const active = reads.find((k) => k.id === q.chunk) || reads[0];
      const w = R().week(c, s.week);
      const notes = c.notes && c.notes[s.week];
      const mode = q.view === 'text' ? 'text' : 'pages';
      const src = active && c.material.sources.find((x) => x.id === active.source);
      const canPages = !!(src && src.hasFile);
      return `<div class="page is-wide"><div class="page-head" style="--ch:${L.cc(c)}"><div><span class="eyebrow"><a href="#/course/${c.id}" class="code">${esc(c.code)}</a> · week ${s.week} · ${L.fmt.dateLong(s.date)}</span><h1 class="display">${esc(s.topic)}</h1><p class="lede">${L.fmt.dur(s.minutes)} · ${s.chunks.length} chunks</p></div>
        <div class="actions">${prev ? `<a class="btn btn-quiet" href="#/course/${c.id}/day/${prev.date}">← ${L.fmt.date(prev.date)}</a>` : ''}${next ? `<a class="btn btn-quiet" href="#/course/${c.id}/day/${next.date}">${L.fmt.date(next.date)} →</a>` : ''}</div></div>
        <div class="reading-layout">
          <div>
            ${active ? `<div class="reading-src"><span>${esc(active.title)}${active.pages ? ` · ${active.pages[0] === active.pages[1] ? `page ${active.pages[0]}` : `pages ${active.pages[0]}–${active.pages[1]}`}` : ''}${src ? ` · ${esc(src.name)}` : ''}</span>${canPages ? `<span class="switch"><a class="${mode === 'pages' ? 'is-on' : ''}" href="#/course/${c.id}/day/${s.date}?chunk=${active.id}">Pages</a><a class="${mode === 'text' ? 'is-on' : ''}" href="#/course/${c.id}/day/${s.date}?chunk=${active.id}&view=text">Text</a></span>` : ''}</div>
              <div id="reading-body" class="${canPages && mode === 'pages' ? 'pages' : 'reading'}"><p class="muted" style="font-family:var(--font-body);font-size:14px">Loading…</p></div>` : `<div class="panel">No reading today — this block is review and practice. ${w && w.segments.length === 0 ? 'Use the plan tab to reopen earlier days’ pages.' : ''}</div>`}
            ${notes ? `<div class="section"><div class="section-head"><h2>Lecture notes · week ${s.week}</h2><span class="small muted">${notes.source === 'llm' ? esc(notes.model || '') : 'offline'}</span></div><div class="notes" id="notes-body"></div></div>` : ''}
          </div>
          <aside class="reading-side">
            ${L.studyBlock(c, s, { hints: true })}
            ${w && w.objectives.length ? `<div class="card"><div class="card-head"><h3>This week's objectives</h3></div><div class="card-body"><ol style="margin:0;padding-left:18px" class="small">${w.objectives.map((o) => `<li>${esc(o)}</li>`).join('')}</ol></div></div>` : ''}
            <div class="card"><div class="card-body"><button class="btn w-full" data-act="notes" data-course="${c.id}" data-week="${s.week}">${notes ? 'Regenerate lecture notes' : 'Lecture notes for this week'}</button><p class="small muted mt-1">${L.faculty.available() ? 'Written by faculty from this week’s material.' : 'Compiled offline. Add a faculty key in Settings for written notes.'}</p></div></div>
          </aside></div></div>`;
    },
    async mount(root, p, q) {
      const c = R().course(p.id); const s = c && c.sessions.find((x) => x.date === p.date); if (!s) return;
      const reads = s.chunks.filter((k) => k.kind === 'read');
      const active = reads.find((k) => k.id === q.chunk) || reads[0];
      const body = root.querySelector('#reading-body');
      const notes = c.notes && c.notes[s.week];
      const nb = root.querySelector('#notes-body');
      if (notes && nb) nb.innerHTML = window.marked && window.DOMPurify ? window.DOMPurify.sanitize(window.marked.parse(notes.markdown)) : `<pre style="white-space:pre-wrap">${esc(notes.markdown)}</pre>`;
      if (!active || !body) return;
      const token = ++pageRenderToken;
      const src = c.material.sources.find((x) => x.id === active.source);
      const wantPages = src && src.hasFile && q.view !== 'text';
      const file = wantPages ? await L.db.getFile(src.id) : null;
      if (token !== pageRenderToken) return;
      if (file && file.kind === 'pdf' && active.pages && window.pdfjsLib) {
        try { await renderPdfPages(body, file.bytes, active.pages, token); return; }
        catch (e) { console.warn('page render failed, falling back to text', e); }
      } else if (file && file.kind === 'html') {
        body.className = 'reading html-page';
        body.innerHTML = window.DOMPurify ? window.DOMPurify.sanitize(file.html, { FORBID_TAGS: ['style', 'script', 'iframe', 'form'] }) : esc(file.html);
        return;
      }
      // extracted text for this chunk
      const text = (await L.db.getMaterial(c.id)) || '';
      if (token !== pageRenderToken) return;
      body.className = 'reading';
      const raw = text.slice(active.from, active.to);
      const paras = raw.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean);
      body.innerHTML = paras.map((x) => (/^#{1,6}\s/.test(x) ? `<h2>${esc(x.replace(/^#{1,6}\s*/, ''))}</h2>` : `<p>${esc(x).replace(/\n/g, '<br>')}</p>`)).join('') || '<p class="muted">The material for this chunk is not on this device.</p>';
    },
    unmount() { pageRenderToken++; },
  };
  async function renderPdfPages(body, bytes, [from, to], token) {
    const pdf = await window.pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    if (token !== pageRenderToken) return;
    body.className = 'pages';
    body.innerHTML = '';
    const width = Math.min(body.clientWidth || 720, 900);
    for (let n = from; n <= Math.min(to, pdf.numPages); n++) {
      const page = await pdf.getPage(n);
      if (token !== pageRenderToken) return;
      const base = page.getViewport({ scale: 1 });
      const scale = width / base.width;
      const dpr = window.devicePixelRatio || 1;
      const vp = page.getViewport({ scale: scale * dpr });
      const wrap = document.createElement('figure'); wrap.className = 'pdf-page';
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height; canvas.style.width = `${vp.width / dpr}px`; canvas.style.height = `${vp.height / dpr}px`;
      const cap = document.createElement('figcaption'); cap.className = 'mono small muted'; cap.textContent = `Page ${n} of ${pdf.numPages}`;
      wrap.append(canvas, cap); body.appendChild(wrap);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
  }
  // ---------- papers ----------
  L.views.contract = {
    title: 'Contract',
    render(p) {

        <div class="sheet-viewport">${L.papers.contractSheet(c, L.S.student, { no: c.contract.no, signedAt: c.contract.signedAt, signature: c.contract.signature, name: c.contract.name })}</div>

      const cert = c.certificate;
      return `<div class="page"><div class="page-head"><div><span class="eyebrow"><a href="#/course/${c.id}" class="code" style="--ch:${L.cc(c)}">${esc(c.code)}</a></span><h1 class="display">Certificate of Completion</h1><p class="lede">${esc(cert.no)} · issued ${L.fmt.date(cert.issuedAt)} · verification ${esc(cert.code)}</p></div><div class="actions"><button class="btn btn-primary" data-act="share-certificate" data-course="${c.id}">Share image</button><button class="btn" data-act="print">Print / Save PDF</button></div></div>
        <div class="sheet-viewport is-landscape"><div class="sheet certificate" id="sheet">${L.papers.certificateSvg(c)}</div></div>
        <p class="small muted mt-2">Verify on the device that issued it: More → Grades → Verify record. Hash ${esc(cert.hash.slice(0, 16))}…</p></div>`;
    },
  };
  L.actions['share-certificate'] = async (el) => {
    const c = R().course(el.dataset.course); if (!c || !c.certificate) return;

    const file = new File([blob], `${c.certificate.no}.png`, { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {

    }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    L.ui.toast('Certificate image saved.', 'good');

  L.actions.print = () => window.print();

  L.actions.notes = async (el) => {

    el.disabled = true; el.textContent = 'Writing notes…';
    const busy = L.ui.busy(`Week ${w.n}: gathering the material…`);
    try {

      c.notes = c.notes || {}; c.notes[w.n] = { markdown: r.markdown, source: r.source, model: r.model, at: new Date(L.now()).toISOString() };

  // ---------- assessment ----------
  const stateLine = { upcoming: 'Locked until it opens', open: 'Open', late: 'Late window', in_progress: 'In progress', graded: 'Graded', missed: 'Missed' };
  function before(c, a, st) {
    const now = L.now();
    const opensIn = L.date.parse(a.opensAt) - now;
    const canBegin = st === 'open' || st === 'late';
    const btn = st === 'upcoming' ? `Opens <span data-countdown="${L.date.parse(a.opensAt).getTime()}">${L.fmt.rel(opensIn)}</span>` : st === 'late' ? `Submit late (−${Math.min(c.policy.late.maxDays, Math.ceil((now - L.date.parse(a.dueAt)) / 86400000)) * c.policy.late.perDayPct}%)` : 'Begin';
    const brief = a.kind === 'project' && a.paper?.brief;
    return `<div class="exam">
      <div class="card"><div class="card-body"><dl class="kv"><dt>Kind</dt><dd>${esc(KT(a.kind))}</dd><dt>Covers</dt><dd>${a.coversWeeks.map((n) => `week ${n}`).join(', ')}</dd><dt>Opens</dt><dd class="mono">${L.fmt.dt(a.opensAt)}</dd><dt>Due</dt><dd class="mono">${L.fmt.dt(a.dueAt)}${a.lateAllowed ? ` <span class="muted">· late window until ${L.fmt.dt(a.closesAt)}, −${c.policy.late.perDayPct}%/day</span>` : ' <span class="muted">· no late submissions</span>'}</dd><dt>Length</dt><dd>${a.durationMin ? `${L.fmt.dur(a.durationMin)} from the moment you begin, or until the window closes, whichever is first` : 'Untimed, one submission'}</dd><dt>Weight</dt><dd>${weightShare(c, a).toFixed(1)}% of the course grade</dd><dt>Paper</dt><dd>${a.paper ? `Sealed ${L.fmt.dt(a.paper.generatedAt)} · <span class="hash">${a.paper.seal.slice(0, 12)}</span>` : 'Set at the moment you begin, from the covered material'}</dd></dl></div></div>
      ${brief ? `<div class="section"><div class="section-head"><h2>Brief</h2></div><div class="notes">${window.marked && window.DOMPurify ? window.DOMPurify.sanitize(window.marked.parse(brief)) : `<pre style="white-space:pre-wrap">${esc(brief)}</pre>`}</div></div>` : ''}
      <div class="pledge mt-3"><label class="check"><input type="checkbox" id="pledge" data-in="pledge"${canBegin ? '' : ' disabled'}><span><b>Honour pledge.</b> I will complete this ${a.kind === 'quiz' || a.kind === 'midterm' || a.kind === 'final' ? 'paper' : 'work'} on my own, without notes where the paper is timed, and I understand that I have one attempt and that the timer does not stop if I leave this page.</span></label></div>

    </div>`;
  }
  function examRoom(c, a) {
    const dl = R().deadline(c, a);

    return `<div class="exam">

      ${a.paper.note && a.paper.source !== 'llm' ? `<p class="small muted mb-3">${esc(a.paper.note)}</p>` : ''}
      ${brief ? `<div class="notes mb-3">${window.marked && window.DOMPurify ? window.DOMPurify.sanitize(window.marked.parse(brief)) : `<pre style="white-space:pre-wrap">${esc(brief)}</pre>`}</div>` : ''}
      ${qs.map((q, i) => `<div class="question" id="${q.id}"><div class="qh"><span class="qn">Question ${i + 1} · ${q.type === 'mcq' ? 'multiple choice' : q.type === 'short' ? 'short answer' : q.type} · ${q.points} pt${q.points === 1 ? '' : 's'}</span></div>

        ${q.type === 'mcq' ? `<div class="options">${q.options.map((o, k) => `<label><input type="radio" name="${q.id}" data-in="answer" data-qid="${q.id}" data-course="${c.id}" data-assess="${a.id}" value="${k}"${String(a.attempt.answers[q.id]) === String(k) ? ' checked' : ''}><span class="k">${String.fromCharCode(65 + k)}</span><span>${esc(o)}</span></label>`).join('')}</div>`
          : `<div class="answer"><textarea class="textarea" data-in="answer" data-qid="${q.id}" data-course="${c.id}" data-assess="${a.id}" placeholder="${q.type === 'short' ? 'Two or three sentences.' : q.type === 'problem' ? 'Show your working.' : 'Structure your answer with headings if it helps.'}"${q.type !== 'short' ? ' style="min-height:220px"' : ''}>${esc(a.attempt.answers[q.id] || '')}</textarea></div>`}
      </div>`).join('')}
      <div class="cols mt-4"><button class="btn btn-primary" data-act="submit-paper" data-course="${c.id}" data-assess="${a.id}">Submit paper</button><span class="small muted">One submission. ${a.durationMin ? 'When the timer reaches zero the paper is submitted as it stands.' : `Due ${L.fmt.dt(a.dueAt)}.`}</span></div>
    </div>`;

  function result(c, a) {

      console.error(e);
      W.error = e.message || 'The registrar could not schedule this material.';
    } finally { W.busy = false; L.render(); }
  };
  L.actions['enrol-confirm'] = () => {
    if (!W.prospectus) return;
    W.contractNo = L.papers.contractNo(); W.error = null; W.step = 4; L.render();
  };
  L.actions['enrol-prospectus'] = () => { W.step = 3; W.error = null; L.render(); };
  L.actions['sign-enrol'] = async () => {
    const p = W.prospectus; if (!p) return;
    const nameEl = document.getElementById('contract-name');
    const typed = (nameEl ? nameEl.value : '').trim();
    const pad = L.papers.pad;
    const norm = (x) => x.trim().toLowerCase().replace(/\s+/g, ' ');
    // validation must not re-render: that would wipe the drawn signature and scroll away from the error
    const fail = (msg) => { let n = document.getElementById('contract-error'); if (!n) { n = document.createElement('div'); n.id = 'contract-error'; n.className = 'notice mt-2'; n.dataset.kind = 'bad'; const btn = document.querySelector('[data-act=sign-enrol]'); btn.closest('.cols').before(n); } n.innerHTML = `<span>${esc(msg)}</span>`; n.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    if (norm(typed) !== norm(L.S.student.name)) { fail(`Type your name exactly as it appears on your record: ${L.S.student.name}.`); if (nameEl) nameEl.focus(); return; }
    if (!pad || pad.points < 20) { fail('Draw your signature in the box.'); return; }
    const signature = pad.dataUrl();
    if (!signature) { fail('Draw your signature in the box.'); return; }
    W.busy = true;
    try {
      const c = await R().enrol(p, { no: W.contractNo, name: typed, signature });
      W.step = 1; W.sources = []; W.hint = ''; W.plans = null; W.prospectus = null; W.log = []; W.sampleLoaded = false; W.error = null;
      L.ui.toast(`Enrolled in ${c.code}. Term begins ${L.fmt.date(c.term.start)}.`, 'good', 5000);
      L.go(`/course/${c.id}`);
    } catch (e) { W.error = e.message; L.render(); }
    finally { W.busy = false; }
  };
})(window.L);

</script>

    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
