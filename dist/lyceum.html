/* ============================================================
   Lyceum — design system, HabitKit direction
   Dark by default. Rounded charcoal cards, one bright colour per
   course, tile grids for daily study, a clean bold sans, no rules.
   ============================================================ */
:root {
  --bg: #0a0a0b;
  --card: #161719;
  --card-2: #212226;
  --card-3: #2a2b30;
  --line: #232428;
  --text: #f2f3f4;
  --text-2: #c8ccd0;
  --muted: #8b9097;
  --accent: #4ade80;
  --accent-ink: #052e16;
  --accent-soft: rgba(74, 222, 128, 0.14);
  --good: #4ade80;
  --warn: #f5b12b;
  --bad: #fb7185;
  --focus: #60a5fa;
  --ch: #22d3ee;
  --k-practise: #f5b12b; --k-review: #a78bfa;
  --a-quiz: #22d3ee; --a-pset: #f5b12b; --a-midterm: #fb7185; --a-final: #a78bfa; --a-project: #60a5fa;
  --r-card: 22px;
  --r-ctl: 14px;
  --r-tile: 3px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tab-h: 64px;
  --rail-w: 232px;
  /* legacy aliases used by older markup */
  --paper: var(--bg); --surface: var(--card); --surface-2: var(--card-2); --ink: var(--text); --ink-2: var(--text-2); --line-2: var(--card-3);
  --font-body: var(--font); --font-display: var(--font); --radius: var(--r-ctl); --radius-sm: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f7; --card: #ffffff; --card-2: #eef0f3; --card-3: #e2e5e9; --line: #e6e8eb; --text: #111316; --text-2: #3a3f45; --muted: #6b7178;
    --accent: #16a34a; --accent-ink: #ffffff; --accent-soft: rgba(22, 163, 74, 0.12); --good: #16a34a; --warn: #b45309; --bad: #e11d48; --focus: #2563eb; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f5f7; --card: #ffffff; --card-2: #eef0f3; --card-3: #e2e5e9; --line: #e6e8eb; --text: #111316; --text-2: #3a3f45; --muted: #6b7178;
  --accent: #16a34a; --accent-ink: #ffffff; --accent-soft: rgba(22, 163, 74, 0.12); --good: #16a34a; --warn: #b45309; --bad: #e11d48; --focus: #2563eb; color-scheme: light;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- type ---------- */
.display { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.serif { font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 13px; } .muted { color: var(--muted); }
.label, .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; text-transform: none; }
.eyebrow { display: block; margin-bottom: 6px; }
.lede { font-size: 15px; color: var(--text-2); max-width: 60ch; margin-top: 6px; }
.nowrap { white-space: nowrap; } .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; } .center { text-align: center; } .w-full { width: 100%; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 20px; } .mt-4 { margin-top: 32px; }
.mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 12px; } .mb-3 { margin-bottom: 20px; } .mb-4 { margin-bottom: 32px; }
.gap-1 { gap: 6px; } .gap-2 { gap: 12px; } .gap-3 { gap: 20px; }

/* ---------- logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo.is-big svg { width: 64px; height: 64px; }

/* ---------- layout: phone-first, tab bar; desktop gets a slim rail ---------- */
@media (max-width: 1023px) { html, body { overflow-x: hidden; } }
.app { min-height: 100dvh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
.page > * { min-width: 0; }
.main { min-width: 0; }
.page { max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; }
.page-head { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.page-head > div:first-child { min-width: 0; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.rail[hidden] { display: none; }
.rail-brand, .rail-foot { display: none; }
.rail-nav { display: flex; height: var(--tab-h); }
.rail-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.rail-nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail-nav a[aria-current="page"] { color: var(--accent); }
.rail-nav .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.rail-nav .badge.is-quiet { background: var(--card-3); color: var(--text-2); }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.cols { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-head h2 { font-size: 13px; font-weight: 600; color: var(--muted); }
.divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.card { background: var(--card); border-radius: var(--r-card); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.card-head h2, .card-head h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 14px 18px 16px; }
.card-body.pt-0 { padding-top: 6px; }
.card.quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--text); min-width: 0; }
.row:first-child { border-top: 0; }
.row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .t span { display: block; font-size: 12.5px; color: var(--muted); }
.row .letter { font-size: 18px; }
.panel { background: var(--card-2); border-radius: var(--r-ctl); padding: 12px 14px; }
.empty { padding: 28px 20px; background: var(--card); border-radius: var(--r-card); }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--text-2); max-width: 52ch; }
.today-grid { display: flex; flex-direction: column; gap: 12px; }
.reading-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
.reading-side { display: flex; flex-direction: column; gap: 12px; }

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); padding-bottom: 0; }
  .rail { position: sticky; top: 0; bottom: auto; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); border-top: 0; border-right: 1px solid var(--line); padding: 22px 14px 18px; }
  .rail-brand { display: block; padding: 0 10px 22px; }
  .rail-nav { flex-direction: column; height: auto; gap: 2px; }
  .rail-nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; border-radius: var(--r-ctl); font-size: 14px; }
  .rail-nav a svg { width: 20px; height: 20px; }
  .rail-nav a[aria-current="page"] { background: var(--card); color: var(--text); }
  .rail-nav .badge { position: static; margin-left: auto; }
  .rail-foot { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 16px; }
  .page { max-width: 680px; padding: 36px 40px 60px; }
  .page-head { flex-direction: row; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .display { font-size: 30px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .page.is-wide { max-width: 980px; }
  .reading-layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .reading-side { position: sticky; top: 24px; }
}
.rail-clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding: 0 12px; }
.rail-clock .big { font-size: 26px; font-weight: 600; line-height: 1; }
.rail-clock .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.rail-next { font-size: 12.5px; color: var(--text-2); padding: 10px 12px; border-radius: var(--r-ctl); background: var(--card); }
.rail-next .label { display: block; margin-bottom: 3px; }
.rail-next .when { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.rail-student { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.rail-student .seal { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.rail-student .name { font-weight: 600; font-size: 13.5px; line-height: 1.2; } .rail-student .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: var(--r-ctl); border: 0; background: var(--card-2); color: var(--text); font-weight: 600; font-size: 14px; line-height: 1.2; cursor: pointer; white-space: nowrap; transition: filter 120ms, transform 60ms; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: transparent; color: var(--text-2); }
.btn-quiet:hover { background: var(--card-2); }
.btn-danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn-icon { width: 40px; min-height: 40px; padding: 0; border-radius: 50%; font-size: 24px; font-weight: 500; line-height: 1; background: var(--card-2); color: var(--text); }
.btn[disabled], .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.input, .textarea, .select { width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: var(--r-ctl); background: var(--card-2); color: var(--text); font-size: 16px; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: 0; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 600; font-size: 13px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.switch { display: inline-flex; background: var(--card-2); border-radius: 10px; padding: 3px; gap: 2px; }
.switch button, .switch a { padding: 7px 12px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
.switch button[aria-pressed="true"], .switch a.is-on { background: var(--card); color: var(--text); }
.drop { border: 1.5px dashed var(--card-3); border-radius: var(--r-card); padding: 22px 16px; text-align: center; color: var(--muted); background: var(--card); }
.drop.is-over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop label.btn { position: relative; margin-top: 10px; }
.progress { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ch, var(--accent)); border-radius: 4px; transition: width 300ms; }
.progress.is-over > i { background: var(--bad); }
.log { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
.log div::before { content: "› "; color: var(--muted); }
.busy { border-radius: var(--r-card); background: var(--card); padding: 12px 16px; margin-bottom: 16px; }
.busy-bar { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.busy-bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: busy 1.2s ease-in-out infinite; }
@keyframes busy { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- data ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table .num, .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .row-muted td { color: var(--muted); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tile { padding: 12px 14px; border-radius: var(--r-ctl); background: var(--card-2); }
.tile-n { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile-l { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; background: var(--card-2); color: var(--text-2); white-space: nowrap; }
.chip::before { content: none; }
.chip[data-state="open"], .chip[data-state="good"], .chip[data-state="running"] { color: var(--good); } .chip[data-state="open"]::before, .chip[data-state="good"]::before, .chip[data-state="running"]::before { background: var(--good); }
.chip[data-state="late"], .chip[data-state="warn"], .chip[data-state="in_progress"] { color: var(--warn); } .chip[data-state="late"]::before, .chip[data-state="warn"]::before, .chip[data-state="in_progress"]::before { background: var(--warn); }
.chip[data-state="missed"], .chip[data-state="bad"] { color: var(--bad); } .chip[data-state="missed"]::before, .chip[data-state="bad"]::before { background: var(--bad); }
.chip[data-state="graded"], .chip[data-state="submitted"], .chip[data-state="completed"] { background: var(--text); color: var(--bg); } .chip[data-state="graded"]::before, .chip[data-state="submitted"]::before, .chip[data-state="completed"]::before { background: var(--bg); }
.chip[data-state="upcoming"], .chip[data-state="neutral"], .chip[data-state="withdrawn"] { color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--ch); flex: none; }
.code { font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; color: var(--ch); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--text-2); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .bar { flex: 1; height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ch, var(--accent)); }
.letter { font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
.icon-sq { width: 42px; height: 42px; border-radius: 13px; background: var(--ch); color: #0b0c0d; display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: 0.02em; flex: none; }
.icon-sq.is-sm { width: 34px; height: 34px; border-radius: 10px; font-size: 12px; }

/* ---------- study tiles (the signature grid) ---------- */
.tiles { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, minmax(0, 1fr)); grid-template-columns: repeat(var(--cols, 12), minmax(0, 1fr)); gap: 3px; width: max(100%, calc(var(--cols, 12) * 13px)); max-width: calc(var(--cols, 12) * 36px); }
.tiles i { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--r-tile); background: var(--card-2); }
.tiles i[data-v="full"] { background: var(--ch); }
.tiles i[data-v="part"] { background: var(--ch); opacity: 0.45; }
.tiles i[data-v="future"] { background: var(--card-2); opacity: 0.55; }
.tiles i[data-v="off"] { background: var(--card-2); opacity: 0.35; }
.tiles i.is-today { box-shadow: 0 0 0 1.5px var(--text); }
.tiles-wrap { max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tiles-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; width: 100%; }
.tiles-row i { display: block; width: 100%; aspect-ratio: 1; max-height: 14px; border-radius: 3px; background: var(--card-2); }
.tiles-row i[data-v="full"] { background: var(--ch); } .tiles-row i[data-v="part"] { background: var(--ch); opacity: 0.45; } .tiles-row i[data-v="future"] { background: var(--card-2); opacity: 0.55; } .tiles-row i[data-v="off"] { background: transparent; }
.tiles-row i.is-today { box-shadow: 0 0 0 1.5px var(--text); }

/* ---------- course cards ---------- */
.course-card { display: flex; flex-direction: column; gap: 14px; background: var(--card); border-radius: var(--r-card); padding: 16px 18px 18px; color: var(--text); }
.course-card:hover { background: var(--card-2); }
.course-card .head { display: flex; align-items: center; gap: 12px; }
.course-card .head .t { min-width: 0; flex: 1; }
.course-card .head .t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.course-card .head .t span { font-size: 12.5px; color: var(--muted); }
.course-card .letter { font-size: 20px; color: var(--text-2); }
.course-lockup { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.course-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--text-2); }
.course-meta b { font-weight: 700; color: var(--text); }
.tabs { display: flex; gap: 2px; margin: 16px 0 16px; overflow-x: auto; scrollbar-width: none; background: var(--card); border-radius: 999px; padding: 4px; }
.tabs a { flex: 1; text-align: center; padding: 8px 10px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--card-2); color: var(--text); }
.syllabus { display: flex; flex-direction: column; gap: 10px; }
.week-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px 12px; padding: 14px 16px; background: var(--card); border-radius: var(--r-card); }
.week-row.is-current { box-shadow: inset 0 0 0 1.5px var(--ch); }
.week-row.is-past { opacity: 0.7; }
.week-row .wk { font-size: 11px; font-weight: 600; color: var(--muted); }
.week-row .wk b { display: block; font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; margin-top: 2px; }
.week-row .dates { grid-column: 2; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.week-row .topic { font-weight: 600; }
.week-row .parts { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.week-row .objectives { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-2); }
.week-row details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 6px; list-style: none; }
.week-row details summary::before { content: "+ "; } .week-row details[open] summary::before { content: "– "; }
.week-row .sessions, .week-row .due { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 4px; }
.week-row .sessions .att { color: var(--good); }
.week-row .due a { color: var(--text); }
.assess-table td.action { text-align: right; white-space: nowrap; }
.weights { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.registrar-note { font-size: 13px; color: var(--muted); padding: 10px 14px; background: var(--card-2); border-radius: var(--r-ctl); }
.registrar-note .label { display: inline; color: var(--text-2); margin-right: 6px; }
.reading { max-width: 68ch; font-size: 17px; line-height: 1.65; }
.reading h2 { font-size: 20px; margin: 28px 0 10px; } .reading h2:first-child { margin-top: 0; }
.reading p { margin-bottom: 14px; }
.reading-src { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.notes { font-size: 15px; line-height: 1.6; }
.notes h1, .notes h2, .notes h3 { margin: 20px 0 8px; } .notes h1 { font-size: 19px; } .notes h2 { font-size: 16px; } .notes h3 { font-size: 15px; }
.notes ul, .notes ol { padding-left: 22px; } .notes code { font-family: var(--font-mono); font-size: 0.9em; background: var(--card-2); padding: 1px 4px; border-radius: 4px; }
.notes pre { background: var(--card-2); padding: 12px; overflow-x: auto; border-radius: var(--r-ctl); }
.notes table { border-collapse: collapse; } .notes td, .notes th { border: 1px solid var(--line); padding: 4px 8px; }
.pages { display: flex; flex-direction: column; gap: 14px; }
.pdf-page { margin: 0; }
.pdf-page canvas { display: block; max-width: 100%; height: auto; background: #fff; border-radius: 8px; }
.pdf-page figcaption { margin-top: 6px; font-size: 12px; color: var(--muted); }
.html-page { font-size: 15px; line-height: 1.6; max-width: 72ch; }
.html-page img { max-width: 100%; height: auto; }
.html-page table { border-collapse: collapse; max-width: 100%; display: block; overflow-x: auto; }
.html-page td, .html-page th { border: 1px solid var(--line); padding: 4px 8px; }

/* ---------- study blocks & chunks ---------- */
.study-block { background: var(--card); border-radius: var(--r-card); padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 12px; }
.study-head { display: flex; align-items: center; gap: 12px; }
.study-head .t { flex: 1; min-width: 0; }
.study-head .t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.study-head .t span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chunks { display: flex; flex-direction: column; }
.chunk { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.chunk:first-child { border-top: 0; }
.chunk-body { flex: 1; min-width: 0; }
.chunk-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); font-weight: 500; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.chunk-hint { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.chunk-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---- sample.js ---- */
(function (L) {
  'use strict';
  // Built-in sample material. Plainly labelled as a sample in the UI; it goes through the
  // same registrar pipeline as anything the student uploads.
  L.SAMPLE = {
    name: 'Introduction to Probability — lecture notes (sample)',
    text: `# Introduction to Probability

These notes cover the first six lectures of a one-term introduction to probability. They assume comfort with algebra and summation notation, and nothing else.

## 1. Sample spaces and events

An experiment is any process whose outcome is uncertain: tossing a coin, drawing a card, measuring tomorrow's temperature. The sample space, written S, is the set of all possible outcomes. For one toss of a coin, S = {H, T}. For two tosses, S = {HH, HT, TH, TT}. For the number of emails you receive tomorrow, S = {0, 1, 2, ...}, which is infinite but countable. For a temperature reading, S is an interval of real numbers and is uncountable.

An event is a subset of the sample space. "At least one head in two tosses" is the event A = {HH, HT, TH}. Because events are sets, the language of sets is the language of events. The union A ∪ B is the event that A or B occurs (or both). The intersection A ∩ B is the event that both occur. The complement A^c is the event that A does not occur. Two events are mutually exclusive, or disjoint, if A ∩ B is empty: they cannot both happen.

De Morgan's laws carry over directly. (A ∪ B)^c = A^c ∩ B^c says that "neither A nor B" is the same as "not A and not B". Drawing a Venn diagram is a reliable way to check any claim about three or fewer events.

## 2. The axioms of probability

A probability is a function P that assigns a number to every event and satisfies three axioms. First, P(A) ≥ 0 for every event A. Second, P(S) = 1: something in the sample space must happen. Third, if A1, A2, ... are pairwise disjoint events, then P(A1 ∪ A2 ∪ ...) = P(A1) + P(A2) + .... This third axiom is called countable additivity and it is the one that does all the work.

Several useful facts follow from the axioms alone. The complement rule: P(A^c) = 1 − P(A). The probability of the empty event is 0. If A is a subset of B then P(A) ≤ P(B). The inclusion–exclusion formula for two events: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The subtraction corrects for the outcomes counted twice, once in A and once in B. For three events the formula adds the three pairwise intersections back in and subtracts the triple intersection.

When the sample space is finite and every outcome is equally likely, probability reduces to counting: P(A) = |A| / |S|. This is the classical definition, and it is why the first weeks of any probability course lean on combinatorics. The number of ways to choose k objects from n without regard to order is the binomial coefficient C(n, k) = n! / (k!(n − k)!). The probability that a five-card poker hand is a flush, for example, is 4 × C(13, 5) / C(52, 5), which is roughly 0.00198.

## 3. Conditional probability and independence

The conditional probability of A given B, written P(A | B), is the probability of A when we know that B has occurred. It is defined, for P(B) > 0, by P(A | B) = P(A ∩ B) / P(B). Conditioning shrinks the sample space to B and rescales so that the probabilities inside B sum to one.

Rearranging the definition gives the multiplication rule: P(A ∩ B) = P(B) P(A | B). Applied repeatedly it gives the chain rule for several events, which is how one computes the probability of drawing three aces in a row without replacement: (4/52)(3/51)(2/50).

Two events are independent if P(A ∩ B) = P(A) P(B), or equivalently P(A | B) = P(A) when P(B) > 0. Independence means that learning B tells you nothing about A. It is a modelling assumption, not something you can read off a Venn diagram, and it is easy to get wrong: disjoint events with positive probability are never independent, because if one occurs the other cannot. A collection of events is mutually independent if the product rule holds for every sub-collection, which is stronger than pairwise independence.

The law of total probability lets us compute an unconditional probability by conditioning on a partition. If B1, ..., Bn are disjoint events whose union is S, then P(A) = Σ P(A | Bi) P(Bi). In words: average the conditional probabilities of A, weighting each by how likely its condition is.

## 4. Bayes' theorem

Bayes' theorem reverses the direction of conditioning. From the multiplication rule written both ways, P(A ∩ B) = P(B | A) P(A) = P(A | B) P(B), so P(A | B) = P(B | A) P(A) / P(B). The denominator is usually expanded with the law of total probability.

The standard example is a diagnostic test. Suppose a disease has prevalence 1% and a test has sensitivity 99% (it detects the disease when present) and specificity 95% (it is negative when the disease is absent). A person tests positive. The probability they have the disease is P(D | +) = (0.99 × 0.01) / (0.99 × 0.01 + 0.05 × 0.99) = 0.0099 / 0.0594, which is about 0.167. Despite an accurate test, five in six positives are false positives, because the disease is rare. This phenomenon is called the base-rate fallacy when people ignore the prevalence.

The terms have names. P(A) is the prior, P(A | B) is the posterior, P(B | A) is the likelihood, and P(B) is the evidence or marginal likelihood. Bayes' theorem says: posterior is proportional to likelihood times prior. This one line is the foundation of Bayesian statistics.

## 5. Random variables and expectation

A random variable is a function from the sample space to the real numbers. It turns outcomes into numbers so that we can do arithmetic with them. The number of heads in three tosses is a random variable X taking values in {0, 1, 2, 3}. A random variable is discrete if it takes countably many values and continuous if it takes values in an interval.

A discrete random variable is described by its probability mass function p(x) = P(X = x), which is non-negative and sums to one over all x. The cumulative distribution function F(x) = P(X ≤ x) is defined for every random variable, discrete or continuous, and is non-decreasing from 0 to 1.

The expectation, or mean, of a discrete random variable is E[X] = Σ x p(x): a weighted average of the values, weighted by their probabilities. Expectation is linear: E[aX + bY] = aE[X] + bE[Y] for any constants a and b, whether or not X and Y are independent. Linearity is the most useful single fact in the course; it lets you compute the expected number of matches, fixed points, or successes by adding indicator variables without ever finding the full distribution.

The variance measures spread: Var(X) = E[(X − μ)²] = E[X²] − μ², where μ = E[X]. Its square root is the standard deviation, which has the same units as X. Variance is not linear: Var(aX) = a² Var(X), and Var(X + Y) = Var(X) + Var(Y) only when X and Y are uncorrelated, which is implied by independence.

## 6. Common discrete distributions

The Bernoulli distribution describes a single trial with success probability p: P(X = 1) = p, P(X = 0) = 1 − p, mean p, variance p(1 − p).

The binomial distribution counts successes in n independent Bernoulli trials with the same p. Its mass function is P(X = k) = C(n, k) p^k (1 − p)^(n − k) for k = 0, ..., n, with mean np and variance np(1 − p). Both moments follow from linearity: a binomial is a sum of n Bernoullis.

The geometric distribution counts the number of trials up to and including the first success: P(X = k) = (1 − p)^(k−1) p for k = 1, 2, .... Its mean is 1/p. The geometric distribution is memoryless: given that no success has occurred in the first m trials, the remaining wait has the same distribution as the original wait.

The Poisson distribution with rate λ has P(X = k) = e^(−λ) λ^k / k! for k = 0, 1, 2, .... Its mean and variance are both λ. It arises as the limit of a binomial with n large and p small while np = λ stays fixed, which is why it models counts of rare events in a fixed interval: typos on a page, calls arriving in a minute, radioactive decays in a second.

Choosing the right distribution is a matter of matching the story. Fixed number of trials and a count of successes: binomial. Waiting for the first success: geometric. Counting rare events at a steady rate: Poisson. Learning to recognise these stories is the main skill assessed in the first examination.

        if (dayIndex > 0 && prevTitles.length) chunks.push({ id: L.uid('k'), kind: 'review', title: `Review · ${clean(prevTitles[0])}`, hint: 'Recall yesterday\'s key ideas without looking, then check them against the pages.', minutes: 10, done: null });
        const focus = chunks.filter((k) => k.kind === 'read').map((k) => k.title);
        if (w.kind === 'final' || w.kind === 'midterm') chunks.push({ id: L.uid('k'), kind: 'practise', title: `Practise · ${w.kind === 'final' ? 'final exam' : 'midterm'}`, hint: `Work problems across ${w.kind === 'final' ? 'the whole course' : 'weeks 1–' + midWeek}; time yourself.`, minutes: practiseMin, done: null });
        else chunks.push({ id: L.uid('k'), kind: 'practise', title: `Practise · ${clean(focus[0] || prevTitles[0] || w.title)}`, hint: 'Rework the examples, then write two problems of your own and solve them.', minutes: practiseMin, done: null });
        const minutes = L.sum(chunks.map((k) => k.minutes));
        sessions.push({ id: L.uid('s'), week: w.n, day: d.day, date: d.date, start: slot.start, minutes, kind: 'Study block', topic: focus.length ? focus[0].replace(/ · part \d+$/, '') : (w.kind === 'final' ? 'Review' : w.title), chunks });
        prevTitles = focus.length ? focus : prevTitles;
        dayIndex++;
      });
      // leftover reading (rare rounding) lands on the week's last day
      while (ri < reading.length) { const r = reading[ri++]; const loc = locateIn(r.from, r.to); const last = sessions[sessions.length - 1]; last.chunks.splice(last.chunks.findIndex((k) => k.kind !== 'read'), 0, { id: L.uid('k'), kind: 'read', title: shortTitle(r.title), segment: r.segment, from: r.from, to: r.to, pages: loc.pages, source: loc.source ? loc.source.id : null, minutes: r.minutes, done: null }); last.minutes += r.minutes; }
    }

    // weights
    let weights = weeks < 5 ? { quiz: 20, pset: 30, final: 45, participation: 5 }
      : weeks < 8 ? { quiz: 15, pset: 25, midterm: 20, final: 35, participation: 5 }
        : { quiz: 10, pset: 20, midterm: 20, project: 15, final: 30, participation: 5 };
    for (const k of Object.keys(weights)) if (k !== 'participation' && !assessments.some((a) => a.kind === k)) { weights.final += weights[k]; delete weights[k]; }
    const policy = { weights, late: { perDayPct: 10, maxDays: 3 }, scale: 'standard', withdrawBefore: D.iso(D.addDays(start, Math.floor(weeks * 7 * 0.6))) };

    // identity
    const levelNo = analysis.level === 'advanced' ? 3 : analysis.level === 'intermediate' ? 2 : 1;
    const seq = 1 + L.S.courses.filter((c) => c.subjectCode === analysis.subjectCode).length;
    const code = `${analysis.subjectCode} ${levelNo}${String(seq).padStart(2, '0')}`;
    const colorUse = COLORS.map((h) => L.S.courses.filter((c) => c.color === h).length);
    const color = COLORS[colorUse.indexOf(Math.min(...colorUse))]; // least used; ties go to the first free, so course 1 is cyan, 2 amber…

    return {
      code, title: analysis.title, subject: analysis.subject, subjectCode: analysis.subjectCode, level: analysis.level, difficulty: analysis.difficulty,
      description: analysis.description, prerequisites: analysis.prerequisites || [], credits, color,
      material: { sources: sources.map((s) => ({ id: s.id, name: s.name, kind: s.kind, words: s.words, chars: s.chars, pages: s.pages, url: s.url, offset: s.offset || 0, pageStarts: s.pageStarts, hasFile: !!s.file })), words, chars: text.length, segments: segments.map((g) => ({ i: g.i, title: g.title, start: g.start, end: g.end, words: g.words, role: g.role || 'body' })) },
      analysis: { source: analysis.source || 'offline', model: analysis.model, note: analysis.note, units },
      term, plan: { pace: paceKey, paceLabel: pace.label, hoursPerWeek, totalHours: Math.round(totalHours * 10) / 10, slot, studyDays, minutesPerDay, sessionsPerWeek: studyDays.length, reduced },
      weeks: weeksOut, sessions, assessments, policy, notes: {},
      sourcesText: text, sourceFiles: sources.filter((s) => s.file).map((s) => ({ id: s.id, file: s.file })),
    };
  }
  function locateWith(sources, from, to) {
    let src = sources[0];
    for (const s of sources) if ((s.offset || 0) <= from) src = s;
    if (!src || !src.pageStarts) return { source: src, pages: null };
    const pageOf = (off) => { const rel = off - (src.offset || 0); let p = 0; for (let i = 0; i < src.pageStarts.length; i++) if (src.pageStarts[i] <= rel) p = i; return p + 1; };
    return { source: src, pages: [pageOf(from), pageOf(Math.max(from, to - 1))] };
  }

  // The three pacings. Each is a full prospectus or { unavailable } — a throw only when all three are impossible.
  function plans(input) {
    const out = {};
    const errs = [];
    for (const key of Object.keys(PACES)) {
      try { out[key] = buildPlan(Object.assign({}, input, { paceKey: key })); }
      catch (e) { out[key] = { pace: key, paceLabel: PACES[key].label, unavailable: e.message, code: e.code }; errs.push(e); }
    }
    if (!Object.keys(PACES).some((k) => !out[k].unavailable)) throw errs[0] || new RegistrarError('budget', 'No pacing fits your study budget.');
    return out;
  }
  const plan = (input) => plans(input).standard; // kept for tools that want one prospectus

  async function enrol(prospectus, contract) {
    if (prospectus.unavailable) throw new Error(prospectus.unavailable);
    if (!contract || !contract.signature || !contract.name) throw new Error('Enrolment needs a signed registration contract.');
    const no = contract.no || L.papers.contractNo();
    const textHash = await L.sha256(L.papers.contractText(prospectus, L.S.student, no));
    const c = Object.assign({}, prospectus, { id: L.uid('c'), createdAt: new Date(L.now()).toISOString(), state: 'enrolled', contract: { no, signedAt: new Date(L.now()).toISOString(), name: contract.name, signature: contract.signature, textHash } });
    const text = c.sourcesText; delete c.sourcesText;
    const files = c.sourceFiles || []; delete c.sourceFiles;
    // the record comes first; a storage failure for the material must never lose the enrolment
    L.S.courses.push(c);
    L.saveNow();
    const problems = [];
    try { await L.db.putMaterial(c.id, text); } catch (e) { console.error(e); c.material.textStored = false; problems.push('the text copy'); }
    for (const f of files) {
      try { await L.db.putFile(f.id, f.file); }
      catch (e) { console.error(e); const src = c.material.sources.find((x) => x.id === f.id); if (src) src.hasFile = false; problems.push(`the original of ${f.file.name || 'a file'}`); }
    }
    await L.ledger.append('contract_signed', { courseId: c.id, no, textHash, name: contract.name });
    await L.ledger.append('enrolled', { courseId: c.id, code: c.code, title: c.title, weeks: c.term.weeks, start: c.term.start, end: c.term.end, hoursPerWeek: c.plan.hoursPerWeek, pace: c.plan.pace });
    L.saveNow();
    if (problems.length && L.ui) L.ui.toast(`Enrolled, but this device could not store ${problems.join(' and ')}. Reading will use what is available.`, 'warn', 8000);
    return c;
  }

  async function withdraw(courseId) {
    const c = course(courseId);
    if (!c || c.state !== 'enrolled') throw new Error('This course is not active.');
    const st = courseState(c);
    if (st === 'completed') throw new Error(`${c.code} has ended. The grade stands.`);
    if (D.iso(L.today()) >= c.policy.withdrawBefore) throw new Error(`The withdrawal deadline for ${c.code} was ${L.fmt.date(D.addDays(D.parse(c.policy.withdrawBefore), -1))}. The grade will stand.`);
    c.state = 'withdrawn';
    c.withdrawnAt = new Date(L.now()).toISOString();
    c.final = { pct: null, letter: 'W', at: c.withdrawnAt };
    await L.ledger.append('withdrawn', { courseId: c.id, code: c.code, week: currentWeek(c) });
    L.save();
  }

  // ---------- calendar queries ----------
  function sessionsOn(date) {
    const d = D.iso(date);
    const out = [];
    for (const c of L.S.courses) if (c.state === 'enrolled') for (const s of c.sessions) if (s.date === d) out.push({ course: c, session: s });
    return out.sort((a, b) => a.session.start - b.session.start);
  }
  function deadlines({ from, to }) {
    const a = ms(from), z = ms(to);
    const out = [];
    for (const c of L.S.courses) if (c.state === 'enrolled') for (const x of c.assessments) { const t = ms(x.dueAt); if (t >= a && t <= z) out.push({ course: c, assessment: x, at: t }); }
    return out.sort(L.by('at'));
  }
  function nextDeadline() {
    const now = L.now();
    let best = null;
    for (const c of L.S.courses) {
      if (c.state !== 'enrolled' || courseState(c) === 'completed') continue;
      for (const a of c.assessments) {
        const st = assessmentState(c, a);
        if (!['upcoming', 'open', 'late', 'in_progress'].includes(st)) continue;
        const t = st === 'late' ? ms(a.closesAt) : st === 'in_progress' ? deadline(c, a) : ms(a.dueAt);
        if (t >= now && (!best || t < best.at)) best = { course: c, assessment: a, at: t };
      }
    }
    return best;
  }
  function load(weekStart) {
    const d = weekStart ? D.iso(weekStart) : D.iso(D.addDays(L.today(), -D.dow(L.today())));
    const end = D.iso(D.addDays(D.parse(d), 6));
    const hours = L.sum(L.S.courses.filter((c) => c.state === 'enrolled' && c.term.start <= end && c.term.end >= d).map((c) => c.plan.hoursPerWeek));
    return { hours, budget: Number(L.S.settings.weeklyHours) || 12 };
  }

  // ---------- grades ----------
  const letter = (pct) => SCALE.find(([min]) => pct >= min)[1];
  const points = (lt) => (SCALE.find(([, l]) => l === lt) || [0, 'F', 0])[2];
  function standing(c, { finalise = false } = {}) {
    const today = D.iso(L.today());
    const cats = [];
    let contribSum = 0, weightUsed = 0, gradedAvgSum = 0, gradedN = 0;
    for (const [kind, weight] of Object.entries(c.policy.weights)) {
      if (kind === 'participation' || !weight) continue;
      const items = c.assessments.filter((a) => a.kind === kind);
      const done = items.filter((a) => a.grade);
      const avg = done.length ? L.sum(done.map((a) => a.grade.pct)) / (finalise ? items.length : done.length) : (finalise ? 0 : null);
      const contrib = avg == null ? null : (weight * avg) / 100;
      cats.push({ kind, weight, done: done.length, total: items.length, avg, contrib });
      if (contrib != null) { contribSum += contrib; weightUsed += weight; }
      done.forEach((a) => { gradedAvgSum += a.grade.pct; gradedN++; });
    }
    // participation = chunks done on their day (full credit) or later (half), over chunks due so far
    // a day's chunks fall due at the end of that day; today's count only once they are done
    const dueChunks = c.sessions.filter((s) => finalise || s.date <= today).flatMap((s) => s.chunks.filter((ch) => finalise || s.date < today || ch.done).map((ch) => ({ s, ch })));
    const credit = L.sum(dueChunks.map(({ s, ch }) => (!ch.done ? 0 : D.iso(ch.done) <= s.date ? 1 : 0.5)));
    const done = dueChunks.filter(({ ch }) => ch.done).length;
    const pw = c.policy.weights.participation || 0;
    const participation = { done, due: dueChunks.length, credit, weight: pw, avg: dueChunks.length ? (credit / dueChunks.length) * 100 : null };
    if (pw && dueChunks.length) {
      cats.push({ kind: 'participation', weight: pw, done, total: dueChunks.length, avg: participation.avg, contrib: (pw * participation.avg) / 100 });
      contribSum += (pw * participation.avg) / 100; weightUsed += pw;
    }
    const current = weightUsed ? (contribSum / weightUsed) * 100 : null;
    // projection: ungraded items assumed at the running average of graded work
    let projected = null;
    if (gradedN) {
      const runAvg = gradedAvgSum / gradedN;
      let sum = 0;
      for (const [kind, weight] of Object.entries(c.policy.weights)) {
        if (kind === 'participation') { sum += weight * (participation.avg == null ? runAvg : participation.avg) / 100; continue; }
        const items = c.assessments.filter((a) => a.kind === kind);
        if (!items.length) continue;
        const avg = L.sum(items.map((a) => (a.grade ? a.grade.pct : runAvg))) / items.length;
        sum += (weight * avg) / 100;
      }
      projected = sum;
    }
    return { current, projected, letter: current == null ? null : letter(current), categories: cats, participation };
  }
  function gpa() {
    const done = L.S.courses.filter((c) => c.final && c.final.letter !== 'W');
    const credits = L.sum(done.map((c) => c.credits));
    const g = credits ? L.sum(done.map((c) => points(c.final.letter) * c.credits)) / credits : null;
    return { gpa: g == null ? null : Math.round(g * 100) / 100, credits, completed: done.length };
  }

  // ---------- assessment lifecycle ----------
  function assessmentState(c, a) {
    if (a.grade) return a.grade.missed ? 'missed' : 'graded';
    if (a.attempt && a.attempt.startedAt && !a.attempt.submittedAt) return 'in_progress';
    const now = L.now();
    if (now < ms(a.opensAt)) return 'upcoming';
    if (now < ms(a.dueAt)) return 'open';
    if (a.lateAllowed && now < ms(a.closesAt)) return 'late';
    return 'missed';
  }
  function deadline(c, a) {
    if (!a.attempt || !a.attempt.startedAt || a.attempt.submittedAt) return null;
    const close = ms(a.closesAt);
    if (!a.durationMin) return close;
    return Math.min(ms(a.attempt.startedAt) + a.durationMin * 60000, close);
  }
  function find(courseId, aid) {
    const c = course(courseId); if (!c) throw new Error('Unknown course.');
    const a = c.assessments.find((x) => x.id === aid); if (!a) throw new Error('Unknown assessment.');
    return { c, a };
  }
  async function materialFor(c, weekNs) {
    const text = (await L.db.getMaterial(c.id)) || '';
    const segIdx = new Set();
    for (const n of weekNs) { const w = week(c, n); if (w) w.segments.forEach((i) => segIdx.add(i)); }
    const segs = c.material.segments.filter((s) => segIdx.has(s.i));
    if (!segs.length || !text) return text;
    return segs.map((s) => `${s.title}\n\n${text.slice(s.start, s.end).trim()}`).join('\n\n');
  }
  async function complete(courseId, sessionId, chunkId) {
    const c = course(courseId); if (!c) throw new Error('Unknown course.');
    const s = c.sessions.find((x) => x.id === sessionId); if (!s) throw new Error('Unknown study block.');
    const ch = s.chunks.find((x) => x.id === chunkId); if (!ch) throw new Error('Unknown chunk.');
    if (ch.done) return 'already';
    const today = D.iso(L.today());
    if (today < s.date) return 'not_yet';
    ch.done = new Date(L.now()).toISOString();
    await L.ledger.append('chunk_completed', { courseId: c.id, ref: s.id, chunk: ch.id, week: s.week, onTime: today === s.date, title: ch.title });
    L.save();
    return today === s.date ? 'done' : 'late';
  }
  // which page range of which source a char range of the material falls on
  function locate(c, from, to) {
    const srcs = c.material.sources;
    let src = srcs[0];
    for (const s of srcs) if ((s.offset || 0) <= from) src = s;
    if (!src || !src.pageStarts) return { source: src, pages: null };
    const pageOf = (off) => { const rel = off - (src.offset || 0); let p = 0; for (let i = 0; i < src.pageStarts.length; i++) if (src.pageStarts[i] <= rel) p = i; return p + 1; };
    return { source: src, pages: [pageOf(from), pageOf(Math.max(from, to - 1))] };
  }
  async function begin(courseId, aid, { onLog } = {}) {
    const { c, a } = find(courseId, aid);
    const st = assessmentState(c, a);
    if (st === 'in_progress') return;
    if (st === 'graded') throw new Error('This assessment has already been submitted.');
    if (st === 'missed') throw new Error('This assessment was missed. It is recorded as 0.');
    if (st === 'upcoming') throw new Error(`This assessment is not open. It opens ${L.fmt.dt(a.opensAt)}.`);
    const log = onLog || (() => {});
    if (!a.paper) {
      log('Assembling the covered material…');
      const text = await materialFor(c, a.coversWeeks);
      log(L.faculty.available() ? 'Setting the paper…' : 'Setting the paper (offline examiner)…');
      const r = await L.faculty.composePaper({ course: c, assessment: a, text, onModel: (m) => log(`Faculty: ${m}`) });
      // the state may have been re-rendered while we waited; write to the live object
      const live = find(courseId, aid);
      if (live.a.paper) return;
      live.a.paper = r.paper;
      if (r.note) log(r.note);
    }
    const live = find(courseId, aid);
    if (assessmentState(live.c, live.a) !== st && assessmentState(live.c, live.a) !== 'in_progress') throw new Error('The window closed while the paper was being set.');
    live.a.attempt = { startedAt: new Date(L.now()).toISOString(), answers: {}, submittedAt: null };
    await L.ledger.append('assessment_started', { courseId: c.id, ref: a.id, kind: a.kind, seal: live.a.paper.seal, source: live.a.paper.source });
    L.save();
  }
  function answer(courseId, aid, qid, value) {
    const { c, a } = find(courseId, aid);
    if (assessmentState(c, a) !== 'in_progress') return false;
    const dl = deadline(c, a);
    if (dl && L.now() > dl) return false;
    a.attempt.answers[qid] = value;
    L.save();
    return true;
  }
  const submitting = new Set();
  async function submit(courseId, aid, { auto = false } = {}) {
    const { c, a } = find(courseId, aid);
    if (assessmentState(c, a) !== 'in_progress') throw new Error('This assessment is not in progress.');
    if (submitting.has(aid)) throw new Error('Already submitting.');
    submitting.add(aid);
    try {
      const dl = deadline(c, a);
      const when = auto ? dl : Math.min(L.now(), dl || L.now());
      a.attempt.submittedAt = new Date(when).toISOString();
      a.attempt.auto = auto;
      const answered = a.paper.questions.filter((q) => String(a.attempt.answers[q.id] ?? '').trim() !== '').length;
      await L.ledger.append('assessment_submitted', { courseId: c.id, ref: a.id, auto, answered, of: a.paper.questions.length });
      const r = await L.faculty.grade({ course: c, assessment: a, paper: a.paper, answers: a.attempt.answers });
      const pts = L.sum(r.results.map((x) => x.points));
      const max = L.sum(a.paper.questions.map((q) => q.points));
      const rawPct = max ? (pts / max) * 100 : 0;
      let days = 0, penaltyPct = 0;
      if (when > ms(a.dueAt) && a.lateAllowed) {
        days = Math.ceil((when - ms(a.dueAt)) / DAY);
        penaltyPct = Math.min(days * c.policy.late.perDayPct, c.policy.late.maxDays * c.policy.late.perDayPct);
      }
      const pct = Math.round(rawPct * (1 - penaltyPct / 100) * 10) / 10;
      a.grade = { pct, points: pts, max, rawPct: Math.round(rawPct * 10) / 10, late: { days, penaltyPct }, missed: false, source: r.source, model: r.model, note: r.note, results: r.results, at: new Date(L.now()).toISOString(), letter: letter(pct) };
      await L.ledger.append('assessment_graded', { courseId: c.id, ref: a.id, pct, rawPct: a.grade.rawPct, penaltyPct, source: r.source, model: r.model || null });
      L.save();
      return a.grade;
    } finally { submitting.delete(aid); }
  }
  let sweeping = null;
  function sweep() {
    if (sweeping) return sweeping;
    sweeping = (async () => {
      let changed = false;
      for (const c of L.S.courses) {
        if (c.state !== 'enrolled') continue;
        for (const a of c.assessments) {
          const st = assessmentState(c, a);
          if (st === 'in_progress') {
            const dl = deadline(c, a);
            if (dl && L.now() >= dl) { try { await submit(c.id, a.id, { auto: true }); changed = true; } catch (e) { console.error(e); } }
          } else if (st === 'missed' && !a.grade) {
            a.grade = { pct: 0, points: 0, max: 0, rawPct: 0, late: { days: 0, penaltyPct: 0 }, missed: true, source: 'registrar', results: [], at: new Date(L.now()).toISOString(), letter: 'F' };
            await L.ledger.append('assessment_missed', { courseId: c.id, ref: a.id, kind: a.kind, closedAt: a.closesAt });
            changed = true;
          }
        }
        if (!c.final && courseState(c) === 'completed') {
          const s = standing(c, { finalise: true });
          const pct = Math.round((s.current || 0) * 10) / 10;
          c.final = { pct, letter: letter(pct), at: new Date(L.now()).toISOString() };
          await L.ledger.append('course_completed', { courseId: c.id, code: c.code, pct, letter: c.final.letter });
          if (L.papers) { try { await L.papers.issueCertificate(c); } catch (e) { console.error(e); } }
          changed = true;
        }
      }
      if (changed) { L.save(); L.emit('state'); }
    })().finally(() => { sweeping = null; });
    return sweeping;
  }

  // ---------- streaks and stats (over every enrolled course) ----------
  function stats() {
    const today = D.iso(L.today());
    const byDay = {}; // date → { due, done, onTime, minutes }
    const perCourse = [];
    for (const c of L.S.courses) {
      if (c.state !== 'enrolled') continue;
      let cDue = 0, cDone = 0, cOn = 0;
      for (const s of c.sessions) {
        if (s.date > today) continue;
        const d = byDay[s.date] || (byDay[s.date] = { due: 0, done: 0, onTime: 0, minutes: 0 });
        for (const k of s.chunks) {
          d.due++; cDue++;
          if (k.done) { d.done++; cDone++; d.minutes += k.minutes; if (D.iso(k.done) <= s.date) { d.onTime++; cOn++; } }
        }
      }
      // course streak: consecutive study days, ending today or yesterday, fully done on the day
      let streak = 0;
      const days = c.sessions.filter((s) => s.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1));
      for (const s of days) {
        const full = s.chunks.length && s.chunks.every((k) => k.done && D.iso(k.done) <= s.date);
        if (s.date === today && !full) continue; // today is still open
        if (full) streak++; else break;
      }
      perCourse.push({ course: c, due: cDue, done: cDone, rate: cDue ? cDone / cDue : null, onTime: cDone ? cOn / cDone : null, streak });
    }
    const dates = Object.keys(byDay).sort();
    let streak = 0, longest = 0, run = 0, perfect = 0, partial = 0, missed = 0;
    for (const d of dates) {
      const x = byDay[d];
      const full = x.due && x.done === x.due && x.onTime === x.due;
      if (full) { run++; longest = Math.max(longest, run); perfect++; } else { run = 0; if (x.done) partial++; else missed++; }
    }
    // current streak: walk back from today (today counts only when complete)
    for (let i = dates.length - 1; i >= 0; i--) {
      const x = byDay[dates[i]];
      const full = x.due && x.done === x.due && x.onTime === x.due;
      if (dates[i] === today && !full) continue;
      if (full) streak++; else break;
    }
    // minutes studied per week for the last 8 weeks (Mon–Sun)
    const weekStart = D.addDays(L.today(), -D.dow(L.today()));
    const weekMinutes = [];

  L.MARK_INNER = '<g fill="currentColor"><g><path d="M23,55 C6,46 4,26 17,10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="15" cy="52" rx="1.9" ry="4.2" transform="rotate(-89.7 15 52)"/><ellipse cx="14.1" cy="44.4" rx="1.9" ry="4.2" transform="rotate(-1 14.1 44.4)"/><ellipse cx="8" cy="41.5" rx="1.9" ry="4.2" transform="rotate(-63.9 8 41.5)"/><ellipse cx="10.7" cy="34.7" rx="1.9" ry="4.2" transform="rotate(25 10.7 34.7)"/><ellipse cx="6.4" cy="29.5" rx="1.9" ry="4.2" transform="rotate(-38.7 6.4 29.5)"/><ellipse cx="11.6" cy="24.1" rx="1.9" ry="4.2" transform="rotate(48.8 11.6 24.1)"/><ellipse cx="9.8" cy="17.2" rx="1.9" ry="4.2" transform="rotate(-16.5 9.8 17.2)"/><ellipse cx="16.9" cy="13.5" rx="1.9" ry="4.2" transform="rotate(69.4 16.9 13.5)"/></g><g transform="matrix(-1 0 0 1 64 0)"><g><path d="M23,55 C6,46 4,26 17,10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="15" cy="52" rx="1.9" ry="4.2" transform="rotate(-89.7 15 52)"/><ellipse cx="14.1" cy="44.4" rx="1.9" ry="4.2" transform="rotate(-1 14.1 44.4)"/><ellipse cx="8" cy="41.5" rx="1.9" ry="4.2" transform="rotate(-63.9 8 41.5)"/><ellipse cx="10.7" cy="34.7" rx="1.9" ry="4.2" transform="rotate(25 10.7 34.7)"/><ellipse cx="6.4" cy="29.5" rx="1.9" ry="4.2" transform="rotate(-38.7 6.4 29.5)"/><ellipse cx="11.6" cy="24.1" rx="1.9" ry="4.2" transform="rotate(48.8 11.6 24.1)"/><ellipse cx="9.8" cy="17.2" rx="1.9" ry="4.2" transform="rotate(-16.5 9.8 17.2)"/><ellipse cx="16.9" cy="13.5" rx="1.9" ry="4.2" transform="rotate(69.4 16.9 13.5)"/></g></g><rect x="23" y="11" width="18" height="3" rx="0.8"/><rect x="25" y="14.5" width="14" height="2"/><rect x="27" y="17.5" width="1.6" height="28"/><rect x="29.1" y="17.5" width="1.6" height="28"/><rect x="31.2" y="17.5" width="1.6" height="28"/><rect x="33.3" y="17.5" width="1.6" height="28"/><rect x="35.4" y="17.5" width="1.6" height="28"/><rect x="25" y="46" width="14" height="2.2"/><rect x="22" y="48.8" width="20" height="3" rx="0.8"/></g>';
  L.logo = (big = false) => `<span class="logo${big ? ' is-big' : ''}">${L.LOGO}<span>Lyceum</span></span>`;
  // one tile per calendar day of the term: full / part / none / future / off (no study block that day)
  L.tileState = (c, iso) => {
    const s = c.sessions.find((x) => x.date === iso);
    const today = L.date.iso(L.today());
    if (!s) return 'off';
    if (iso > today) return 'future';
    const done = s.chunks.filter((k) => k.done).length;
    return done === s.chunks.length && s.chunks.length ? 'full' : done ? 'part' : 'none';
  };
  L.tilesGrid = (c) => {
    const today = L.date.iso(L.today());
    const start = L.date.parse(c.term.start), end = L.date.parse(c.term.end);
    const out = [];
    for (let d = start; d <= end; d = L.date.addDays(d, 1)) { const iso = L.date.iso(d); out.push(`<i data-v="${L.tileState(c, iso)}"${iso === today ? ' class="is-today"' : ''} title="${iso}"></i>`); }
    return `<div class="tiles-wrap"><div class="tiles" style="--ch:${L.cc(c)};--cols:${c.term.weeks}">${out.join('')}</div></div>`;
  };
  L.tilesRow = (c, days = 14) => {
    const today = L.today();
    const out = [];
    for (let i = days - 1; i >= 0; i--) { const iso = L.date.iso(L.date.addDays(today, -i)); const v = iso < c.term.start || iso > c.term.end ? 'off' : L.tileState(c, iso); out.push(`<i data-v="${v}"${i === 0 ? ' class="is-today"' : ''}></i>`); }
    return `<div class="tiles-row" style="--ch:${L.cc(c)}">${out.join('')}</div>`;
  };

  // ---------- rail ----------
  function renderRail() {
    const rail = document.getElementById('rail');
    if (!rail) return;
    const s = L.S.student;
    if (!s) { rail.innerHTML = ''; rail.hidden = true; return; }
    rail.hidden = false;
    const { name } = L.route();
    const cur = (n) => (n === name || (n === 'courses' && ['course', 'day', 'week', 'assess', 'contract', 'certificate'].includes(name)) || (n === 'settings' && ['enrol', 'record'].includes(name)) ? ' aria-current="page"' : '');
    const openNow = L.S.courses.filter((c) => c.state === 'enrolled').flatMap((c) => c.assessments.filter((a) => ['open', 'late', 'in_progress'].includes(R().assessmentState(c, a)))).length;
    const active = R().courses('active').length;
    const nd = R().nextDeadline();
    rail.innerHTML = `
      <div class="rail-brand">${L.logo()}</div>
      <nav class="rail-nav">
        <a href="#/today"${cur('today')}>${I.today}<span>Today</span>${openNow ? `<span class="badge">${openNow}</span>` : ''}</a>
        <a href="#/courses"${cur('courses')}>${I.courses}<span>Courses</span>${active ? `<span class="badge is-quiet">${active}</span>` : ''}</a>
        <a href="#/calendar"${cur('calendar')}>${I.calendar}<span>Calendar</span></a>
        <a href="#/stats"${cur('stats')}>${I.stats}<span>Stats</span></a>
        <a href="#/settings"${cur('settings')}>${I.settings}<span>More</span></a>
      </nav>
      <div class="rail-foot">
        <div class="rail-clock"><div class="big" data-clock>${L.fmt.time(L.now())}</div><div class="sub" data-clock-date>${L.fmt.date(L.now())} ${new Date(L.now()).getFullYear()}${L.S.clock.offsetMs ? ' · clock offset' : ''}</div></div>
        ${nd ? `<div class="rail-next"><span class="label">Next deadline</span><div>${esc(nd.course.code)} · ${esc(nd.assessment.title)}</div><div class="when" data-countdown="${nd.at}">${L.fmt.rel(nd.at - L.now())}</div></div>` : ''}
        <div class="rail-student"><div class="seal">${esc(s.name.trim().charAt(0).toUpperCase())}</div><div><div class="name">${esc(s.name)}</div><div class="id">${esc(s.id)}</div></div></div>
      </div>`;
  }

  // ---------- render ----------
  let current = null;
  L.render = () => {
    const main = document.getElementById('main');
    if (!main) return;
    const route = L.route();
    if (!L.S.student && route.name !== 'welcome') { L.go('/welcome'); return; }
    if (L.S.student && route.name === 'welcome') { L.go('/today'); return; }
    const view = L.views[route.name] || L.views.today;
    if (current && current.unmount) { try { current.unmount(); } catch (e) { console.error(e); } }
    current = view;
    document.title = (view.title ? (typeof view.title === 'function' ? view.title(route.params) : view.title) + ' · ' : '') + 'Lyceum';
    try { renderRail(); } catch (e) { console.error(e); }
    const busy = main.querySelector('.busy'); // keep an in-flight progress strip across re-renders
    try { main.innerHTML = view.render(route.params, route.query); }
    catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="empty"><h2>This page could not be drawn.</h2><p class="mono small">${esc(e.message)}</p><p><a class="btn mt-2" href="#/today">Back to Today</a></p></div></div>`; return; }
    if (busy) main.prepend(busy);
    main.querySelectorAll('.tiles-wrap').forEach((w) => { w.scrollLeft = w.scrollWidth; }); // long terms: show the recent weeks
    if (view.mount) { try { const r = view.mount(main, route.params, route.query); if (r && r.catch) r.catch((e) => { console.error(e); L.ui.toast(e.message || 'Something went wrong.', 'bad'); }); } catch (e) { console.error(e); } }
    L.S.ui.lastRoute = location.hash;
    window.scrollTo(0, 0);
  };

  L.boot = () => {
    document.addEventListener('click', async (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el || el.closest('#modals')) return;
      const fn = L.actions[el.dataset.act];
      if (!fn) return;
      ev.preventDefault();
      try { await fn(el, ev); } catch (e) { console.error(e); L.ui.toast(e.message || 'Something went wrong.', 'bad'); }
    });
    const onInput = (ev) => { const el = ev.target.closest('[data-in]'); if (!el) return; const fn = L.inputs[el.dataset.in]; if (fn) { try { fn(el, ev); } catch (e) { console.error(e); } } };
    document.addEventListener('input', onInput);
    document.addEventListener('change', onInput);
    window.addEventListener('hashchange', L.render);
    L.on('tick', () => {
      document.querySelectorAll('[data-clock]').forEach((n) => { n.textContent = L.fmt.time(L.now()); });
      document.querySelectorAll('[data-countdown]').forEach((n) => { n.textContent = L.fmt.rel(Number(n.dataset.countdown) - L.now()); });
      L.emit('tick-views');
    });
    let tick = 0;
    L.on('tick', () => { if (++tick % 30 === 0 && !document.querySelector('.exam')) renderRail(); });
    R().sweep().then(() => L.render()).catch((e) => { console.error(e); L.render(); });
  };

  // ---------- welcome ----------
  L.views.welcome = {
    title: 'Start',
    render() {
      return `<div class="welcome">
        ${L.logo(true)}
        <h1>Any material becomes a real course, with a real calendar.</h1>
        <p class="lede">Bring a PDF, notes or a web page. The registrar proposes three pacings; pick one and the term is fixed: a daily block of bite-sized chunks, quizzes, problem sets and exams, and a permanent record.</p>
        <ul class="rules">
          <li><span class="n">01</span><span>Dates, weights and exams are fixed once you enrol.</span></li>
          <li><span class="n">02</span><span>Papers open and close on the calendar, not when you feel ready.</span></li>
          <li><span class="n">03</span><span>One attempt each. A missed paper is a zero.</span></li>
          <li><span class="n">04</span><span>The record is permanent. Withdraw only in the first 60% of a term.</span></li>
        </ul>
        <div class="welcome-right">
          <div class="field"><label for="student-name">Your name, as it should appear on the record</label><input id="student-name" class="input" autocomplete="name" placeholder="e.g. Ada Lovelace" data-in="student-name"></div>
          <button class="btn btn-primary w-full" data-act="matriculate">Start</button>
          <span class="small muted center">One student per device.</span>
        </div>
      </div>`;
    },
    mount(root) { const i = root.querySelector('#student-name'); if (i) { i.focus(); i.addEventListener('keydown', (e) => { if (e.key === 'Enter') L.actions.matriculate(); }); } },
  };
  L.actions.matriculate = async () => {
    const name = (document.getElementById('student-name')?.value || '').trim();
    if (name.length < 2) { L.ui.toast('Enter your name to matriculate.', 'warn'); return; }
    const yr = String(new Date(L.now()).getFullYear()).slice(-2);
    const n = new Uint16Array(1); crypto.getRandomValues(n);
    L.S.student = { id: `LYC-${yr}-${String(n[0] % 10000).padStart(4, '0')}`, name, createdAt: new Date(L.now()).toISOString() };
    await L.ledger.append('matriculated', { name, id: L.S.student.id });
    L.saveNow();
    L.go('/today');
  };

  // ---------- today ----------
  const greeting = () => { const h = new Date(L.now()).getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };
  const firstName = () => (L.S.student?.name || '').trim().split(/\s+/)[0];
  const stateChip = (st) => `<span class="chip" data-state="${st}">${({ upcoming: 'Locked', open: 'Open', late: 'Late window', in_progress: 'In progress', submitted: 'Submitted', graded: 'Graded', missed: 'Missed' })[st] || st}</span>`;
  L.stateChip = stateChip;
  L.actionFor = (c, a) => {
    const st = R().assessmentState(c, a);
    const href = `#/assess/${c.id}/${a.id}`;
    if (st === 'open') return `<a class="btn btn-primary btn-sm" href="${href}">Begin</a>`;
    if (st === 'late') return `<a class="btn btn-sm" href="${href}">Submit late</a>`;
    if (st === 'in_progress') return `<a class="btn btn-primary btn-sm" href="${href}">Resume</a>`;
    if (st === 'graded' || st === 'missed') return `<a class="btn btn-quiet btn-sm" href="${href}">Review</a>`;
    return `<a class="btn btn-quiet btn-sm" href="${href}">Details</a>`;
  };

  L.views.today = {
    title: 'Today',
    render() {
      const now = L.now();
      const today = L.today();
      const courses = R().courses('active');
      const running = courses.filter((c) => R().courseState(c) === 'running');
      const week = running.length ? Math.max(...running.map((c) => R().currentWeek(c))) : 0;
      const eyebrow = `${L.fmt.dateLong(now)}${week ? ` · Week ${week} of term` : ''}`;
      if (!L.S.courses.length) {
        return `<div class="page">
          <div class="page-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h1 class="display">${greeting()}, ${esc(firstName())}.</h1><p class="lede">Nothing enrolled yet.</p></div></div>
          <div class="empty">
            <h2>Start with what you want to learn.</h2>
            <p>Drop in a PDF, a chapter, notes or a web page. You get three pacings; choose one and every study day, quiz and exam is fixed.</p>
            <div class="cols mt-3"><a class="btn btn-primary" href="#/enrol">Add a course</a><button class="btn" data-act="load-sample">Try the sample</button></div>
            <p class="small muted mt-2">The sample is six short lectures on probability.</p>
          </div>
        </div>`;
      }
      const sessions = R().sessionsOn(today);
      const todayIso = L.date.iso(today);
      const overdue = [];
      for (const c of L.S.courses) if (c.state === 'enrolled') for (const s of c.sessions) if (s.date < todayIso && s.date >= L.date.iso(L.date.addDays(today, -7))) for (const k of s.chunks) if (!k.done) overdue.push({ c, s, k });
      const openNow = [];
      for (const c of L.S.courses) if (c.state === 'enrolled') for (const a of c.assessments) { const st = R().assessmentState(c, a); if (['open', 'late', 'in_progress'].includes(st)) openNow.push({ c, a, st }); }
      const due = R().deadlines({ from: now, to: now + 7 * 86400000 }).filter(({ course: c, assessment: a }) => !a.grade && R().assessmentState(c, a) !== 'in_progress');
      const nd = R().nextDeadline();
      const todayChunks = sessions.flatMap(({ session: s }) => s.chunks);
      const todayDone = todayChunks.filter((k) => k.done).length;
      const lede = [
        todayChunks.length ? `${todayChunks.length} study chunk${todayChunks.length === 1 ? '' : 's'} today, about ${L.fmt.dur(L.sum(todayChunks.map((k) => k.minutes)))}${todayDone ? ` · ${todayDone} done` : ''}.` : 'No study block today.',
        nd ? `${esc(nd.assessment.title)} for ${esc(nd.course.code)} is due ${L.fmt.rel(nd.at - now)}.` : 'Nothing is due in the coming days.',
      ].join(' ');
      const load = R().load();
      const missed = L.S.courses.filter((c) => c.state === 'enrolled').flatMap((c) => c.assessments.filter((a) => a.grade && a.grade.missed).map((a) => ({ c, a })));
      const notices = [];
      if (L.storageProblem) notices.push(`<div class="notice" data-kind="bad"><span>${esc(L.storageProblem)}</span></div>`);
      if (L.S.clock.offsetMs) notices.push(`<div class="notice" data-kind="warn"><span>The registrar clock is offset by ${L.fmt.rel(L.S.clock.offsetMs).replace(/^in /, '')}. Every action is recorded against the offset time. <a href="#/settings">Reset</a>.</span></div>`);
      missed.slice(-3).forEach(({ c, a }) => notices.push(`<div class="notice" data-kind="bad"><span>${esc(a.title)} for ${esc(c.code)} was missed and is recorded as 0.</span></div>`));
      openNow.filter((x) => x.st === 'late').forEach(({ c, a }) => notices.push(`<div class="notice"><span>${esc(a.title)} for ${esc(c.code)} is past due. Late submissions lose ${c.policy.late.perDayPct}% per day until ${L.fmt.dt(a.closesAt)}.</span></div>`));
      const gpa = R().gpa();
      const row = (c, a, when, action) => `<div class="row"><span class="icon-sq is-sm" style="--ch:${L.cc(c)}">${esc(c.subjectCode.slice(0, 2))}</span><div class="t"><b>${esc(a.title)}</b><span>${esc(c.code)} · ${when}</span></div>${action}</div>`;
      return `<div class="page">
        <div class="page-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h1 class="display">${greeting()}, ${esc(firstName())}.</h1></div><div class="actions"><a class="btn btn-icon" href="#/enrol" aria-label="Add a course" title="Add a course">+</a></div></div>
        ${notices.length ? `<div class="stack gap-1 mb-3">${notices.join('')}</div>` : ''}
        <div class="today-grid stack gap-2">
          ${sessions.length ? sessions.map(({ course: c, session: s }) => L.studyBlock(c, s, { today: true })).join('') : `<div class="card quiet"><div class="card-body"><b>No study block today.</b><div class="small muted mt-1">${nd ? `${esc(nd.assessment.title)} for ${esc(nd.course.code)} is due ${L.fmt.rel(nd.at - now)}.` : 'Nothing is due in the coming days.'}</div></div></div>`}
          ${overdue.length ? `<div class="card"><div class="card-head"><h3>Catch up</h3><span class="small muted">${overdue.length} from earlier days</span></div><div class="card-body pt-0"><div class="chunks">${overdue.slice(0, 6).map(({ c, s, k }) => L.chunkRow(c, s, k)).join('')}</div>${overdue.length > 6 ? `<p class="small muted mt-1">… and ${overdue.length - 6} more in the course plans.</p>` : ''}</div></div>` : ''}
          ${openNow.length ? `<div class="card"><div class="card-head"><h3>Open now</h3></div><div class="card-body pt-0 rows">${openNow.map(({ c, a, st }) => row(c, a, st === 'in_progress' ? `<span data-countdown="${R().deadline(c, a)}">${L.fmt.rel(R().deadline(c, a) - now)}</span> left` : st === 'late' ? `late · closes ${L.fmt.dt(a.closesAt)}` : `due ${L.fmt.dt(a.dueAt)}`, `<a class="btn btn-sm ${st === 'in_progress' ? '' : 'btn-primary'}" href="#/assess/${c.id}/${a.id}">${st === 'in_progress' ? 'Resume' : st === 'late' ? 'Submit late' : 'Begin'}</a>`)).join('')}</div></div>` : ''}
          ${due.length ? `<div class="card"><div class="card-head"><h3>Due soon</h3><span class="small muted">next 7 days</span></div><div class="card-body pt-0 rows">${due.map(({ course: c, assessment: a, at }) => row(c, a, L.fmt.dt(at), `<a class="btn btn-sm btn-quiet" href="#/assess/${c.id}/${a.id}">Details</a>`)).join('')}</div></div>` : ''}
          ${courses.length ? `<div class="card"><div class="card-head"><h3>Standing</h3><span class="small muted">${gpa.completed ? `GPA ${gpa.gpa.toFixed(2)} · ${gpa.credits} cr` : `${load.hours} / ${load.budget} h this week`}</span></div><div class="card-body pt-0 rows">${courses.map((c) => { const st = R().standing(c); const cs = R().courseState(c); return `<a class="row" href="#/course/${c.id}"><span class="icon-sq is-sm" style="--ch:${L.cc(c)}">${esc(c.subjectCode.slice(0, 2))}</span><div class="t"><b>${esc(c.title)}</b><span>${cs === 'upcoming' ? `starts ${L.fmt.date(c.term.start)}` : `week ${R().currentWeek(c)} of ${c.term.weeks}`}${st.current == null ? '' : ` · ${L.fmt.pct(st.current)}`}</span></div><div class="letter">${st.letter || '·'}</div></a>`; }).join('')}</div></div>` : ''}
        </div>
      </div>`;
    },
  };
  L.actions['load-sample'] = () => { L.go('/enrol?sample=1'); };

  // one day's study block: heading + numbered bite-sized chunks
